<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشیار - فایل دانش</title>
    <style>
        :root { --bg: #f3f4f6; --blue: #1d4ed8; --radius: 12px; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background: var(--bg); padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; }
        .search-wrapper { background: #fff; border-radius: var(--radius); border: 2px solid #ddd; display: flex; padding: 4px; margin-bottom: 12px; }
        .search-input { flex: 1; border: none; outline: none; padding: 12px; font-size: 1.1rem; font-weight: bold; width: 100%; }
        .search-btn { background: var(--blue); color: #fff; border: none; border-radius: 8px; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        
        .tabs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 5px; margin-bottom: 15px; }
        .tab-btn { border: none; padding: 8px 2px; border-radius: 8px; color: #fff; font-size: 0.75rem; font-weight: bold; cursor: pointer; text-align: center; }
        
        .tab-dehkhoda  { background: #FF6B6B; }
        .tab-abadis    { background: #4E65FF; }
        .tab-amid      { background: #11998e; }
        .tab-moein     { background: #FC466B; }
        .tab-vajehyab  { background: #F37335; }
        .tab-wiktionary{ background: #8A2387; }
        .tab-wikipedia { background: #2b5876; }

        .results-box { background: #fff; border-radius: var(--radius); padding: 15px; min-height: 50px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card-title { color: var(--blue); font-weight: bold; margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div class="search-wrapper">
        <input type="text" id="queryInput" class="search-input" placeholder="جستجو در دانشیار..." autocomplete="off">
        <button class="search-btn" onclick="executeSearch()">جستجو</button>
    </div>

    <div class="tabs-grid">
        <button class="tab-btn tab-dehkhoda" onclick="openExternal('dehkhoda')">دهخدا</button>
        <button class="tab-btn tab-abadis" onclick="openExternal('abadis')">آبادیس</button>
        <button class="tab-btn tab-amid" onclick="openExternal('amid')">عمید</button>
        <button class="tab-btn tab-moein" onclick="openExternal('moein')">معین</button>
        <button class="tab-btn tab-vajehyab" onclick="openExternal('vajehyab')">واژه‌یاب</button>
        <button class="tab-btn tab-wiktionary" onclick="openExternal('wiktionary')">ویکی‌واژه</button>
        <button class="tab-btn tab-wikipedia" onclick="openExternal('wikipedia')">ویکی‌پدیا</button>
    </div>

    <div id="results" class="results-box">نتیجه جستجو اینجا نمایش داده می‌شود.</div>
</div>

<script>
    function openExternal(source) {
        const q = document.getElementById('queryInput').value.trim();
        if (!q) { alert('ابتدا کلمه را وارد کنید'); return; }
        
        const eq = encodeURIComponent(q);
        let url = "";

        switch(source) {
            case 'dehkhoda': url = `https://vajehyab.com/?q=${eq}&d=dehkhoda`; break;
            case 'abadis':   url = `https://abadis.ir/fatofa/${eq}/`; break;
            case 'amid':     url = `https://vajehyab.com/?q=${eq}&d=amid`; break;
            case 'moein':    url = `https://vajehyab.com/?q=${eq}&d=moein`; break;
            case 'vajehyab': url = `https://vajehyab.com/?q=${eq}`; break;
            case 'wiktionary': url = `https://fa.wiktionary.org/wiki/${eq}`; break;
            case 'wikipedia': url = `https://fa.wikipedia.org/w/index.php?search=${eq}`; break;
        }
        
        if (url) window.open(url, '_blank');
    }

    function executeSearch() {
        const q = document.getElementById('queryInput').value.trim();
        const res = document.getElementById('results');
        if (!q) return;
        
        // اینجا می‌توانید کدهای جستجوی محلی (LOCAL_DATA) قبلی خود را اضافه کنید
        res.innerHTML = `<div class="card-title">جستجوی محلی: ${q}</div><p>موردی در دیتابیس فعلی یافت نشد. از تب‌های بالا برای جستجوی آنلاین استفاده کنید.</p>`;
    }

    document.getElementById('queryInput').onkeypress = function(e) {
        if (e.keyCode === 13) executeSearch();
    };
</script>

</body>
</html>
