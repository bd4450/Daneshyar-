<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشیار - حل جدول و دانشنامه</title>
    <style>
        :root {
            --bg: #f3f4f6;
            --card: #ffffff;
            --primary: #1d4ed8;
            --primary-hover: #1e40af;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Tahoma, system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        .search-wrapper {
            background: #ffffff;
            border-radius: var(--radius);
            border: 2px solid #cbd5e1;
            display: flex;
            padding: 4px;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            padding: 12px 14px;
            font-size: 1rem;
            font-weight: bold;
            color: #1e293b;
            background: transparent;
        }

        .search-btn {
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .search-btn:active {
            background: var(--primary-hover);
        }

        .tabs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(75px, 1fr));
            gap: 5px;
            margin-bottom: 14px;
        }

        .tab-btn {
            border: none;
            padding: 8px 4px;
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: opacity 0.2s ease;
        }

        .tab-btn:active {
            opacity: 0.85;
        }

        .tab-dehkhoda  { background: #ef4444; }
        .tab-abadis    { background: #3b82f6; }
        .tab-amid      { background: #10b981; }
        .tab-moein     { background: #8b5cf6; }
        .tab-vajehyab  { background: #f59e0b; }
        .tab-wiktionary{ background: #ec4899; }
        .tab-wikidata  { background: #0284c7; }

        .results-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 8px;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--primary);
        }

        .card-badge {
            background: #dbeafe;
            color: var(--primary);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: bold;
        }

        .card-desc {
            font-size: 0.88rem;
            color: #374151;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .answers-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }

        .answer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .word-title {
            font-weight: bold;
            font-size: 0.95rem;
            color: #0f172a;
        }

        .word-meta {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .word-spelled {
            font-size: 0.8rem;
            color: var(--muted);
            letter-spacing: 1px;
        }

        .word-count {
            background: #e2e8f0;
            color: #334155;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            color: var(--muted);
            padding: 24px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="search-wrapper">
        <input type="text" id="queryInput" class="search-input" placeholder="واژه، نام نویسنده یا سوال جدول..." autocomplete="off">
        <button class="search-btn" onclick="executeSearch()">جستجو</button>
    </div>

    <!-- تب‌های دسترسی مستقیم با تصحیح پیوند ویکی‌داده -->
    <div class="tabs-grid">
        <button class="tab-btn tab-dehkhoda" onclick="openExternal('dehkhoda')">دهخدا</button>
        <button class="tab-btn tab-abadis" onclick="openExternal('abadis')">آبادیس</button>
        <button class="tab-btn tab-amid" onclick="openExternal('amid')">عمید</button>
        <button class="tab-btn tab-moein" onclick="openExternal('moein')">معین</button>
        <button class="tab-btn tab-vajehyab" onclick="openExternal('vajehyab')">واژه‌یاب</button>
        <button class="tab-btn tab-wiktionary" onclick="openExternal('wiktionary')">ویکی‌واژه</button>
        <button class="tab-btn tab-wikidata" onclick="openExternal('wikidata')">ویکی‌داده</button>
    </div>

    <div id="results" class="results-box">
        <div class="card">
            <div class="card-desc" style="text-align: center; color: var(--muted); margin-bottom: 0;">
                کلمه یا عبارت مورد نظرتان را جستجو کنید تا جواب‌های تفکیک‌شده و تعریف برای جدول ظاهر شود.
            </div>
        </div>
    </div>
</div>

<script>
    const LOCAL_DATA = [
        {
            keys: ["تولستوی", "لئو تولستوی"],
            title: "آثار لئو تولستوی",
            category: "ادبیات / جدول",
            desc: "مشهورترین آثار لئو تولستوی مناسب حل جدول:",
            items: [
                { word: "رستاخیز" },
                { word: "جنگ و صلح" },
                { word: "آنا کارنینا" },
                { word: "مرگ ایوان ایلیچ" },
                { word: "قزاق‌ها" },
                { word: "سعادت خانوادگی" },
                { word: "اعتراف" }
            ]
        },
        {
            keys: ["جزایر ژاپن", "جزیره های ژاپن", "جزیره ژاپن"],
            title: "جزایر کشور ژاپن",
            category: "جغرافیا / جدول",
            desc: "مهم‌ترین جزایر مجمع‌الجزایر ژاپن:",
            items: [
                { word: "هونشو" },
                { word: "هوکایدو" },
                { word: "کیوشو" },
                { word: "شیکوکو" },
                { word: "اوکیناوا" },
                { word: "تسوشیما" },
                { word: "سادو" }
            ]
        }
    ];

    function cleanWord(str) {
        return (str || '').replace(/[«»""''ـ\(\)\.\،]/g, '').trim();
    }

    function formatLetters(word) {
        const letters = word.replace(/\s+/g, '').split('');
        return {
            count: letters.length,
            spelled: letters.join('-')
        };
    }

    function renderItems(items) {
        return items.map(item => {
            const w = cleanWord(item.word);
            const meta = formatLetters(w);
            return `
                <div class="answer-row">
                    <span class="word-title">${w}</span>
                    <div class="word-meta">
                        <span class="word-spelled">${meta.spelled}</span>
                        <span class="word-count">${meta.count} حرف</span>
                    </div>
                </div>`;
        }).join('');
    }

    // جستجوی مطمئن و پایدار از طریق Wikidata Action API
    async function queryWikidataEntities(term) {
        try {
            const url = `https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(term)}&language=fa&uselang=fa&format=json&origin=*&limit=8`;
            const res = await fetch(url);
            if (!res.ok) return [];
            const data = await res.json();
            const search = data.search || [];

            // لیست عناوین و مفاهیم ثبت شده در ویکی‌داده
            const foundItems = [];
            search.forEach(item => {
                if (item.label && item.label !== term) {
                    foundItems.push({
                        word: item.label,
                        desc: item.description || ''
                    });
                }
            });
            return foundItems;
        } catch (e) {
            return [];
        }
    }

    // دریافت معنی و توضیح مختصر از ویکی‌واژه
    async function queryWiktionary(term) {
        try {
            const url = `https://fa.wiktionary.org/w/api.php?action=query&prop=extracts&explaintext=1&titles=${encodeURIComponent(term)}&format=json&origin=*`;
            const response = await fetch(url);
            if (!response.ok) return null;
            const data = await response.json();
            const pages = data.query?.pages || {};
            const pageId = Object.keys(pages)[0];

            if (pageId && pageId !== "-1") {
                const text = pages[pageId].extract || '';
                const lines = text.split('\n')
                    .map(l => l.trim())
                    .filter(l => l && !l.startsWith('=') && l.length > 3);
                return lines.slice(0, 3).join(' | ');
            }
            return null;
        } catch (e) {
            return null;
        }
    }

    async function executeSearch() {
        const input = document.getElementById('queryInput');
        const q = input.value.trim();
        const resContainer = document.getElementById('results');

        if (!q) {
            resContainer.innerHTML = `<div class="card"><div class="card-desc" style="text-align: center;">لطفاً کلمه‌ای برای جستجو بنویسید.</div></div>`;
            return;
        }

        // ۱. بررسی سریع داده‌های محلی
        const localMatch = LOCAL_DATA.find(item => item.keys.some(k => q.includes(k) || k.includes(q)));
        if (localMatch) {
            resContainer.innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">${localMatch.title}</span>
                        <span class="card-badge">${localMatch.category}</span>
                    </div>
                    <div class="card-desc">${localMatch.desc}</div>
                    <div class="answers-grid">
                        ${renderItems(localMatch.items)}
                    </div>
                </div>`;
            return;
        }

        resContainer.innerHTML = `<div class="card loading">در حال دریافت اطلاعات از ویکی‌داده و ویکی‌واژه...</div>`;

        try {
            const [wikiEntities, wiktionaryMeaning] = await Promise.allSettled([
                queryWikidataEntities(q),
                queryWiktionary(q)
            ]);

            const entities = (wikiEntities.status === 'fulfilled') ? wikiEntities.value : [];
            const meaning = (wiktionaryMeaning.status === 'fulfilled') ? wiktionaryMeaning.value : null;

            let html = '';

            // اگر معنی کلمه در ویکی‌واژه پیدا شد
            if (meaning) {
                const pureMeta = formatLetters(q);
                html += `
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">${q}</span>
                            <span class="card-badge">تعریف لغوی (ویکی‌واژه)</span>
                        </div>
                        <div class="card-desc">${meaning}</div>
                        <div class="answer-row">
                            <span class="word-title">${q}</span>
                            <div class="word-meta">
                                <span class="word-spelled">${pureMeta.spelled}</span>
                                <span class="word-count">${pureMeta.count} حرف</span>
                            </div>
                        </div>
                    </div>`;
            }

            // اگر رکوردها و عناوین مرتبط در ویکی‌داده پیدا شد
            if (entities.length > 0) {
                html += `
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">موارد مرتبط: ${q}</span>
                            <span class="card-badge">پایگاه ویکی‌داده</span>
                        </div>
                        <div class="card-desc">عناوین و موارد ثبت‌شده بر اساس تعداد حروف:</div>
                        <div class="answers-grid">
                            ${renderItems(entities)}
                        </div>
                    </div>`;
            }

            // در صورتی که پاسخی پیدا نشد
            if (!entities.length && !meaning) {
                const meta = formatLetters(q);
                html = `
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">${q}</span>
                            <span class="card-badge">شمارش حروف</span>
                        </div>
                        <div class="card-desc">اطلاعات مستقیمی برای این واژه پیدا نشد. برای جزئیات می‌توانید از تب‌های بالای صفحه استفاده کنید.</div>
                        <div class="answer-row">
                            <span class="word-title">${q}</span>
                            <div class="word-meta">
                                <span class="word-spelled">${meta.spelled}</span>
                                <span class="word-count">${meta.count} حرف</span>
                            </div>
                        </div>
                    </div>`;
            }

            resContainer.innerHTML = html;

        } catch (error) {
            resContainer.innerHTML = `<div class="card"><div class="card-desc" style="color: #b91c1c;">خطا در برقراری اتصال. لطفاً اینترنت را بررسی کنید.</div></div>`;
        }
    }

    // هدایت دقیق تب‌ها
    function openExternal(source) {
        const q = document.getElementById('queryInput').value.trim();
        if (!q) {
            alert('لطفاً ابتدا کلمه مورد نظر را وارد کنید.');
            return;
        }

        const eq = encodeURIComponent(q);
        const urls = {
            dehkhoda: `https://vajehyab.com/?q=${eq}&d=dehkhoda`,
            abadis: `https://abadis.ir/fatofa/${eq}/`,
            amid: `https://vajehyab.com/?q=${eq}&d=amid`,
            moein: `https://vajehyab.com/?q=${eq}&d=moein`,
            vajehyab: `https://vajehyab.com/?q=${eq}`,
            wiktionary: `https://fa.wiktionary.org/wiki/${eq}`,
            // آدرس جستجوی مستقیم و بازکننده آیتم‌ها در ویکی‌داده
            wikidata: `https://www.wikidata.org/w/index.php?search=${eq}&title=Special%3ASearch&go=برو`
        };

        if (urls[source]) {
            window.open(urls[source], '_blank');
        }
    }

    document.getElementById('queryInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            executeSearch();
        }
    });
</script>

</body>
</html>
