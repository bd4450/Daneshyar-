<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشیار - حل جدول و دانشنامه</title>
    <style>
        :root {
            --bg: #f3f4f6;
            --card: #ffffff;
            --primary: #1d4ed8;
            --text: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding: 16px 12px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 650px; }

        .search-wrapper { background: #fff; border-radius: var(--radius); border: 2px solid #d1d5db; display: flex; padding: 4px; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .search-input { flex: 1; border: none; outline: none; padding: 12px 14px; font-size: 1.05rem; font-weight: bold; width: 100%; }
        .search-btn { background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 0.95rem; font-weight: bold; cursor: pointer; }

        .tabs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(75px, 1fr)); gap: 5px; margin-bottom: 14px; }
        .tab-btn { border: none; padding: 8px 2px; border-radius: 8px; color: #fff; font-size: 0.75rem; font-weight: bold; cursor: pointer; text-align: center; }
        .tab-dehkhoda  { background: #FF6B6B; }
        .tab-abadis    { background: #3b82f6; }
        .tab-amid      { background: #10b981; }
        .tab-moein     { background: #8b5cf6; }
        .tab-vajehyab  { background: #f59e0b; }
        .tab-wiktionary{ background: #ec4899; }
        .tab-wikipedia { background: #475569; }

        .results-box { display: flex; flex-direction: column; gap: 12px; }
        .card { background: var(--card); border-radius: var(--radius); padding: 16px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid #f1f5f9; padding-bottom: 6px; }
        .card-title { font-size: 1.05rem; font-weight: bold; color: var(--primary); }
        .card-badge { background: #dbeafe; color: var(--primary); padding: 3px 8px; border-radius: 6px; font-size: 0.72rem; font-weight: bold; }
        .card-desc { font-size: 0.88rem; color: #374151; line-height: 1.6; margin-bottom: 10px; }

        .answers-grid { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
        .answer-row { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; border: 1px solid #e2e8f0; padding: 8px 12px; border-radius: 8px; }
        .word-title { font-weight: bold; font-size: 0.95rem; }
        .word-meta { display: flex; gap: 8px; align-items: center; }
        .word-spelled { font-size: 0.8rem; color: var(--muted); letter-spacing: 1px; }
        .word-count { background: #e2e8f0; color: #334155; font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }

        .loading { text-align: center; color: var(--muted); padding: 20px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="search-wrapper">
        <input type="text" id="queryInput" class="search-input" placeholder="نام نویسنده، کشور، یا سوال جدول..." autocomplete="off">
        <button class="search-btn" onclick="executeSearch()">جستجو</button>
    </div>

    <div class="tabs-grid">
        <button class="tab-btn tab-dehkhoda" onclick="openExternal('dehkhoda')">دهخدا</button>
        <button class="tab-btn tab-abadis" onclick="openExternal('abadis')">آبادیس</button>
        <button class="tab-btn tab-amid" onclick="openExternal('amid')">عمید</button>
        <button class="tab-btn tab-moein" onclick="openExternal('moein')">معین</button>
        <button class="tab-btn tab-vajehyab" onclick="openExternal('vajehyab')">واژه‌یاب</button>
        <button class="tab-btn tab-wiktionary" onclick="openExternal('wiktionary')">ویکی‌واژه</button>
        <button class="tab-btn tab-wikipedia" onclick="openExternal('wikipedia')">ویکی‌پدیا</button>
    </div>

    <div id="results" class="results-box">
        <div class="card"><div class="card-desc" style="text-align: center; color: var(--muted);">برای حل جدول، کلمه مورد نظر (مثلاً: تولستوی، جزایر ژاپن، صادق هدایت) را جستجو کنید.</div></div>
    </div>
</div>

<script>
    // پایگاه محلی سریع
    const LOCAL_DATA = [
        {
            keys: ["تولستوی", "لئو تولستوی"],
            title: "آثار لئو تولستوی",
            category: "ادبیات روسیه / جدول",
            desc: "برخی از مشهورترین آثار لئو تولستوی برای جداول متقاطع:",
            items: [
                { word: "رستاخیز" },
                { word: "جنگ و صلح" },
                { word: "آنا کارنینا" },
                { word: "مرگ ایوان ایلیچ" },
                { word: "قزاق‌ها" },
                { word: "سعادت خانوادگی" },
                { word: "اعتراف" }
            ]
        },
        {
            keys: ["جزایر ژاپن", "جزیره های ژاپن", "جزیره ژاپن"],
            title: "جزایر کشور ژاپن",
            category: "جغرافیا / جدول",
            desc: "مهم‌ترین جزایر مجمع‌الجزایر ژاپن:",
            items: [
                { word: "هونشو" },
                { word: "هوکایدو" },
                { word: "کیوشو" },
                { word: "شیکوکو" },
                { word: "اوکیناوا" },
                { word: "تسوشیما" },
                { word: "سادو" }
            ]
        }
    ];

    function cleanWord(str) {
        return str.replace(/[«»""''ـ\(\)\.\،]/g, '').trim();
    }

    function formatLetters(word) {
        const letters = word.replace(/\s+/g, '').split('');
        return {
            count: letters.length,
            spelled: letters.join('-')
        };
    }

    function renderItems(items) {
        return items.map(item => {
            const w = cleanWord(item.word);
            const meta = formatLetters(w);
            return `
                <div class="answer-row">
                    <span class="word-title">${w}</span>
                    <div class="word-meta">
                        <span class="word-spelled">${meta.spelled}</span>
                        <span class="word-count">${meta.count} حرف</span>
                    </div>
                </div>`;
        }).join('');
    }

    async function fetchFromWikipedia(query) {
        const resContainer = document.getElementById('results');
        resContainer.innerHTML = `<div class="card loading">در حال استخراج و تحلیل داده‌ها از دانشنامه ویکی‌پدیا...</div>`;

        try {
            // ۱. جستجوی نزدیک‌ترین عنوان در ویکی‌پدیا
            const searchUrl = `https://fa.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`;
            const searchRes = await fetch(searchUrl).then(r => r.json());

            if (!searchRes.query || searchRes.query.search.length === 0) {
                resContainer.innerHTML = `<div class="card"><div class="card-desc">موردی در ویکی‌پدیا پیدا نشد. از تب‌های بالای صفحه برای لغت‌نامه‌ها استفاده کنید.</div></div>`;
                return;
            }

            const pageTitle = searchRes.query.search[0].title;

            // ۲. دریافت متن کامل صفحه برای استخراج آثار یا فهرست‌ها
            const parseUrl = `https://fa.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(pageTitle)}&prop=wikitext|text&format=json&origin=*`;
            const parseRes = await fetch(parseUrl).then(r => r.json());

            const wikitext = parseRes.parse?.wikitext?.['*'] || '';
            const htmlText = parseRes.parse?.text?.['*'] || '';

            // تلاش برای استخراج آیتم‌های لیستی (آثار، موارد ستاره‌دار در متن ویکی)
            const listMatches = [];
            const lines = wikitext.split('\n');
            let isWorksSection = false;

            for (let line of lines) {
                line = line.trim();
                // شناسایی بخش آثار یا کتاب‌ها
                if (line.includes('آثار') || line.includes('کتاب‌شناسی') || line.includes('فهرست') || line.includes('فیلم‌شناسی')) {
                    isWorksSection = true;
                }
                if (line.startsWith('==') && !line.includes('آثار') && !line.includes('کتاب') && !line.includes('فهرست')) {
                    isWorksSection = false;
                }

                if (line.startsWith('*') || isWorksSection) {
                    // استخراج لینک‌های [[کتاب]]
                    const linkMatch = line.match(/\[\[([^\]\|]+)(?:\|[^\]]+)?\]\]/);
                    if (linkMatch && !linkMatch[1].startsWith('رده:') && !linkMatch[1].startsWith('پرونده:')) {
                        listMatches.push(linkMatch[1]);
                    } else if (line.startsWith('*')) {
                        const cleanLine = line.replace(/^\*+\s*/, '').replace(/\[\[|\]\]/g, '').split('(')[0].trim();
                        if (cleanLine.length > 1 && cleanLine.length < 35) {
                            listMatches.push(cleanLine);
                        }
                    }
                }
            }

            const uniqueItems = [...new Set(listMatches)].slice(0, 15);

            if (uniqueItems.length > 0) {
                // نمایش فهرست استخراج‌شده با تفکیک حروف برای جدول
                const formatted = uniqueItems.map(w => ({ word: w }));
                resContainer.innerHTML = `
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">${pageTitle}</span>
                            <span class="card-badge">استخراج‌شده از ویکی‌پدیا</span>
                        </div>
                        <div class="card-desc">موارد و آثار مرتبطِ شناسایی‌شده برای حل جدول:</div>
                        <div class="answers-grid">
                            ${renderItems(formatted)}
                        </div>
                    </div>`;
            } else {
                // اگر فهرست استخراج نشد، چکیدهٔ متن مقاله نمایش داده می‌شود
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = htmlText;
                const p = tempDiv.querySelector('p:not(.mw-empty-elt)')?.innerText || 'توضیحی در دسترس نیست.';

                resContainer.innerHTML = `
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">${pageTitle}</span>
                            <span class="card-badge">چکیده دانشنامه</span>
                        </div>
                        <div class="card-desc">${p.slice(0, 350)}...</div>
                        <div style="font-size: 0.8rem; color: var(--muted); margin-top: 8px;">برای این عنوان لیست تفکیکی یافت نشد؛ می‌توانید از تب‌های بالا برای جستجو در معین و دهخدا استفاده کنید.</div>
                    </div>`;
            }

        } catch (err) {
            resContainer.innerHTML = `<div class="card"><div class="card-desc" style="color: red;">خطا در اتصال به اینترنت یا دریافت از ویکی‌پدیا. لطفاً وضعیت شبکه را بررسی کنید.</div></div>`;
        }
    }

    function executeSearch() {
        const q = document.getElementById('queryInput').value.trim();
        const resContainer = document.getElementById('results');

        if (!q) {
            resContainer.innerHTML = `<div class="card"><div class="card-desc" style="text-align: center;">لطفاً کلمه‌ای برای جستجو وارد کنید.</div></div>`;
            return;
        }

        // ۱. بررسی پایگاه محلی
        const localMatch = LOCAL_DATA.find(item => item.keys.some(k => q.includes(k) || k.includes(q)));
        if (localMatch) {
            resContainer.innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">${localMatch.title}</span>
                        <span class="card-badge">${localMatch.category}</span>
                    </div>
                    <div class="card-desc">${localMatch.desc}</div>
                    <div class="answers-grid">
                        ${renderItems(localMatch.items)}
                    </div>
                </div>`;
            return;
        }

        // ۲. در صورت نبودن در دیتابیس محلی، دریافت زنده از ویکی‌پدیا
        fetchFromWikipedia(q);
    }

    function openExternal(source) {
        const q = document.getElementById('queryInput').value.trim();
        if (!q) {
            alert('لطفاً ابتدا کلمه مورد نظر را بنویسید.');
            return;
        }

        const eq = encodeURIComponent(q);
        const urls = {
            dehkhoda: `https://vajehyab.com/?q=${eq}&d=dehkhoda`,
            abadis: `https://abadis.ir/fatofa/${eq}/`,
            amid: `https://vajehyab.com/?q=${eq}&d=amid`,
            moein: `https://vajehyab.com/?q=${eq}&d=moein`,
            vajehyab: `https://vajehyab.com/?q=${eq}`,
            wiktionary: `https://fa.wiktionary.org/wiki/${eq}`,
            wikipedia: `https://fa.wikipedia.org/w/index.php?search=${eq}`
        };

        if (urls[source]) {
            window.open(urls[source], '_blank');
        }
    }

    document.getElementById('queryInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            executeSearch();
        }
    });
</script>

</body>
</html>
