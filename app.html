<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>دانشیار - حل جدول و دانشنامه</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Tahoma, sans-serif;
      background-color: #f1f5f9;
      margin: 0;
      padding: 10px;
      color: #0f172a;
    }
    .card {
      max-width: 680px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }
    h1 {
      margin: 0;
      text-align: center;
      font-size: 1.3rem;
      color: #1e3a8a;
    }
    .sub {
      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
      margin: 4px 0 12px;
    }
    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border: 2px solid #cbd5e1;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #2563eb;
    }
    #searchBtn {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
    }
    #searchBtn:active {
      background-color: #1d4ed8;
      transform: scale(0.97);
    }
    #status {
      font-size: 0.85rem;
      color: #2563eb;
      margin-bottom: 8px;
      text-align: center;
      font-weight: bold;
    }
    .db-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .file-label {
      background-color: #f1f5f9;
      border: 1px dashed #94a3b8;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      color: #475569;
    }
    .res-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .res-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .res-word {
      font-weight: bold;
      font-size: 1.15rem;
      color: #1e3a8a;
    }
    .res-cat {
      background: #e0e7ff;
      color: #3730a3;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #334155;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>دانشیار</h1>
    <div class="sub">دستیار تخصصی حل جدول و دانشنامه کلمات</div>

    <div class="search-row">
      <input 
        id="q" 
        type="text" 
        placeholder="کلمه، سوال یا الگو (مثال: پایتخت فرانسه، س.ل.م)" 
        autocomplete="off" 
      />
      <button id="searchBtn" type="button">جستجو</button>
    </div>

    <div class="db-actions">
      <label class="file-label">
        📂 افزودن فایل دیتابیس کلمات (اختیاری)
        <input type="file" id="dbFileInput" accept=".json,.txt" style="display:none;" />
      </label>
    </div>

    <div id="status">در حال بارگذاری و پردازش بانک واژگان...</div>
    <div id="results"></div>
  </div>

  <script>
    // بانک اصلی و هسته لغات پرتکرار جدول و اطلاعات عمومی
    let DATABASE = [
      { w: "مهر", m: ["محبت", "دوستی", "ماه اول پاییز", "خورشید", "تمبر پستی", "صداق زن", "پیمان"], cat: "چندمعنایی" },
      { w: "تیر", m: ["خدنگ", "پیکان", "ماه چهارم سال", "سیاره عطارد", "ستون سقف", "گلوله جنگی"], cat: "چندمعنایی" },
      { w: "شیر", m: ["حیوان درنده", "مایع خوراکی سفید", "ابزار جریان آب", "سلطان جنگل", "نماد دلاوری"], cat: "چندمعنایی" },
      { w: "سیر", m: ["گیاه خوراکی", "متضاد گرسنه", "بیزار", "گردش و تماشا", "واحد وزن ۷۵ گرم"], cat: "چندمعنایی" },
      { w: "تار", m: ["ساز اصیل ایرانی", "رشته باریک مو", "تاریک", "تار عنکبوت"], cat: "چندمعنایی" },
      { w: "رود", m: ["جوی بزرگ آب", "ساز کهن", "فرزند و جگرگوشه"], cat: "چندمعنایی" },
      { w: "گور", m: ["قبر و مزار", "گورخر", "دشت و هامون"], cat: "چندمعنایی" },
      { w: "شانه", m: ["وسیله آرایش مو", "دوش انسان", "کندوی عسل", "کنار جاده"], cat: "چندمعنایی" },
      { w: "هوش", m: ["عقل و ذکاوت", "قوه درک", "مرگ و نابودی"], cat: "چندمعنایی" },
      { w: "چنگ", m: ["ساز زهی", "پنجه دست", "دستبرد و تسلط"], cat: "چندمعنایی" },
      { w: "برگ", m: ["اندام سبز گیاه", "توشه راه", "ساز و نوا", "ورق کاغذ"], cat: "چندمعنایی" },
      { w: "داد", m: ["عدل و انصاف", "فریاد و فغان", "بخشید و عطا کرد"], cat: "چندمعنایی" },
      { w: "باد", m: ["جریان هوا", "غرور و نخوت", "ورم و آماس"], cat: "چندمعنایی" },
      { w: "پاریس", m: ["پایتخت فرانسه", "عروس شهرها", "شهر نور"], cat: "جغرافیا" },
      { w: "لندن", m: ["پایتخت انگلیس", "شهر بیگ بن"], cat: "جغرافیا" },
      { w: "توکیو", m: ["پایتخت ژاپن"], cat: "جغرافیا" },
      { w: "مسکو", m: ["پایتخت روسیه", "کرملین"], cat: "جغرافیا" },
      { w: "قاهره", m: ["پایتخت مصر", "شهر هزار مناره"], cat: "جغرافیا" },
      { w: "رم", m: ["پایتخت ایتالیا", "شهر ابدی"], cat: "جغرافیا" },
      { w: "برلین", m: ["پایتخت آلمان"], cat: "جغرافیا" },
      { w: "نیل", m: ["طولانی‌ترین رود جهان", "رود مصر", "رنگ آبی سیر"], cat: "جغرافیا" },
      { w: "آمازون", m: ["پرآب‌ترین رود جهان", "جنگل بارانی"], cat: "جغرافیا" },
      { w: "اورست", m: ["بلندترین قله جهان", "بام دنیا"], cat: "جغرافیا" },
      { w: "دماوند", m: ["بلندترین قله ایران", "دیو سپید پای در بند"], cat: "جغرافیا" },
      { w: "بایکال", m: ["عمیق‌ترین دریاچه جهان"], cat: "جغرافیا" },
      { w: "خزر", m: ["بزرگ‌ترین دریاچه جهان", "کاسپین"], cat: "جغرافیا" },
      { w: "هیدروژن", m: ["سبک‌ترین عنصر شیمیایی", "عنصر شماره یک"], cat: "علمی" },
      { w: "جیوه", m: ["فلز مایع", "سیماب"], cat: "علمی" },
      { w: "طلا", m: ["زر", "عنصر گرانبها Au"], cat: "علمی" },
      { w: "نقره", m: ["سیم", "فلز درخشان Ag"], cat: "علمی" },
      { w: "گراهام بل", m: ["مخترع تلفن"], cat: "علمی" },
      { w: "توماس ادیسون", m: ["مخترع لامپ و برق"], cat: "علمی" },
      { w: "مارکونی", m: ["مخترع رادیو"], cat: "علمی" },
      { w: "زکریای رازی", m: ["کاشف الکل و جوهر گوگرد"], cat: "علمی" },
      { w: "ابن سینا", m: ["شیخ‌الرئیس", "نویسنده کتاب قانون"], cat: "علمی" },
      { w: "فردوسی", m: ["سراینده شاهنامه", "حکیم طوس"], cat: "ادبیات" },
      { w: "حافظ", m: ["لسان‌الغیب", "شاعر شیراز"], cat: "ادبیات" },
      { w: "سعدی", m: ["استاد سخن", "صاحب گلستان و بوستان"], cat: "ادبیات" },
      { w: "رستم", m: ["تهمتن", "پهلوان اسطوره‌ای شاهنامه"], cat: "شاهنامه" },
      { w: "رخش", m: ["اسب رستم"], cat: "شاهنامه" }
    ];

    // تابع کمکی پاکسازی متون
    function clean(str) {
      if (!str) return "";
      return str.toString()
        .replace(/[ي]/g, "ی")
        .replace(/[ك]/g, "ک")
        .replace(/[\u064B-\u065F\u0670]/g, "")
        .replace(/[\u200C\u200B]/g, " ")
        .trim();
    }

    const $ = (id) => document.getElementById(id);
    const qInput = $("q");
    const sBtn = $("searchBtn");
    const statusDiv = $("status");
    const resDiv = $("results");
    const fileInput = $("dbFileInput");

    function updateStatus() {
      statusDiv.textContent = `بانک لغات دانشیار آماده است (${DATABASE.length.toLocaleString('fa-IR')} مدخل فعال)`;
    }

    // بارگذاری فایل خارجی در صورت داشتن لیست کلمات روی گوشی
    fileInput.addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (!file) return;

      statusDiv.textContent = "در حال بارگذاری فایل...";
      const reader = new FileReader();

      reader.onload = function(evt) {
        try {
          const content = evt.target.result;
          let parsed;
          if (file.name.endsWith(".json")) {
            parsed = JSON.parse(content);
          } else {
            // اگر فایل TXT با فرمت کلمه: معنی بود
            const lines = content.split("\n");
            parsed = [];
            for (let line of lines) {
              const parts = line.split(/[:؛-]/);
              if (parts.length >= 2) {
                parsed.push({
                  w: parts[0].trim(),
                  m: [parts.slice(1).join(" ").trim()],
                  cat: "فایل اضافه شده"
                });
              }
            }
          }

          if (Array.isArray(parsed) && parsed.length > 0) {
            DATABASE = DATABASE.concat(parsed);
            updateStatus();
            alert(`تعداد ${parsed.length.toLocaleString('fa-IR')} مدخل جدید با موفقیت اضافه شد!`);
          } else {
            alert("ساختار فایل خوانده نشد. لطفاً از فایل JSON استاندارد یا متنی استفاده کنید.");
          }
        } catch (err) {
          alert("خطا در پردازش فایل: " + err.message);
        }
      };

      reader.readAsText(file, "UTF-8");
    });

    function doSearch() {
      const raw = qInput.value.trim();
      const q = clean(raw);

      if (!q) {
        statusDiv.textContent = "عبارتی وارد کنید.";
        resDiv.innerHTML = "";
        return;
      }

      statusDiv.textContent = "در حال جستجو...";
      const isPattern = /[._?؟]/.test(q);
      let found = [];
      const MAX_RESULTS = 100; // محدودیت برای روان ماندن گوشی

      if (isPattern) {
        const rxStr = "^" + q.replace(/\s+/g, "").replace(/[.?؟_]/g, ".") + "$";
        const rx = new RegExp(rxStr);

        for (let i = 0; i < DATABASE.length; i++) {
          if (rx.test(clean(DATABASE[i].w))) {
            found.push(DATABASE[i]);
            if (found.length >= MAX_RESULTS) break;
          }
        }
      } else {
        const queryWords = q.split(/\s+/).filter(Boolean);

        for (let i = 0; i < DATABASE.length; i++) {
          const item = DATABASE[i];
          const word = clean(item.w);
          const mText = clean(Array.isArray(item.m) ? item.m.join(" ") : item.m);

          if (word === q || word.includes(q)) {
            found.push(item);
            if (found.length >= MAX_RESULTS) break;
            continue;
          }

          const matchAll = queryWords.every(qw => word.includes(qw) || mText.includes(qw));
          if (matchAll) {
            found.push(item);
            if (found.length >= MAX_RESULTS) break;
          }
        }
      }

      if (found.length === 0) {
        statusDiv.textContent = "موردی پیدا نشد.";
        resDiv.innerHTML = "<div style='text-align:center; padding:20px; color:#94a3b8;'>نتیجه‌ای با این عبارت ثبت نشده است.</div>";
        return;
      }

      statusDiv.textContent = `${found.length} مورد نمایش داده شد:`;

      resDiv.innerHTML = found.map(item => `
        <div class="res-item">
          <div class="res-header">
            <span class="res-word">${item.w}</span>
            <span class="res-cat">${item.cat || "عمومی"}</span>
          </div>
          <div class="tags-container">
            ${(Array.isArray(item.m) ? item.m : [item.m]).map(tag => `<span class="tag">${tag}</span>`).join("")}
          </div>
        </div>
      `).join("");
    }

    sBtn.addEventListener("click", doSearch);
    qInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") doSearch();
    });

    window.onload = updateStatus;
  </script>
</body>
</html>
