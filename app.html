<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشیار - جستجوی هوشمند</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Tahoma, sans-serif; background: #f0f2f5; padding: 12px; margin: 0; }
        .container { max-width: 650px; margin: auto; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h1 { font-size: 1.3rem; text-align: center; color: #1e293b; margin: 10px 0; }
        #status { font-size: 0.85rem; color: #64748b; text-align: center; margin-bottom: 12px; background: #f8fafc; padding: 8px; border-radius: 6px; }
        .search-area { display: flex; gap: 8px; margin-bottom: 15px; }
        input { flex: 1; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 6px; font-size: 1rem; outline: none; }
        input:focus { border-color: #2563eb; }
        button { padding: 12px 24px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; }
        button:active { background: #1d4ed8; }
        .result-item { padding: 12px 8px; border-bottom: 1px solid #f1f5f9; line-height: 1.7; }
        .result-item:last-child { border-bottom: none; }
        .word { font-weight: bold; color: #1e40af; font-size: 1.1rem; margin-bottom: 3px; }
        .meaning { color: #334155; font-size: 0.95rem; text-align: justify; }
        .source { color: #94a3b8; font-size: 0.75rem; margin-top: 4px; }
        .not-found { text-align: center; color: #94a3b8; padding: 25px 0; font-size: 0.95rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>دانشیار</h1>
    <div id="status">در حال بارگذاری لغت‌نامه‌ها... لطفاً چند لحظه صبر کنید.</div>
    
    <div class="search-area">
        <input type="text" id="query" placeholder="کلمه مورد نظر را وارد کنید...">
        <button onclick="search()">جستجو</button>
    </div>
    
    <div id="results"></div>
</div>

<!-- تلاش برای خواندن به شیوه اسکریپت قدیمی (در صورت وجود متغیر) -->
<script src="dehkhoda.js"></script>
<script src="amid.js"></script>
<script src="moein.js"></script>
<script src="abadis.js"></script>

<script>
    let allData = [];

    // تابع پاکسازی و یکنواخت‌سازی حروف فارسی و حذف اعراب
    function cleanText(str) {
        if (!str) return "";
        return String(str)
            .replace(/[\u064B-\u065F\u0670]/g, '')
            .replace(/ي/g, "ی")
            .replace(/ك/g, "ک")
            .replace(/ة/g, "ه")
            .replace(/آ/g, "ا")
            .replace(/[\u200B-\u200D\uFEFF]/g, '')
            .trim()
            .toLowerCase();
    }

    // تابع کمکی برای پردازش داده‌ها و افزودن به حافظه
    function processArray(arr, sourceName) {
        if (!Array.isArray(arr)) return;
        arr.forEach(item => {
            const word = item.word || item.w || item.title || "";
            const meaning = item.def || item.meaning || item.m || item.desc || "";
            if (word || meaning) {
                allData.push({
                    w: word,
                    m: meaning,
                    src: sourceName,
                    cleanW: cleanText(word),
                    cleanM: cleanText(meaning)
                });
            }
        });
    }

    // تابع بارگذاری هوشمند فایل (چه متغیر داشته باشد چه فایل متنی خام باشد)
    async function loadDatabaseFile(fileName, sourceName, fallbackVar) {
        // ۱. اگر متغیر از قبل در صفحه بود
        if (fallbackVar && Array.isArray(fallbackVar) && fallbackVar.length > 0) {
            processArray(fallbackVar, sourceName);
            return true;
        }

        // ۲. اگر متغیر نبود، فایل را به‌صورت متن مستقیم دانلود و تحلیل می‌کند
        try {
            const response = await fetch(fileName);
            if (!response.ok) return false;
            let text = await response.text();
            
            // تمیزکاری: اگر فایل با نام متغیر شروع شده بود حذفش می‌کند تا JSON خالص شود
            const eqIndex = text.indexOf('=');
            if (eqIndex !== -1 && eqIndex < 50) {
                text = text.substring(eqIndex + 1).trim();
            }
            if (text.endsWith(';')) {
                text = text.slice(0, -1).trim();
            }

            const data = JSON.parse(text);
            processArray(data, sourceName);
            return true;
        } catch (e) {
            return false;
        }
    }

    // بارگذاری همزمان تمام فایل‌ها
    window.onload = async function() {
        const statusEl = document.getElementById('status');
        
        await Promise.all([
            loadDatabaseFile('dehkhoda.js', 'دهخدا', window.dehkhoda),
            loadDatabaseFile('amid.js', 'عمید', window.amid),
            loadDatabaseFile('moein.js', 'معین', window.moein),
            loadDatabaseFile('abadis.js', 'آبادیس', window.abadis)
        ]);

        if (allData.length > 0) {
            statusEl.innerText = `تعداد کل مدخل‌ها: ${allData.length.toLocaleString('fa-IR')} کلمه بارگذاری شد. آماده جستجو.`;
            statusEl.style.color = "#16a34a";
        } else {
            statusEl.innerText = "خطا: هیچ داده‌ای بارگذاری نشد. لطفاً مطمئن شوید فایل‌ها در کنار app.html قرار دارند.";
            statusEl.style.color = "#dc2626";
        }
    };

    // موتور جستجو
    function search() {
        const rawQuery = document.getElementById('query').value;
        const q = cleanText(rawQuery);
        const resultsDiv = document.getElementById('results');
        
        if (!q) {
            resultsDiv.innerHTML = '<div class="not-found">لطفاً کلمه‌ای برای جستجو وارد کنید.</div>';
            return;
        }

        resultsDiv.innerHTML = "";
        let count = 0;
        const fragment = document.createDocumentFragment();

        for (let i = 0; i < allData.length; i++) {
            const item = allData[i];
            
            // اولویت با پیدا شدن در خود کلمه یا متن معنی
            if (item.cleanW.includes(q) || item.cleanM.includes(q)) {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = `
                    <div class="word">${item.w}</div>
                    <div class="meaning">${item.m}</div>
                    <div class="source">منبع: ${item.src}</div>
                `;
                fragment.appendChild(div);
                count++;

                if (count >= 50) break; // سقف ۵۰ نتیجه برای جلوگیری از هَنگ کردن مرورگر گوشی
            }
        }

        if (count === 0) {
            resultsDiv.innerHTML = '<div class="not-found">نتیجه‌ای برای «' + rawQuery + '» یافت نشد.</div>';
        } else {
            resultsDiv.appendChild(fragment);
        }
    }

    // اجرای جستجو با اینتر کیبورد گوشی
    document.getElementById('query').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') search();
    });
</script>

</body>
</html>
