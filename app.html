<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشیار</title>
    <style>
        body { font-family: Tahoma, sans-serif; padding: 20px; background-color: #f9f9f9; }
        .box { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        #result { margin-top: 20px; padding: 15px; background: #eef; border-radius: 8px; min-height: 50px; }
    </style>
</head>
<body>

<div class="box">
    <h2>دانشیار</h2>
    <input type="text" id="searchInput" placeholder="سؤال یا کلمه خود را بنویسید...">
    <button onclick="search()">جستجو</button>
    <div id="result">نتیجه در اینجا نمایش داده می‌شود.</div>
</div>

<script>
    // دیتابیس کلمات و جواب‌ها
    const myData = [
        { q: "پایتخت ایران", a: "تهران" },
        { q: "بزرگترین سیاره", a: "مشتری" },
        { q: "زهره سنگستانی", a: "دوست قدیمی در آلمان" },
        { q: "نام برنامه", a: "دانشیار" }
    ];

    function search() {
        const query = document.getElementById("searchInput").value.toLowerCase().trim();
        const display = document.getElementById("result");
        
        if (!query) {
            display.innerText = "لطفاً چیزی بنویسید.";
            return;
        }

        const found = myData.find(item => item.q.toLowerCase().includes(query));

        if (found) {
            display.innerHTML = `<strong>جواب:</strong> ${found.a}`;
        } else {
            display.innerText = "متأسفانه چیزی پیدا نشد.";
        }
    }
</script>

</body>
</html>
