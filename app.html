<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشیار - حل جدول و دانشنامه</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1a568c; font-size: 24px; margin-top: 0; }
        .desc { text-align: center; color: #666; font-size: 13px; margin-bottom: 20px; }
        .search-box { display: flex; gap: 8px; margin-bottom: 15px; }
        input[type="text"] { flex: 1; padding: 12px; border: 2px solid #ccc; border-radius: 8px; font-size: 16px; outline: none; }
        input[type="text"]:focus { border-color: #1a568c; }
        button { padding: 12px 20px; background-color: #1a568c; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        #result { margin-top: 15px; }
        .card { background: #fafafa; border: 1px solid #e0e0e0; border-right: 5px solid #1a568c; border-radius: 8px; padding: 15px; margin-bottom: 12px; }
        .card h3 { margin: 0 0 8px 0; color: #1a568c; font-size: 17px; }
        .card p { margin: 0; font-size: 15px; line-height: 1.8; color: #333; }
        .tag { display: inline-block; background: #e1ecf4; color: #1a568c; padding: 4px 10px; margin: 3px; border-radius: 6px; font-size: 14px; font-weight: bold; }
        .badge { display: inline-block; background: #27ae60; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-bottom: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>دانشیار</h1>
    <p class="desc">دانشنامه جامع و راهنمای حل جداول متقاطع</p>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="مثال: جزایر ژاپن، کشوری اروپایی، پایتخت فرانسه...">
        <button onclick="doSearch()">جستجو</button>
    </div>

    <div id="result">
        <div class="card">
            <p>عبارت یا سوال جدول را در کادر بالا بنویسید و دکمه جستجو را بزنید.</p>
        </div>
    </div>
</div>

<script>
// بانک جامع آفلاین برای حل جدول
const tableData = [
    {
        keys: ["جزایر ژاپن", "جزیره های ژاپن", "جزائر ژاپن", "جزیره ژاپن"],
        title: "جزایر اصلی و مهم ژاپن",
        answers: ["هونشو (بزرگ‌ترین)", "هوکایدو", "کیوشو", "شیکوکو", "اوکیناوا"]
    },
    {
        keys: ["کشوری اروپایی", "کشور اروپایی", "کشورهای اروپایی"],
        title: "کشورهای اروپایی پرکاربرد در جدول",
        answers: ["آلمان", "فرانسه", "ایتالیا", "اسپانیا", "اتریش", "بلژیک", "لهستان", "سوئد", "نروژ", "یونان", "هلند", "دانمارک", "فنلاند", "سوئیس", "چک"]
    },
    {
        keys: ["کشوری آسیایی", "کشور آسیایی"],
        title: "کشورهای آسیایی پرکاربرد در جدول",
        answers: ["ژاپن", "چین", "هند", "کره جنوبی", "ویتنام", "تایلند", "مالزی", "عمان", "قطر", "یمن", "عراق", "سوریه", "لبنان"]
    },
    {
        keys: ["پایتخت فرانسه"],
        title: "پایتخت فرانسه",
        answers: ["پاریس"]
    },
    {
        keys: ["پایتخت آلمان"],
        title: "پایتخت آلمان",
        answers: ["برلین"]
    },
    {
        keys: ["رود آلمان", "رودهای آلمان"],
        title: "رودهای معروف آلمان",
        answers: ["راین", "البه", "دانوب", "وزر", "ماین"]
    },
    {
        keys: ["شاعر ایرانی", "شعرای ایرانی"],
        title: "شعرای پرکاربرد در جدول",
        answers: ["حافظ", "سعدی", "فردوسی", "مولوی", "خیام", "عطار", "نظامی", "سهراب سپهری", "پروین اعتصامی", "شهریار"]
    }
];

function doSearch() {
    const query = document.getElementById('searchInput').value.trim();
    const resultDiv = document.getElementById('result');

    if (!query) {
        resultDiv.innerHTML = '<div class="card" style="border-right-color:#e74c3c;"><p>لطفاً عبارتی را وارد کنید.</p></div>';
        return;
    }

    resultDiv.innerHTML = '<div class="card"><p>در حال جستجو...</p></div>';

    // ۱. جستجو در بانک آفلاین (پاسخ سریع و تضمینی بدون نیاز به سرور خارجی)
    let foundLocal = false;
    let localHtml = '';

    for (let item of tableData) {
        if (item.keys.some(k => query.includes(k) || k.includes(query))) {
            foundLocal = true;
            const tags = item.answers.map(a => `<span class="tag">${a}</span>`).join(' ');
            localHtml += `
                <div class="card">
                    <span class="badge">پاسخ جدول</span>
                    <h3>${item.title}</h3>
                    <div>${tags}</div>
                </div>
            `;
        }
    }

    if (foundLocal) {
        resultDiv.innerHTML = localHtml;
        return;
    }

    // ۲. اگر در بانک آفلاین نبود، جستجو در دانشنامه آنلاین
    const script = document.createElement('script');
    const callbackName = 'wikiCallback_' + Math.floor(Math.random() * 100000);
    
    window[callbackName] = function(data) {
        delete window[callbackName];
        document.body.removeChild(script);

        if (data && data.query && data.query.search && data.query.search.length > 0) {
            let html = '';
            data.query.search.slice(0, 5).forEach(item => {
                const cleanSnippet = item.snippet.replace(/<[^>]*>?/gm, '');
                html += `
                    <div class="card">
                        <span class="badge" style="background:#1a568c;">دانشنامه</span>
                        <h3>${item.title}</h3>
                        <p>${cleanSnippet}...</p>
                    </div>
                `;
            });
            resultDiv.innerHTML = html;
        } else {
            resultDiv.innerHTML = `
                <div class="card" style="border-right-color:#f39c12;">
                    <h3>نتیجه مستقیم یافت نشد</h3>
                    <p>برای نتیجه بهتر می‌توانید کلمه را کوتاه‌تر بنویسید (مثلاً به جای "${query}" فقط کلمه اصلی را وارد کنید).</p>
                </div>
            `;
        }
    };

    script.src = `https://fa.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&callback=${callbackName}`;
    script.onerror = function() {
        resultDiv.innerHTML = '<div class="card" style="border-right-color:#e74c3c;"><p>خطا در اتصال به شبکه‌ دانشنامه. لطفاً دوباره تلاش کنید.</p></div>';
    };
    
    document.body.appendChild(script);
}

document.getElementById('searchInput').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') doSearch();
});
</script>

</body>
</html>
