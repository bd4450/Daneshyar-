<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشیار - جستجوی هوشمند کلمات و جدول</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Tahoma, sans-serif; background: #f0f2f5; padding: 10px; margin: 0; }
        .container { max-width: 650px; margin: auto; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h1 { font-size: 1.3rem; text-align: center; color: #1e293b; margin: 8px 0; }
        #status { font-size: 0.8rem; color: #64748b; text-align: center; margin-bottom: 12px; background: #f8fafc; padding: 6px; border-radius: 6px; }
        
        .search-area { display: flex; gap: 6px; margin-bottom: 15px; }
        input { flex: 1; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 6px; font-size: 1rem; outline: none; }
        input:focus { border-color: #2563eb; }
        button { padding: 12px 20px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; }
        button:active { background: #1d4ed8; }

        .result-item { padding: 12px 10px; border-bottom: 1px solid #f1f5f9; line-height: 1.7; }
        .result-item:last-child { border-bottom: none; }
        .exact-match { background: #f0fdf4; border-radius: 6px; border: 1px solid #bbf7d0; margin-bottom: 8px; }
        .word { font-weight: bold; color: #1e40af; font-size: 1.15rem; margin-bottom: 4px; }
        .meaning { color: #334155; font-size: 0.95rem; text-align: justify; }
        .source { color: #64748b; font-size: 0.75rem; margin-top: 5px; }
        .tag { display: inline-block; background: #e2e8f0; color: #475569; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; margin-right: 5px; }
        .not-found { text-align: center; color: #94a3b8; padding: 25px 0; font-size: 0.95rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>دانشیار</h1>
    <div id="status">در حال بارگذاری لغت‌نامه‌ها...</div>
    
    <div class="search-area">
        <input type="text" id="query" placeholder="کلمه یا سوال جدول را وارد کنید...">
        <button onclick="search()">جستجو</button>
    </div>
    
    <div id="results"></div>
</div>

<!-- فایل‌های دیتابیس -->
<script src="dehkhoda.js"></script>
<script src="amid.js"></script>
<script src="moein.js"></script>
<script src="abadis.js"></script>

<script>
    let allData = [];

    // تابع فوق‌العاده جامع برای نرمال‌سازی کلمات فارسی (حل مشکل اعراب، همزه‌ها و حروف مشابه)
    function cleanText(str) {
        if (!str) return "";
        return String(str)
            .replace(/[\u064B-\u065F\u0670]/g, '') // حذف تمام اعراب (فتحه، ضمه، کسره، تشدید و تنوین‌ها)
            .replace(/[يى]/g, "ی")
            .replace(/ك/g, "ک")
            .replace(/ة/g, "ه")
            .replace(/[آأإا]/g, "ا") // یکدست‌سازی انواع الف و آ
            .replace(/ؤ/g, "و")
            .replace(/ئ/g, "ی")
            .replace(/[\u200B-\u200D\uFEFF\u00A0]/g, '') // حذف فاصله‌های مجازی و نیم‌فاصله
            .replace(/[\s\-_]+/g, ' ') // یکدست‌سازی فاصله‌ها
            .trim()
            .toLowerCase();
    }

    function processArray(arr, sourceName) {
        if (!Array.isArray(arr)) return;
        arr.forEach(item => {
            const word = item.word || item.w || item.title || "";
            const meaning = item.def || item.meaning || item.m || item.desc || "";
            if (word || meaning) {
                allData.push({
                    w: word.trim(),
                    m: meaning.trim(),
                    src: sourceName,
                    cleanW: cleanText(word),
                    cleanM: cleanText(meaning)
                });
            }
        });
    }

    async function loadDatabaseFile(fileName, sourceName, fallbackVar) {
        if (fallbackVar && Array.isArray(fallbackVar) && fallbackVar.length > 0) {
            processArray(fallbackVar, sourceName);
            return true;
        }
        try {
            const response = await fetch(fileName);
            if (!response.ok) return false;
            let text = await response.text();
            const eqIndex = text.indexOf('=');
            if (eqIndex !== -1 && eqIndex < 50) {
                text = text.substring(eqIndex + 1).trim();
            }
            if (text.endsWith(';')) text = text.slice(0, -1).trim();
            const data = JSON.parse(text);
            processArray(data, sourceName);
            return true;
        } catch (e) {
            return false;
        }
    }

    window.onload = async function() {
        const statusEl = document.getElementById('status');
        
        await Promise.all([
            loadDatabaseFile('dehkhoda.js', 'دهخدا', window.dehkhoda),
            loadDatabaseFile('amid.js', 'عمید', window.amid),
            loadDatabaseFile('moein.js', 'معین', window.moein),
            loadDatabaseFile('abadis.js', 'آبادیس', window.abadis)
        ]);

        if (allData.length > 0) {
            statusEl.innerText = `تعداد کل مدخل‌ها: ${allData.length.toLocaleString('fa-IR')} لغت آماده جستجو`;
            statusEl.style.color = "#16a34a";
        } else {
            statusEl.innerText = "خطا در بارگذاری دیتابیس‌ها. مطمئن شوید فایل‌ها در همان پوشه هستند.";
            statusEl.style.color = "#dc2626";
        }
    };

    // موتور جستجوی هوشمند با اولویت‌بندی دقیق
    function search() {
        const rawQuery = document.getElementById('query').value;
        const q = cleanText(rawQuery);
        const resultsDiv = document.getElementById('results');
        
        if (!q) {
            resultsDiv.innerHTML = '<div class="not-found">لطفاً کلمه‌ای برای جستجو وارد کنید.</div>';
            return;
        }

        resultsDiv.innerHTML = "";

        let exactMatches = [];   // ۱. کلماتی که دقیقاً خود عبارت سرچ‌شده هستند
        let startsWith = [];     // ۲. کلماتی که با این عبارت شروع می‌شوند
        let wordContains = [];   // ۳. کلماتی که این عبارت داخل نام آن‌ها است
        let meaningMatches = []; // ۴. کلماتی که این عبارت در متن معنی‌شان آمده (مخصوص حل جدول)

        for (let i = 0; i < allData.length; i++) {
            const item = allData[i];

            if (item.cleanW === q) {
                exactMatches.push(item);
            } else if (item.cleanW.startsWith(q)) {
                if (startsWith.length < 30) startsWith.push(item);
            } else if (item.cleanW.includes(q)) {
                if (wordContains.length < 20) wordContains.push(item);
            } else if (item.cleanM.includes(q)) {
                // فقط اگر جستجو حداقل ۳ حرف بود در متن معانی بگردد تا لغات بی‌خود نیاورد
                if (q.length >= 3 && meaningMatches.length < 20) {
                    meaningMatches.push(item);
                }
            }
        }

        // ترکیب نتایج به ترتیب اولویت: اول کلمات دقیق، بعد شروع‌شده‌ها، بعد معانی
        const finalResults = [
            ...exactMatches,
            ...startsWith,
            ...wordContains,
            ...meaningMatches
        ];

        if (finalResults.length === 0) {
            resultsDiv.innerHTML = '<div class="not-found">نتیجه‌ای برای «' + rawQuery + '» یافت نشد.</div>';
            return;
        }

        const fragment = document.createDocumentFragment();

        finalResults.forEach(item => {
            const isExact = (item.cleanW === q);
            const div = document.createElement('div');
            div.className = 'result-item' + (isExact ? ' exact-match' : '');
            
            div.innerHTML = `
                <div class="word">${item.w} ${isExact ? '<span class="tag">تطابق دقیق</span>' : ''}</div>
                <div class="meaning">${item.m}</div>
                <div class="source">منبع: لغت‌نامه ${item.src}</div>
            `;
            fragment.appendChild(div);
        });

        resultsDiv.appendChild(fragment);
    }

    document.getElementById('query').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') search();
    });
</script>

</body>
</html>
