<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشیار - راهنمای جدول و دانشنامه</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1a568c; font-size: 24px; margin-top: 0; }
        p.desc { text-align: center; color: #666; font-size: 13px; margin-bottom: 20px; }
        .search-box { display: flex; gap: 8px; margin-bottom: 15px; }
        input[type="text"] { flex: 1; padding: 12px; border: 2px solid #ccc; border-radius: 8px; font-size: 16px; outline: none; }
        input[type="text"]:focus { border-color: #1a568c; }
        button { padding: 12px 20px; background-color: #1a568c; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        #result { margin-top: 15px; min-height: 100px; }
        .card { background: #fafafa; border: 1px solid #e0e0e0; border-right: 4px solid #1a568c; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .card h3 { margin: 0 0 6px 0; color: #1a568c; font-size: 16px; }
        .card p { margin: 0; font-size: 14px; line-height: 1.7; color: #444; }
        .badge { display: inline-block; background: #e1ecf4; color: #2c5777; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-bottom: 8px; }
        .loading { text-align: center; color: #666; padding: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>دانشیار</h1>
    <p class="desc">دانشنامه عمومی و راهنمای کامل حل جدول متقاطع</p>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="عبارت مورد نظر (مثال: جزایر ژاپن، پایتخت فرانسه...)">
        <button onclick="doSearch()">جستجو</button>
    </div>

    <div id="result">
        پاسخ یا اطلاعات عمومی در این بخش نمایش داده می‌شود.
    </div>
</div>

<script>
// بانک آفلاین پاسخ‌های پرکاربرد جدول
const localDB = [
    { keywords: ["جزایر ژاپن", "جزیره های ژاپن", "جزائر ژاپن"], title: "جزایر اصلی ژاپن", text: "چهار جزیره اصلی ژاپن عبارتند از: هونشو (بزرگ‌ترین)، هوکایدو، کیوشو و شیکوکو. همچنین جزایر اوکیناوا نیز از جزایر مهم ژاپن هستند." },
    { keywords: ["کشوری اروپایی", "کشور اروپایی"], title: "کشورهای اروپایی پرکاربرد در جدول", text: "آلمان، فرانسه، ایتالیا، اسپانیا، اتریش، بلژیک، لهستان، سوئد، نروژ، یونان، هلند، دانمارک، فنلاند، سوئیس، ایرلند." },
    { keywords: ["پایتخت فرانسه"], title: "پایتخت فرانسه", text: "پاریس" },
    { keywords: ["پایتخت آلمان"], title: "پایتخت آلمان", text: "برلین" },
    { keywords: ["رود آلمان"], title: "رودهای آلمان", text: "راین، البه، دانوب، وزر" }
];

async function doSearch() {
    const query = document.getElementById('searchInput').value.trim();
    const resultDiv = document.getElementById('result');

    if (!query) {
        resultDiv.innerHTML = '<div class="card" style="border-right-color:#d9534f;">لطفاً کلمه یا سوالی وارد کنید.</div>';
        return;
    }

    resultDiv.innerHTML = '<div class="loading">در حال جستجو و دریافت پاسخ...</div>';

    // ۱. بررسی بانک داخلی برای پاسخ سریع
    for (let item of localDB) {
        if (item.keywords.some(k => query.includes(k) || k.includes(query))) {
            resultDiv.innerHTML = `
                <div class="card">
                    <span class="badge">پاسخ مستقیم جدول</span>
                    <h3>${item.title}</h3>
                    <p>${item.text}</p>
                </div>
            `;
            return;
        }
    }

    // ۲. جستجو در ویکی‌پدیا (روش اول)
    try {
        const url1 = `https://fa.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&utf8=&format=json&origin=*`;
        const res1 = await fetch(url1);
        const data1 = await res1.json();

        if (data1.query && data1.query.search && data1.query.search.length > 0) {
            let html = '';
            data1.query.search.slice(0, 5).forEach(item => {
                const cleanText = item.snippet.replace(/<\/?[^>]+(>|$)/g, "");
                html += `
                    <div class="card">
                        <span class="badge">دانشنامه</span>
                        <h3>${item.title}</h3>
                        <p>${cleanText}...</p>
                    </div>
                `;
            });
            resultDiv.innerHTML = html;
            return;
        }
    } catch (e) {
        console.log("روش اول ناموفق بود، رفتن به روش دوم...");
    }

    // ۳. روش پشتیبان (روش دوم)
    try {
        const url2 = `https://fa.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`;
        const res2 = await fetch(url2);
        if (res2.ok) {
            const data2 = await res2.json();
            resultDiv.innerHTML = `
                <div class="card">
                    <span class="badge">دانشنامه</span>
                    <h3>${data2.title}</h3>
                    <p>${data2.extract}</p>
                </div>
            `;
            return;
        }
    } catch (e) {}

    resultDiv.innerHTML = '<div class="card">نتیجه‌ای یافت نشد. لطفاً عبارت را به شکل دیگری امتحان کنید.</div>';
}

document.getElementById('searchInput').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') doSearch();
});
</script>

</body>
</html>
