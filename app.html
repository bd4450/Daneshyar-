<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشیار - جستجوی هوشمند</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f9; padding: 10px; margin: 0; }
        .container { max-width: 600px; margin: auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { font-size: 1.2rem; text-align: center; color: #333; }
        .search-area { display: flex; gap: 5px; margin: 15px 0; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        button { padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .result-item { padding: 10px; border-bottom: 1px solid #eee; }
        .word { font-weight: bold; color: #000; }
        .source { color: #888; font-size: 0.8rem; }
        #status { font-size: 0.8rem; color: #666; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>دانشیار</h1>
    <div id="status">در حال بارگذاری...</div>
    <div class="search-area">
        <input type="text" id="query" placeholder="جستجوی کلمه...">
        <button onclick="search()">جستجو</button>
    </div>
    <div id="results"></div>
</div>

<!-- فایل‌های دیتابیس -->
<script src="dehkhoda.js"></script>
<script src="amid.js"></script>
<script src="moein.js"></script>
<script src="abadis.js"></script>

<script>
    let allData = [];

    // ۱. جمع‌آوری داده‌ها از چهار فایل
    window.onload = function() {
        const databases = [
            { name: "دهخدا", data: window.dehkhoda },
            { name: "عمید", data: window.amid },
            { name: "معین", data: window.moein },
            { name: "آبادیس", data: window.abadis }
        ];

        databases.forEach(db => {
            if (Array.isArray(db.data)) {
                db.data.forEach(item => {
                    allData.push({
                        w: item.word || "",
                        m: item.meaning || "",
                        src: db.name
                    });
                });
            }
        });
        document.getElementById('status').innerText = "تعداد کل مدخل‌ها: " + allData.length;
    };

    // ۲. سیستم جستجو
    function search() {
        const q = document.getElementById('query').value.trim();
        const resultsDiv = document.getElementById('results');
        if (!q) return;

        resultsDiv.innerHTML = "";
        let count = 0;

        allData.forEach(item => {
            if (item.w.includes(q) || item.m.includes(q)) {
                if (count < 50) { // محدودیت برای جلوگیری از سنگین شدن صفحه
                    const div = document.createElement('div');
                    div.className = 'result-item';
                    div.innerHTML = `<div class="word">${item.w}</div><div>${item.m}</div><div class="source">منبع: ${item.src}</div>`;
                    resultsDiv.appendChild(div);
                    count++;
                }
            }
        });

        if (count === 0) resultsDiv.innerHTML = "نتیجه‌ای یافت نشد.";
    }

    // ۳. پشتیبانی از اینتر
    document.getElementById('query').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') search();
    });
</script>

</body>
</html>
