<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشنامه دانشیار</title>
    <style>
        @font-face {
            font-family: 'Titr';
            src: local('B Titr'), local('Titr');
        }
        @font-face {
            font-family: 'Mitra';
            src: local('B Mitra'), local('Mitra');
        }

        body {
            font-family: 'Mitra', Tahoma, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            margin: 0;
            padding: 16px;
            line-height: 2;
            font-size: 17px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        h1 {
            font-family: 'Titr', Tahoma, sans-serif;
            font-size: 26px;
            text-align: center;
            color: #1e3a8a;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .search-box {
            width: 100%;
            padding: 14px 18px;
            font-size: 18px;
            font-family: 'Mitra', Tahoma, sans-serif;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            text-align: right;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: #2563eb;
        }

        .category-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
            margin-bottom: 10px;
            justify-content: center;
        }

        .filter-btn {
            background-color: #e2e8f0;
            border: none;
            padding: 6px 14px;
            font-size: 15px;
            font-family: 'Mitra', Tahoma, sans-serif;
            border-radius: 20px;
            cursor: pointer;
            color: #334155;
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: #2563eb;
            color: #ffffff;
        }

        #result {
            margin-top: 24px;
        }

        .card {
            background-color: #f8fafc;
            border-right: 5px solid #2563eb;
            padding: 16px 20px;
            margin-bottom: 16px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            border-right-width: 5px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .card-title {
            font-family: 'Titr', Tahoma, sans-serif;
            font-size: 22px;
            color: #0f172a;
        }

        .card-category {
            font-size: 14px;
            background-color: #dbeafe;
            color: #1e40af;
            padding: 2px 10px;
            border-radius: 12px;
        }

        .card-summary {
            font-size: 17px;
            color: #334155;
        }

        .card-clues {
            margin-top: 8px;
            font-size: 15px;
            color: #64748b;
            background-color: #ffffff;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px dashed #cbd5e1;
        }

        .not-found {
            text-align: center;
            color: #64748b;
            font-size: 17px;
            margin-top: 30px;
        }

        .count-tag {
            text-align: center;
            font-size: 14px;
            color: #94a3b8;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>دانشنامه و حل جدول دانشیار</h1>
    
    <input type="text" id="searchInput" class="search-box" placeholder="جستجوی لغت، سوال جدول، چهره یا موضوع...">

    <div class="category-filters">
        <button class="filter-btn active" onclick="setCategory('همه')">همه</button>
        <button class="filter-btn" onclick="setCategory('ادبیات و فلسفه')">ادبیات و فلسفه</button>
        <button class="filter-btn" onclick="setCategory('جغرافیا و جدول')">جغرافیا و جدول</button>
        <button class="filter-btn" onclick="setCategory('علوم و فضا')">علوم و فضا</button>
        <button class="filter-btn" onclick="setCategory('تاریخ و فرهنگ')">تاریخ و فرهنگ</button>
    </div>

    <div id="countInfo" class="count-tag"></div>
    <div id="result"></div>
</div>

<script>
// دیتابیس جامع محلی دانشیار
const daneshyarData = [
    // ادبیات، فلسفه و هنر
    {
        title: "فردوسی",
        category: "ادبیات و فلسفه",
        aliases: ["ابوالقاسم فردوسی", "حکیم طوس", "شاعر شاهنامه"],
        summary: "بزرگ‌ترین حماسه‌سرای ایران و سرایندهٔ شاهنامه که زبان فارسی را زنده نگه داشت. مدفن وی در شهر توس واقع است.",
        crossword_clues: ["سراینده شاهنامه", "حکیم طوس", "شاعر قرن چهارم"]
    },
    {
        title: "حافظ",
        category: "ادبیات و فلسفه",
        aliases: ["شمس‌الدین محمد", "حافظ شیرازی", "لسان‌الغیب"],
        summary: "بزرگ‌ترین غزل‌سرای شعر فارسی، ملقب به لسان‌الغیب و ترجمان‌الاسرار، زاده و مدفون در شیراز.",
        crossword_clues: ["لسان‌الغیب", "شاعر شیرازی", "شاخه نبات"]
    },
    {
        title: "سعدی",
        category: "ادبیات و فلسفه",
        aliases: ["سعدی شیرازی", "مشرف‌الدین", "استاد سخن"],
        summary: "شاعر و نویسنده برجسته قرن هفتم، صاحب آثاری چون گلستان و بوستان و ملقب به استاد سخن و افصح‌المتکلمین.",
        crossword_clues: ["استاد سخن", "نویسنده گلستان", "شاعر بوستان"]
    },
    {
        title: "مولوی",
        category: "ادبیات و فلسفه",
        aliases: ["مولانا", "جلال‌الدین محمد بلخی", "رومی"],
        summary: "عارف و شاعر بزرگ سدهٔ هفتم، صاحب اثر گران‌سنگ مثنوی معنوی و دیوان شمس تبریزی.",
        crossword_clues: ["سراینده مثنوی معنوی", "مرید شمس تبریزی", "خاموش"]
    },
    {
        title: "ابن سینا",
        category: "ادبیات و فلسفه",
        aliases: ["پورسینا", "شیخ‌الرئیس", "اویسینا"],
        summary: "بزرگ‌ترین فیلسوف مشائی و پزشک نامدار ایرانی در سده‌های چهارم و پنجم قمری؛ صاحب کتاب‌های القانون فی الطب و الشفاء.",
        crossword_clues: ["شیخ‌الرئیس", "نویسنده قانون در طب", "نویسنده کتاب شفا"]
    },
    {
        title: "ارسطو",
        category: "ادبیات و فلسفه",
        aliases: ["معلم اول", "ارسطاطالیس"],
        summary: "فیلسوف بزرگ یونان باستان، شاگرد افلاطون و آموزگار اسکندر مقدونی؛ بنیان‌گذار منطق صوری.",
        crossword_clues: ["معلم اول", "شاگرد افلاطون", "بنیان‌گذار منطق"]
    },

    // جغرافیا، ورزش و لغات پرتکرار حل جدول
    {
        title: "آمازون",
        category: "جغرافیا و جدول",
        aliases: ["رود آمازون", "Amazon"],
        summary: "پرآب‌ترین رود جهان در قاره آمریکای جنوبی که از جنگل‌های بارانی آمازون عبور می‌کند و به اقیانوس اطلس می‌ریزد.",
        crossword_clues: ["پرآب‌ترین رود جهان", "رود آمریکای جنوبی"]
    },
    {
        title: "بایکال",
        category: "جغرافیا و جدول",
        aliases: ["دریاچه بایکال"],
        summary: "عمیق‌ترین و کهن‌ترین دریاچه آب شیرین جهان واقع در سیبری کشور روسیه.",
        crossword_clues: ["عمیق‌ترین دریاچه جهان", "دریاچه سیبری"]
    },
    {
        title: "دماوند",
        category: "جغرافیا و جدول",
        aliases: ["قله دماوند", "دیو سپید"],
        summary: "بلندترین کوه ایران و خاورمیانه و مرتفع‌ترین آتشفشان آسیا به ارتفاع ۵۶۱۰ متر واقع در استان مازندران.",
        crossword_clues: ["بلندترین قله ایران", "دیو سپید پای در بند"]
    },
    {
        title: "زاگرس",
        category: "جغرافیا و جدول",
        aliases: ["رشته‌کوه زاگرس"],
        summary: "طولانی‌ترین رشته‌کوه ایران که از شمال‌غرب تا جنوب و جنوب‌غرب کشور امتداد یافته است.",
        crossword_clues: ["رشته کوه غرب ایران", "دنا در آن است"]
    },
    {
        title: "آرشین",
        category: "جغرافیا و جدول",
        aliases: ["واحد ارشین"],
        summary: "واحد اندازه‌گیری طول در قدیم معادل حدود ۱۰۴ سانتی‌متر (واحد طول روسی و ترکی قدیم).",
        crossword_clues: ["واحد طول قدیمی", "واحد طول روسی"]
    },
    {
        title: "یم",
        category: "جغرافیا و جدول",
        aliases: ["دریا"],
        summary: "در زبان عربی و جدول‌های متقاطع به معنای دریا و آب پهناور است.",
        crossword_clues: ["دریا در جدول", "دریا به عربی"]
    },

    // پزشکی، علوم و فضا
    {
        title: "خورشید",
        category: "علوم و فضا",
        aliases: ["مهر", "شمس", "خور"],
        summary: "ستاره مرکزی منظومه شمسی از رده طیفی G که بیش از ۹۹ درصد جرم کل سامانه خورشیدی را تشکیل می‌دهد.",
        crossword_clues: ["ستاره منظومه ما", "مهر و شمس", "مرکز منظومه شمسی"]
    },
    {
        title: "مریخ",
        category: "علوم و فضا",
        aliases: ["بهرام", "سیاره سرخ"],
        summary: "چهارمین سیاره از خورشید و دومین سیاره کوچک منظومه شمسی که به دلیل اکسید آهن سطحی به رنگ سرخ دیده می‌شود.",
        crossword_clues: ["سیاره سرخ", "بهرام", "همسایه زمین"]
    },
    {
        title: "پنی‌سیلین",
        category: "علوم و فضا",
        aliases: ["Penicillin", "آنتی‌بیوتیک"],
        summary: "نخستین پادزیست (آنتی‌بیوتیک) کشف‌شده در تاریخ پزشکی که توسط الکساندر فلمینگ در سال ۱۹۲۸ کشف شد.",
        crossword_clues: ["کشف الکساندر فلمینگ", "نخستین آنتی‌بیوتیک"]
    },
    {
        title: "آلبرت اینشتین",
        category: "علوم و فضا",
        aliases: ["انیشتین", "اینشتین"],
        summary: "فیزیک‌دان نامدار آلمانی-آمریکایی و ارائه‌دهنده نظریه نسبیت عام و خاص و برنده جایزه نوبل فیزیک ۱۹۲۱.",
        crossword_clues: ["واضع نظریه نسبیت", "برنده نوبل فیزیک ۱۹۲۱"]
    },

    // تاریخ و فرهنگ
    {
        title: "کوروش بزرگ",
        category: "تاریخ و فرهنگ",
        aliases: ["کوروش کبیر", "سیروس"],
        summary: "بنیان‌گذار شاهنشاهی هخامنشی در ایران باستان و نگارنده نخستین منشور حقوق بشر جهانی بر روی استوانه گلی.",
        crossword_clues: ["بنیان‌گذار هخامنشیان", "صاحب اولین منشور حقوق بشر"]
    },
    {
        title: "تخت جمشید",
        category: "تاریخ و فرهنگ",
        aliases: ["پارسه", "پرسپولیس"],
        summary: "پایتخت تشریفاتی پادشاهی هخامنشی در استان فارس که ساخت آن توسط داریوش بزرگ آغاز گردید.",
        crossword_clues: ["پارسه", "پرسپولیس", "بنای هخامنشی در فارس"]
    },
    {
        title: "امیرکبیر",
        category: "تاریخ و فرهنگ",
        aliases: ["میرزا تقی‌خان", "امیر نظام"],
        summary: "صدراعظم مشهور دوره ناصرالدین‌شاه قاجار، بنیان‌گذار مدرسه دارالفنون و روزنامه وقایع اتفاقیه.",
        crossword_clues: ["صدراعظم ناصرالدین شاه", "بنیان‌گذار دارالفنون"]
    }
];

let currentCategory = 'همه';

function setCategory(cat) {
    currentCategory = cat;
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === cat);
    });
    performSearch();
}

function performSearch() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const resultDiv = document.getElementById('result');
    const countInfo = document.getElementById('countInfo');
    resultDiv.innerHTML = '';

    let list = daneshyarData;
    if (currentCategory !== 'همه') {
        list = list.filter(item => item.category === currentCategory);
    }

    if (query.length === 0) {
        countInfo.innerText = `تعداد کل مدخل‌های این بخش: ${list.length}`;
        list.slice(0, 5).forEach(renderItem);
        return;
    }

    const filtered = list.filter(item => {
        const inTitle = item.title && item.title.toLowerCase().includes(query);
        const inAliases = item.aliases && item.aliases.some(a => a.toLowerCase().includes(query));
        const inClues = item.crossword_clues && item.crossword_clues.some(c => c.toLowerCase().includes(query));
        const inSummary = item.summary && item.summary.toLowerCase().includes(query);
        return inTitle || inAliases || inClues || inSummary;
    });

    countInfo.innerText = `تعداد نتایج پیدا شده: ${filtered.length}`;

    if (filtered.length > 0) {
        filtered.forEach(renderItem);
    } else {
        resultDiv.innerHTML = '<div class="not-found">موردی یافت نشد. لطفاً عبارت دیگری را جستجو کنید.</div>';
    }
}

function renderItem(item) {
    const resultDiv = document.getElementById('result');
    const cluesText = item.crossword_clues ? item.crossword_clues.join(' • ') : '';
    resultDiv.innerHTML += `
        <div class="card">
            <div class="card-header">
                <span class="card-title">${item.title}</span>
                <span class="card-category">${item.category}</span>
            </div>
            <div class="card-summary">${item.summary}</div>
            ${cluesText ? `<div class="card-clues">📌 <strong>کلیدهای جدول:</strong> ${cluesText}</div>` : ''}
        </div>
    `;
}

document.getElementById('searchInput').addEventListener('input', performSearch);
performSearch();
</script>
</body>
</html>
