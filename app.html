<!DOCTYPE html>

    <meta charset="UTF-8">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background: #f1f5f9; padding: 15px; color: #0f172a; }
        .container { max-width: 550px; margin: auto; background: #ffffff; padding: 22px; border-radius: 16px; box-shadow: 0 4px 18px rgba(0,0,0,0.06); }
        h1 { color: #1e3a8a; text-align: center; margin-bottom: 6px; font-size: 1.6rem; }
        p.sub { color: #64748b; text-align: center; font-size: 0.85rem; margin-bottom: 18px; }
        .search-box { display: flex; gap: 8px; margin-bottom: 14px; }
        input { flex: 1; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 1rem; outline: none; transition: 0.2s; }
        input:focus { border-color: #1e3a8a; }
        button.search-btn { background: #1e3a8a; color: white; border: none; border-radius: 10px; padding: 0 20px; font-weight: bold; cursor: pointer; }
        .filter-title { font-size: 0.78rem; color: #64748b; margin-bottom: 6px; }
        .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 18px; scrollbar-width: thin; }
        .chip { background: #e2e8f0; border: none; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; white-space: nowrap; color: #334155; }
        .chip.active { background: #1e3a8a; color: white; }
        .card { background: #ffffff; border: 1px solid #e2e8f0; border-right: 5px solid #1e3a8a; padding: 14px; border-radius: 10px; margin-bottom: 12px; }
        .card h3 { color: #1e3a8a; font-size: 1rem; margin-bottom: 4px; }
        .card p { font-size: 0.8rem; color: #64748b; margin-bottom: 10px; }
        .words { display: flex; flex-wrap: wrap; gap: 8px; }
        .word-badge { background: #f0f9ff; border: 1px solid #bae6fd; padding: 6px 12px; border-radius: 8px; font-size: 0.95rem; }
        .word-badge b { color: #0369a1; }
        .word-badge span { color: #475569; font-size: 0.75rem; margin-right: 4px; }
        .word-badge small { display: block; color: #64748b; font-size: 0.75rem; margin-top: 2px; }
        .empty { text-align: center; color: #94a3b8; padding: 35px 0; font-size: 0.92rem; line-height: 1.6; }
    </style>

    </div>

    <div class="filter-title">فیلتر تعداد حروف پاسخ:</div>
    <div class="filters">
        <button class="chip active" onclick="setChars(0, this)">همه</button>
        <button class="chip" onclick="setChars(2, this)">۲ حرف</button>
        <button class="chip" onclick="setChars(3, this)">۳ حرف</button>

        <button class="chip" onclick="setChars(5, this)">۵ حرف</button>
        <button class="chip" onclick="setChars(6, this)">۶ حرف</button>
        <button class="chip" onclick="setChars(7, this)">۷+ حرف</button>
    </div>

    <div id="output">
        <div class="empty">کلمه، مفهوم یا پرسش خود را در کادر بالا بنویسید و دکمه جستجو را بزنید.</div>
    </div>

let targetCharCount = 0;

function setChars(n, elem) {
    targetCharCount = n;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    elem.classList.add('active');
    runSearch();
}

function runSearch() {
    const raw = document.getElementById('term').value.trim();
    const query = raw.replace(/[\u200B-\u200D\uFEFF]/g, '').toLowerCase();
    const out = document.getElementById('output');

    if (!query) {
        out.innerHTML = '<div class="empty">لطفاً کلمه‌ای برای جستجو وارد کنید.</div>';
        return;
    }

    const searchWords = query.split(/\s+/).filter(w => w.length > 0);
    let matches = [];

    DB.forEach(group => {
        const keyMatch = group.keys.some(k => k.includes(query) || query.includes(k));
        const multiWordMatch = searchWords.some(sw => 
            group.title.includes(sw) || group.keys.some(k => k.includes(sw))
        );
        const internalWordMatch = group.words.some(item => 
            item.w.includes(query) || (item.desc && item.desc.includes(query))
        );

        if (keyMatch || multiWordMatch || internalWordMatch) {
            let filtered = group.words;

            if (targetCharCount > 0) {
                if (targetCharCount === 7) {
                    filtered = filtered.filter(item => item.w.replace(/\s+/g, '').length >= 7);
                } else {
                    filtered = filtered.filter(item => item.w.replace(/\s+/g, '').length === targetCharCount);
                }
            }

            if (filtered.length > 0) {
                matches.push({
                    title: group.title,
                    desc: group.desc,
                    words: filtered
                });
            }
        }
    });

    if (matches.length === 0) {
        out.innerHTML = `<div class="empty">پاسخی برای «${raw}» یافت نشد.<br><small style="color:#64748b;">توصیه: تعداد حروف را روی «همه» بگذارید یا کلمه را ساده‌تر جستجو کنید.</small></div>`;
        return;
    }

    let html = '';
    matches.forEach(m => {
        html += `
            <div class="card">
                <h3>${m.title}</h3>
                <p>${m.desc}</p>
                <div class="words">
                    ${m.words.map(item => `
                        <div class="word-badge">
                            <b>${item.w}</b>
                            <span>(${item.w.replace(/\s+/g, '').length} حرف)</span>
                            ${item.desc ? `<small>${item.desc}</small>` : ''}
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    });

    out.innerHTML = html;
}

document.getElementById('term').addEventListener('keyup', function(e) {
    if (e.key === 'Enter') runSearch();
});
