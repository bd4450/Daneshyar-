<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشیار</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Tahoma, sans-serif; background: #f4f4f9; padding: 15px; margin: 0; }
        .container { max-width: 650px; margin: auto; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab-btn {
            flex: 1;
            padding: 12px 5px;
            background: #e2e8f0;
            border: none;
            border-radius: 8px 8px 0 0;
            font-size: 14px;
            font-weight: bold;
            color: #475569;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active { background: #2c3e50; color: #ffffff; }

        .search-box { display: flex; gap: 8px; margin-bottom: 15px; }
        input { 
            flex: 1; 
            padding: 12px; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            font-size: 15px; 
            outline: none; 
            background: #fff;
        }
        input:focus { border-color: #2c3e50; }
        .search-action-btn { 
            padding: 12px 20px; 
            background: #2c3e50; 
            color: #fff; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 15px; 
        }

        #result { 
            background: #fff; 
            padding: 18px; 
            border-radius: 8px; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.06); 
            line-height: 1.8; 
            min-height: 80px;
        }
        
        .meaning-item { 
            display: flex; 
            align-items: flex-start; 
            gap: 10px; 
            margin-bottom: 10px; 
            padding-bottom: 8px; 
            border-bottom: 1px dashed #e2e8f0; 
        }
        .meaning-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .badge { 
            background: #eef2f7; 
            color: #2c3e50; 
            font-size: 12px; 
            font-weight: bold; 
            padding: 3px 8px; 
            border-radius: 12px; 
            min-width: 22px; 
            text-align: center; 
        }
        .text { flex: 1; color: #1e293b; font-size: 14px; }
        .source-tag { font-size: 11px; color: #64748b; background: #f1f5f9; padding: 2px 6px; border-radius: 4px; margin-right: 5px; }
        h3 { margin-top: 0; color: #0f172a; border-bottom: 2px solid #2c3e50; padding-bottom: 8px; font-size: 16px; }
        .encyclo-text { color: #334155; font-size: 14px; text-align: justify; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" id="tabDict" onclick="switchTab('dict')">فرهنگ لغت جامع (دهخدا، معین، عمید، آبادیس)</button>
        <button class="tab-btn" id="tabEncyclo" onclick="switchTab('encyclo')">دانشنامه</button>
    </div>

    <div class="search-box">
        <input type="text" id="q" placeholder="کلمه، اصطلاح یا ضرب‌المثل را وارد کنید...">
        <button class="search-action-btn" onclick="performSearch()">جستجو</button>
    </div>

    <div id="result">کلمه یا عبارت مورد نظر را بنویسید.</div>
</div>

<script>
    let currentTab = 'dict';

    function switchTab(tab) {
        currentTab = tab;
        const btnDict = document.getElementById('tabDict');
        const btnEncyclo = document.getElementById('tabEncyclo');
        const inputField = document.getElementById('q');
        const r = document.getElementById('result');

        if (tab === 'dict') {
            btnDict.classList.add('active');
            btnEncyclo.classList.remove('active');
            inputField.placeholder = "کلمه، اصطلاح یا ضرب‌المثل را وارد کنید...";
        } else {
            btnEncyclo.classList.add('active');
            btnDict.classList.remove('active');
            inputField.placeholder = "موضوع علمی، تاریخی، جغرافیایی یا اسم مکان/شخص را بنویسید...";
        }

        if (inputField.value.trim() !== '') {
            performSearch();
        } else {
            r.innerHTML = "عبارت مورد نظر خود را بنویسید و جستجو کنید.";
        }
    }

    function cleanText(str) {
        if (!str) return '';
        return str
            .replace(/ي/g, 'ی')
            .replace(/ك/g, 'ک')
            .replace(/[\u064B-\u065F\u0670]/g, '')
            .replace(/[\u200C\u200B]/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function parseMeanings(text) {
        if (!text) return [];
        let cleaned = text.replace(/\([^)]*\)/g, '').replace(/\[[^\]]*\]/g, '');
        let rawParts = cleaned.split(/[\n،؛;.\-–—]+/);
        let results = [];
        let stopWords = ["ارجاع", "منبع", "صفحه", "ویرایش", "نگاه کنید به", "رده:", "مترادف", "متضاد"];

        for (let p of rawParts) {
            let item = cleanText(p);
            if (item.length >= 2 && item.length <= 100 && !stopWords.some(w => item.includes(w))) {
                if (!results.includes(item)) {
                    results.push(item);
                }
            }
            if (results.length >= 10) break;
        }
        return results;
    }

    const tableDatabase = [
        { word: "پایتخت آلمان", answer: "برلین" },
        { word: "واحد پول ژاپن", answer: "ین" },
        { word: "بزرگترین اقیانوس", answer: "آرام" },
        { word: "چشم و چراغ", answer: ["عزیز و گرامی", "محبوب خانواده", "نور چشم"] },
        { word: "شتر دیدی ندیدی", answer: ["رازپوشی", "وانمود کردن به ندانستن موضوع", "پنهان‌کاری"] },
        { word: "آب زیر کاه", answer: ["حیله‌گر", "مکار", "فتنه‌انگیز پنهان"] }
    ];

    function performSearch() {
        if (currentTab === 'dict') {
            searchMultiDictionary();
        } else {
            searchEncyclopedia();
        }
    }

    async function searchMultiDictionary() {
        const qRaw = document.getElementById('q').value;
        const q = cleanText(qRaw);
        const r = document.getElementById('result');

        if (!q) {
            r.innerHTML = "لطفاً کلمه یا اصطلاح را بنویسید.";
            return;
        }

        r.innerHTML = "در حال جستجو در فرهنگ‌های دهخدا، معین، عمید و آبادیس...";

        // ۱. بررسی بانک داخلی
        const found = tableDatabase.find(item => {
            const w = cleanText(item.word);
            return w === q || w.includes(q) || q.includes(w);
        });

        if (found) {
            let answers = Array.isArray(found.answer) ? found.answer : parseMeanings(found.answer);
            renderListResults(found.word, answers.slice(0, 10));
            return;
        }

        // ۲. فراخوانی API واژه‌یاب / آبادیس / ویکی‌پدیا جهت پوشش جامع لغات
        try {
            const vajehyabUrl = `https://api.vajehyab.com/v3/search?token=guest&q=${encodeURIComponent(q)}`;
            const wikiUrl = `https://fa.wikipedia.org/w/api.php?action=query&format=json&prop=extracts&exintro=true&explaintext=true&titles=${encodeURIComponent(q)}&origin=*`;

            const [vajehRes, wikiRes] = await Promise.allSettled([
                fetch(vajehyabUrl),
                fetch(wikiUrl)
            ]);

            let collectedMeanings = [];

            if (vajehRes.status === 'fulfilled') {
                try {
                    const vData = await vajehRes.value.json();
                    if (vData && vData.data && vData.data.results) {
                        vData.data.results.forEach(item => {
                            let parsed = parseMeanings(item.text || item.summary);
                            collectedMeanings.push(...parsed);
                        });
                    }
                } catch (e) {}
            }

            if (wikiRes.status === 'fulfilled') {
                try {
                    const wData = await wikiRes.value.json();
                    const p = wData.query.pages;
                    const id = Object.keys(p)[0];
                    if (id !== "-1" && p[id].extract) {
                        let parsedWiki = parseMeanings(p[id].extract);
                        collectedMeanings.push(...parsedWiki);
                    }
                } catch (e) {}
            }

            // پالایش و یکتا‌سازی معانی جمع‌آوری‌شده (حداکثر ۱۰ معنی)
            let finalUnique = [];
            for (let m of collectedMeanings) {
                if (!finalUnique.includes(m)) {
                    finalUnique.push(m);
                }
                if (finalUnique.length >= 10) break;
            }

            if (finalUnique.length > 0) {
                renderListResults(q, finalUnique);
            } else {
                r.innerHTML = "معنی مشخصی برای این عبارت در فرهنگ‌های لغت یافت نشد.";
            }

        } catch (err) {
            r.innerHTML = "خطا در ارتباط با سرورهای واژه‌نامه.";
        }
    }

    async function searchEncyclopedia() {
        const qRaw = document.getElementById('q').value;
        const q = cleanText(qRaw);
        const r = document.getElementById('result');

        if (!q) {
            r.innerHTML = "لطفاً موضوع مورد نظر را بنویسید.";
            return;
        }

        r.innerHTML = "در حال جستجو در دانشنامه...";

        const url = `https://fa.wikipedia.org/w/api.php?action=query&format=json&prop=extracts&exintro=true&explaintext=true&titles=${encodeURIComponent(q)}&origin=*`;
        try {
            const res = await fetch(url);
            const d = await res.json();
            const p = d.query.pages;
            const id = Object.keys(p)[0];

            if (id !== "-1" && p[id].extract) {
                r.innerHTML = `
                    <h3>${p[id].title}</h3>
                    <div class="encyclo-text">${p[id].extract}</div>
                `;
            } else {
                r.innerHTML = "مقاله‌ای درباره این موضوع در دانشنامه پیدا نشد.";
            }
        } catch {
            r.innerHTML = "خطا در اتصال به شبکه.";
        }
    }

    function renderListResults(title, list) {
        const r = document.getElementById('result');
        let html = `<h3>${title}</h3>`;
        list.forEach((m, idx) => {
            html += `
                <div class="meaning-item">
                    <span class="badge">${idx + 1}</span>
                    <span class="text">${m}</span>
                </div>
            `;
        });
        r.innerHTML = html;
    }

    document.getElementById('q').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            performSearch();
        }
    });
</script>
</body>
</html>
