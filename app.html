<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشیار - حل جدول و دانشنامه جامع</title>
    <style>
        :root {
            --primary: #0f2b48;
            --accent: #1e6091;
            --highlight: #184e77;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #22252a;
            --text-muted: #5a6578;
            --border: #e2e8f0;
            --tag-bg: #e0f2fe;
            --tag-text: #0369a1;
        }

        body {
            font-family: Tahoma, 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            direction: rtl;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* نوار تغییر حالت بین جدول و دانشنامه */
        .main-tabs {
            display: flex;
            background: #e2e8f0;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 16px;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: transparent;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #ffffff;
            color: var(--primary);
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* بخش جستجو */
        .search-section {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        .search-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 14px;
            font-size: 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        .btn-search {
            padding: 12px 20px;
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-search:hover {
            background-color: var(--highlight);
        }

        /* فیلترها */
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }

        .filter-chip {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .filter-chip.active {
            background: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        /* کارت‌ها و نتایج */
        .results-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .entry-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 5px rgba(0,0,0,0.04);
            border-right: 5px solid var(--accent);
        }

        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 6px;
        }

        .entry-title {
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--primary);
        }

        .badge {
            background: var(--tag-bg);
            color: var(--tag-text);
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .entry-content {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #334155;
            text-align: justify;
        }

        .dict-links {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding-top: 8px;
            border-top: 1px dashed var(--border);
        }

        .dict-btn {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            color: #0369a1;
            text-decoration: none;
        }

        .msg-box {
            text-align: center;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 10px;
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(0,0,0,0.1);
            border-radius: 50%;
            border-top-color: var(--accent);
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-left: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- انتخابگر تب -->
    <div class="main-tabs">
        <button class="tab-btn active" onclick="switchTab('wiki', this)">📚 دانشنامه جامع</button>
        <button class="tab-btn" onclick="switchTab('table', this)">🧩 حل جدول کلمات</button>
    </div>

    <!-- ۱. بخش دانشنامه جامع -->
    <div id="wikiSection" class="tab-content active">
        <div class="search-section">
            <div class="search-bar">
                <input type="text" id="wikiInput" placeholder="جستجو در دانشنامه (مثال: کوههای چین، آثار ویکتور هوگو، حافظ)..." onkeyup="if(event.key==='Enter') searchEncyclopedia()">
                <button class="btn-search" onclick="searchEncyclopedia()">جستجو</button>
            </div>
            <div class="filter-row">
                <button class="filter-chip active" onclick="filterWikiCat('all', this)">همه</button>
                <button class="filter-chip" onclick="filterWikiCat('جغرافیا', this)">جغرافیا و کوه‌ها</button>
                <button class="filter-chip" onclick="filterWikiCat('ادبیات', this)">ادبیات و آثار</button>
                <button class="filter-chip" onclick="filterWikiCat('تاریخ', this)">تاریخ و تمدن</button>
                <button class="filter-chip" onclick="filterWikiCat('علم', this)">علوم و طبیعت</button>
            </div>
        </div>
        <div id="wikiResults" class="results-container"></div>
    </div>

    <!-- ۲. بخش حل جدول -->
    <div id="tableSection" class="tab-content">
        <div class="search-section">
            <div class="search-bar">
                <input type="text" id="tableInput" placeholder="پرسش جدول (مثال: دیوار قلعه، اسب راهوار، سرخ شده، چین و شکن)..." onkeyup="if(event.key==='Enter') searchTable()">
                <button class="btn-search" onclick="searchTable()">جستجو</button>
            </div>
            <div class="filter-row">
                <button class="filter-chip active" onclick="filterTableLen(0, this)">همه طول‌ها</button>
                <button class="filter-chip" onclick="filterTableLen(2, this)">۲ حرف</button>
                <button class="filter-chip" onclick="filterTableLen(3, this)">۳ حرف</button>
                <button class="filter-chip" onclick="filterTableLen(4, this)">۴ حرف</button>
                <button class="filter-chip" onclick="filterTableLen(5, this)">۵ حرف</button>
                <button class="filter-chip" onclick="filterTableLen(6, this)">۶+ حرف</button>
            </div>
        </div>
        <div id="tableResults" class="results-container"></div>
    </div>
</div>

<script>
// پایگاه جامع دانشنامه‌ای داخلی (شامل آثار، کوه‌ها، مفاخر و...)
const encyclopediaData = [
    {
        title: "کوه‌های چین (رشته‌کوه‌های چین)",
        category: "جغرافیا",
        content: "مهم‌ترین کوه‌ها و رشته‌کوه‌های چین عبارتند از: ۱. رشته‌کوه تیان شان (کوه آسمانی در شمال غرب چین)، ۲. رشته‌کوه کونلون (از طویل‌ترین رشته‌کوه‌های آسیا)، ۳. هیمالیا (شامل قله اورست در مرز تبت چین و نپال)، ۴. کوه‌های چینگ‌لینگ، ۵. کوه تای‌شان و کوهستان کاراکورام.",
        keywords: ["کوه چین", "کوههای چین", "رشته کوه چین", "قله های چین", "تیان شان", "کونلون", "تبت", "هیمالیا"]
    },
    {
        title: "آثار ویکتور هوگو",
        category: "ادبیات",
        content: "ویکتور هوگو شاعر، داستان‌نویس و نمایشنامه‌نویس بزرگ سبک رمانتیسم فرانسه بود. مهم‌ترین رمان‌ها و شاهکارهای او عبارتند از: ۱. بینوایان (Les Misérables)، ۲. گوژپشت نتردام، ۳. مردی که می‌خندد، ۴. کارگران دریا، ۵. آخرین روز یک محکوم به اعدام، ۶. نود و سه، ۷. دیوان شرقیات (شعر).",
        keywords: ["ویکتور هوگو", "آثار هوگو", "کتابهای ویکتور هوگو", "بینوایان", "گوژپشت نتردام", "مردی که میخندد", "رمان نویس فرانسه"]
    },
    {
        title: "بینوایان",
        category: "ادبیات",
        content: "شاهکار ویکتور هوگو منتشر شده در سال ۱۸۶۲ که زندگی ژان والژان، کوزت، فانتین و بازرس ژاور را روایت کرده و بی‌عدالتی‌های اجتماعی و فقر در فرانسه قرن نوزدهم را به تصویر می‌کشد.",
        keywords: ["ژان والژان", "کوزت", "ویکتور هوگو", "رمان فرانسوی"]
    },
    {
        title: "تیان شان",
        category: "جغرافیا",
        content: "سیستم بزرگی از رشته‌کوه‌ها در آسیای مرکزی و غرب کشور چین (سین‌کیانگ) که به معنای «کوه‌های آسمانی» است و قله جنگش چاقوسو بلندترین نقطه آن است.",
        keywords: ["کوههای چین", "کوه چین", "رشته کوه چین", "آسیای مرکزی"]
    },
    {
        title: "تخت جمشید",
        category: "تاریخ",
        content: "پایتخت تشریفاتی و باستانی شاهنشاهی هخامنشیان که در زمان داریوش بزرگ، خشایارشا و اردشیر اول در مرودشت فارس بنا شد و شکوه معماری ایران باستان را نشان می‌دهد.",
        keywords: ["پرسپولیس", "داریوش", "کوروش", "شیراز", "ایران باستان", "هخامنش"]
    },
    {
        title: "فردوسی و شاهنامه",
        category: "ادبیات",
        content: "ابوالقاسم فردوسی طوسی، حماسه‌سرای بزرگ زبان پارسی که اثر جاودان خود، شاهنامه (شامل ۶۰ هزار بیت در اسطوره‌ها، پهلوانی‌ها و تاریخ باستان ایران) را در طول سی سال به نظم درآورد.",
        keywords: ["شاهنامه", "طوس", "رستم", "حماسه"]
    },
    {
        title: "خلیج فارس",
        category: "جغرافیا",
        content: "آبراهی حیاتی و استراتژیک در جنوب غربی آسیا و مرز جنوبی ایران که سرشار از ذخایر عظیم نفت و گاز طبیعی است.",
        keywords: ["دریای پارس", "تنگه هرمز", "جنوب ایران"]
    },
    {
        title: "اورست",
        category: "جغرافیا",
        content: "بلندترین کوه زمین با ارتفاع ۸۸۴۸٫۸۶ متر، واقع در مرز مشترک نپال و چین (منطقه خودمختار تبت).",
        keywords: ["بام جهان", "کوه چین", "هیمالیا", "قله نپال"]
    }
];

// دیتابیس واژگان حل جدول
const tableData = [
    { word: "باره", clue: "دیوار قلعه، حصار، برج و بارو، اسب" },
    { word: "بارو", clue: "دیوار قلعه، دیوار دفاعی شهر" },
    { word: "حصار", clue: "دیوار قلعه، نرده دور باغ و دژ" },
    { word: "دژ", clue: "قلعه، سنگر، حصار محکم" },
    { word: "تاب", clue: "چین و شکن، پیچ و تاب زلف، توان و قدرت" },
    { word: "شکن", clue: "چین و شکن، چین جامه و زلف" },
    { word: "فر", clue: "چین و شکن مو، شکوه و جلال" },
    { word: "رهوار", clue: "اسب راهوار، اسب تندرو و خوش‌گام" },
    { word: "سمند", clue: "اسب راهوار زرد یا طلایی رنگ" },
    { word: "یبه", clue: "اسب راهوار بارکش" },
    { word: "برشته", clue: "سرخ شده، بوداده در آتش، تفت داده" },
    { word: "تفتیده", clue: "سرخ شده، بسیار گرم و داغ" },
    { word: "یرا", clue: "دلیری، شجاعت، دلاوری، توانایی" },
    { word: "تاک", clue: "درخت انگور، مو، رز" },
    { word: "کاکو", clue: "برادر در گویش شیرین شیرازی" },
    { word: "برار", clue: "برادر در گویش خراسانی و لری" }
];

let selectedWikiCat = "all";
let selectedTableLen = 0;

// سوئیچ تب‌ها
function switchTab(tab, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    if (tab === 'wiki') {
        document.getElementById('wikiSection').classList.add('active');
        document.getElementById('tableSection').classList.remove('active');
    } else {
        document.getElementById('tableSection').classList.add('active');
        document.getElementById('wikiSection').classList.remove('active');
    }
}

// نرمال‌سازی هوشمند فارسی (شامل رفع انواع «ها»، «های»، نیم‌فاصله‌ها و حروف عربی)
function smartNormalize(str) {
    if (!str) return "";
    let s = str.toString()
        .replace(/[يى]/g, "ی")
        .replace(/[ك]/g, "ک")
        .replace(/[\u064B-\u065F\u0670]/g, "")
        .replace(/\u200C/g, " ")
        .replace(/کوه‌های/g, "کوه های")
        .replace(/کوههای/g, "کوه های")
        .replace(/کتاب‌های/g, "کتاب های")
        .replace(/کتابهای/g, "کتاب های")
        .replace(/آثار/g, "اثار")
        .toLowerCase();

    // حذف کلمات توقف و ریشه‌یابی پسوندهای جمع رایج
    return s.replace(/\s+/g, " ").trim();
}

function getBaseTokens(query) {
    const rawTokens = smartNormalize(query).split(" ").filter(Boolean);
    const stopWords = ["های", "ها", "ی", "از", "در", "به", "و", "با", "ترین", "شده"];
    
    return rawTokens.map(t => {
        // حذف پسوند «های» یا «ها» چسبیده به انتهای کلمه
        if (t.endsWith("های") && t.length > 4) t = t.slice(0, -3);
        else if (t.endsWith("ها") && t.length > 3) t = t.slice(0, -2);
        return t;
    }).filter(t => !stopWords.includes(t) && t.length > 1);
}

// واژه‌نامه‌های آنلاین
function getDictionaryLinks(term) {
    const enc = encodeURIComponent(term);
    return `
        <div class="dict-links">
            <span style="font-size:0.75rem; color:#64748b; align-self:center;">جستجو در منابع:</span>
            <a class="dict-btn" href="https://abadis.ir/fatofa/${enc}/" target="_blank">📚 آبادیس</a>
            <a class="dict-btn" href="https://dehkhoda.ut.ac.ir/fa/dictionary/${enc}" target="_blank">📖 دهخدا</a>
            <a class="dict-btn" href="https://vajehyab.com/?q=${enc}" target="_blank">📗 واژه‌یاب</a>
            <a class="dict-btn" href="https://fa.wikipedia.org/wiki/${enc}" target="_blank">🌐 ویکی‌پدیا</a>
        </div>
    `;
}

// ------------------- بخش ۱: دانشنامه -------------------
function filterWikiCat(cat, btn) {
    selectedWikiCat = cat;
    document.querySelectorAll('#wikiSection .filter-chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    searchEncyclopedia();
}

async function searchEncyclopedia() {
    const rawQuery = document.getElementById('wikiInput').value.trim();
    const container = document.getElementById('wikiResults');
    container.innerHTML = "";

    if (!rawQuery) {
        showDefaultWikiList();
        return;
    }

    const normQuery = smartNormalize(rawQuery);
    const tokens = getBaseTokens(rawQuery);

    // ۱. جستجو در پایگاه دانشنامه داخلی
    let localMatches = encyclopediaData.filter(item => {
        if (selectedWikiCat !== 'all' && item.category !== selectedWikiCat) return false;

        const fullText = smartNormalize(item.title + " " + item.content + " " + (item.keywords || []).join(" "));
        
        if (fullText.includes(normQuery)) return true;
        // اگر همه واژه‌های کلیدی (مثل کوه + چین یا اثار + هوگو) در متن باشند
        if (tokens.length > 0 && tokens.every(t => fullText.includes(t))) return true;
        return false;
    });

    if (localMatches.length > 0) {
        localMatches.forEach(item => {
            container.innerHTML += `
                <div class="entry-card">
                    <div class="entry-header">
                        <span class="entry-title">${item.title}</span>
                        <span class="badge">${item.category}</span>
                    </div>
                    <div class="entry-content">${item.content}</div>
                    ${getDictionaryLinks(item.title)}
                </div>
            `;
        });
        return;
    }

    // ۲. در صورت نبودن در پایگاه آفلاین، جستجوی همه‌جانبه آنلاین (Wikipedia Search API)
    container.innerHTML = `<div class="msg-box"><span class="loading-spinner"></span> در حال جستجوی گسترده در دانشنامه...</div>`;
    
    try {
        // ابتدا جستجوی زنده سرعنوان‌ها در ویکی‌پدیا
        const searchApiUrl = `https://fa.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(rawQuery)}&format=json&origin=*&utf8=1`;
        const res = await fetch(searchApiUrl);
        const data = await res.json();

        if (data.query && data.query.search && data.query.search.length > 0) {
            container.innerHTML = "";
            const items = data.query.search.slice(0, 4); // نمایش ۴ نتیجه برتر مرتبط

            items.forEach(article => {
                // حذف تگ‌های HTML در متن خلاصه
                const cleanSnippet = article.snippet.replace(/<\/?[^>]+(>|$)/g, "");
                container.innerHTML += `
                    <div class="entry-card">
                        <div class="entry-header">
                            <span class="entry-title">${article.title}</span>
                            <span class="badge">دانشنامه آنلاین</span>
                        </div>
                        <div class="entry-content">${cleanSnippet}...</div>
                        ${getDictionaryLinks(article.title)}
                    </div>
                `;
            });
            return;
        }
    } catch (e) {
        console.warn("خطا در واکشی دانشنامه آنلاین:", e);
    }

    container.innerHTML = `
        <div class="msg-box">
            <h3>موردی با این عبارت یافت نشد</h3>
            <p>عبارت «<strong>${rawQuery}</strong>» در پایگاه ثبت نشده است. می‌توانید مستقیماً در دانشنامه‌ها و لغت‌نامه‌ها جستجو کنید:</p>
            ${getDictionaryLinks(rawQuery)}
        </div>
    `;
}

function showDefaultWikiList() {
    const container = document.getElementById('wikiResults');
    container.innerHTML = "";
    encyclopediaData.forEach(item => {
        if (selectedWikiCat !== 'all' && item.category !== selectedWikiCat) return;
        container.innerHTML += `
            <div class="entry-card">
                <div class="entry-header">
                    <span class="entry-title">${item.title}</span>
                    <span class="badge">${item.category}</span>
                </div>
                <div class="entry-content">${item.content}</div>
                ${getDictionaryLinks(item.title)}
            </div>
        `;
    });
}

// ------------------- بخش ۲: حل جدول -------------------
function filterTableLen(len, btn) {
    selectedTableLen = len;
    document.querySelectorAll('#tableSection .filter-chip').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    searchTable();
}

function searchTable() {
    const raw = document.getElementById('tableInput').value.trim();
    const container = document.getElementById('tableResults');
    container.innerHTML = "";
    if (!raw) return;

    const normQuery = smartNormalize(raw);
    const tokens = getBaseTokens(raw);

    const matches = tableData.filter(item => {
        const w = smartNormalize(item.word);
        const c = smartNormalize(item.clue);

        if (selectedTableLen > 0) {
            if (selectedTableLen === 6 && item.word.length < 6) return false;
            if (selectedTableLen < 6 && item.word.length !== selectedTableLen) return false;
        }

        if (w === normQuery || c.includes(normQuery)) return true;
        if (tokens.length > 0 && tokens.every(t => c.includes(t) || w.includes(t))) return true;
        return false;
    });

    if (matches.length === 0) {
        container.innerHTML = `
            <div class="msg-box">
                <p>پاسخی در جدول برای «<strong>${raw}</strong>» ثبت نشده است.</p>
                ${getDictionaryLinks(raw)}
            </div>
        `;
        return;
    }

    matches.forEach(item => {
        container.innerHTML += `
            <div class="entry-card">
                <div class="entry-header">
                    <span class="entry-title">${item.word}</span>
                    <span class="badge">${item.word.length} حرفی</span>
                </div>
                <div class="entry-content"><strong>معنا و پاسخ جدول:</strong> ${item.clue}</div>
                ${getDictionaryLinks(item.word)}
            </div>
        `;
    });
}

// اجرای اولیه هنگام باز شدن
window.onload = function() {
    showDefaultWikiList();
};
</script>
