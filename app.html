<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشیار - جستجوی هوشمند</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f1f5f9; padding: 10px; }
        .container { max-width: 650px; margin: auto; background: white; padding: 16px; border-radius: 12px; }
        #status { font-size: 0.9rem; text-align: center; margin-bottom: 10px; color: #64748b; }
        .search-area { display: flex; gap: 8px; margin-bottom: 8px; }
        input { flex: 1; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
        button { padding: 12px 20px; background: #dc2626; color: white; border: none; border-radius: 8px; font-weight: bold; }
        .result-item { padding: 12px; border-bottom: 1px solid #f1f5f9; }
    </style>
</head>
<body>

<div class="container">
    <h1>دانشیار</h1>
    <div id="status">در حال بررسی فایل‌ها...</div>
    <div class="search-area">
        <input type="text" id="query" placeholder="جستجو...">
        <button onclick="search()">جستجو</button>
    </div>
    <div id="results"></div>
</div>

<!-- اینجا فایل‌ها را وارد می‌کنیم -->
<script src="dehkhoda.js"></script>
<script src="amid.js"></script>
<script src="moein.js"></script>
<script src="abadis.js"></script>

<script>
    let allData = [];

    function process(arr, name) {
        if (!arr || !Array.isArray(arr)) return;
        arr.forEach(item => {
            allData.push({
                w: (item.word || item.w || item.title || ""),
                m: (item.meaning || item.m || item.def || ""),
                src: name
            });
        });
    }

    window.onload = function() {
        // بررسی اینکه آیا فایل‌ها لود شده‌اند یا خیر
        if (typeof window.dehkhoda !== 'undefined') process(window.dehkhoda, 'دهخدا');
        if (typeof window.amid !== 'undefined') process(window.amid, 'عمید');
        if (typeof window.moein !== 'undefined') process(window.moein, 'معین');
        if (typeof window.abadis !== 'undefined') process(window.abadis, 'آبادیس');

        const statusEl = document.getElementById('status');
        if (allData.length > 0) {
            statusEl.innerText = `تعداد کل لغات: ${allData.length.toLocaleString('fa-IR')}`;
            statusEl.style.color = "green";
        } else {
            statusEl.innerHTML = "<b>خطا!</b> فایل‌های JS لود نشدند. <br> مطمئن شوید نام فایل‌ها دقیقا همان چیزی است که نوشته شده و کنار app.html هستند.";
            statusEl.style.color = "red";
        }
    };

    function search() {
        const q = document.getElementById('query').value.trim();
        const results = allData.filter(i => i.w.includes(q));
        const resDiv = document.getElementById('results');
        resDiv.innerHTML = results.map(i => `<div class="result-item"><b>${i.w}</b><br>${i.m}</div>`).join('');
    }
</script>
</body>
</html>
