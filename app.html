<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دانشیار - حل جدول و اطلاعات عمومی</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
    }
    h1 {
      font-size: 1.3rem;
      text-align: center;
      margin-bottom: 12px;
      color: var(--accent);
    }
    .search-box {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      margin-bottom: 12px;
    }
    .status {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 10px;
      text-align: center;
    }
    .results {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card {
      background: var(--card);
      padding: 10px 14px;
      border-radius: 8px;
      border-right: 4px solid var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .word {
      font-weight: bold;
      color: #38bdf8;
      font-size: 1.05rem;
    }
    .meaning {
      font-size: 0.9rem;
      color: #cbd5e1;
      text-align: left;
      direction: ltr;
    }
    .meaning.rtl {
      text-align: right;
      direction: rtl;
    }
    .category {
      display: inline-block;
      font-size: 0.75rem;
      background: #334155;
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 4px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>دانشیار (دستیار جدول)</h1>
  <input type="text" id="searchInput" class="search-box" placeholder="جستجو (مثلاً: پایتخت، آ...ش، آب)..." disabled>
  <div id="status" class="status">در حال آماده‌سازی و بارگذاری اطلاعات...</div>
  <div id="results" class="results"></div>
</div>

<script>
  // بانک داده فشرده‌شده با فرمت فشرده استاندارد
  // در به‌روزرسانی‌های بعدی فقط این متغیر آپدیت می‌شود
  const RAW_DATA = [
    ["آب", "عمومی", "مایع حیات، هیدروژن اکسید"],
    ["آذر", "تقویم", "ماه نهم سال شمسی"],
    ["آرش", "اساطیر", "کمانگیر نامدار ایرانی"],
    ["آسیاب", "ابزار", "دستگاه خرد کردن غلات"],
    ["آهو", "جانور", "غزال، جیران"],
    ["ابریشم", "پوشاک", "الیاف لطیف تولید شده از پیله"],
    ["اتریش", "جغرافیا", "کشوری در اروپای مرکزی، پایتخت: وین"],
    ["اردن", "جغرافیا", "کشوری در غرب آسیا، پایتخت: امان"],
    ["اسپانیا", "جغرافیا", "کشوری در جنوب غربی اروپا، پایتخت: مادرید"],
    ["اسطرلاب", "ابزار", "دستگاه ستاره‌شناسی باستانی"],
    ["البرز", "جغرافیا", "رشته‌کوه معروف شمال ایران"],
    ["امید", "عمومی", "رجاء، آرزو"],
    ["انار", "میوه", "نار، میوه پاییزی سرخ‌رنگ"],
    ["اورانوس", "نجوم", "هفتمین سیاره منظومه شمسی"],
    ["ایتالیا", "جغرافیا", "کشوری چکمه‌ای شکل در اروپا، پایتخت: رم"],
    ["ایران", "جغرافیا", "کشوری در غرب آسیا، کهن‌دیار"],
    ["ببر", "جانور", "پستاندار درنده از خانواده گربه‌سانان"],
    ["بغداد", "جغرافیا", "پایتخت کشور عراق"],
    ["بلبل", "پرنده", "هزاردستان، عندلیب"],
    ["بهار", "فصل", "نخستین فصل سال خورشیدی"],
    ["پاریس", "جغرافیا", "پایتخت کشور فرانسه، شهر نور"],
    ["پاسارگاد", "تاریخ", "آرامگاه کوروش بزرگ در استان فارس"],
    ["پزشک", "مشاغل", "طبیب، دکتر درمانگر"],
    ["پلنگ", "جانور", "گربه‌سان سریع و درنده خال‌دار"],
    ["تاجیکستان", "جغرافیا", "کشور فارسی‌زبان، پایتخت: دوشنبه"],
    ["تلسکوپ", "ابزار", "دوربین نجومی رصد آسمان"],
    ["تهران", "جغرافیا", "پایتخت ایران"],
    ["تیمور", "تاریخ", "بنیان‌گذار دودمان گورکانیان"],
    ["ثابت", "عمومی", "استوار، پایدار، بدون تغییر"],
    ["جام‌جم", "ادبیات", "جام جهان‌بین جمشید در شاهنامه"],
    ["جمشید", "اساطیر", "پادشاه پیشدادی در شاهنامه"],
    ["جیران", "جانور", "آهو، غزال"],
    ["چنار", "گیاه", "درختی بلند و سایه‌دار"],
    ["حافظ", "ادبیات", "لسان‌الغیب، شاعر شیراز قرن هشتم"],
    ["خیام", "ادبیات", "حکیم نیشابوری، رباعی‌سرا و ریاضیدان"],
    ["دماوند", "جغرافیا", "بلندترین قله آتشفشانی ایران"],
    ["دهخدا", "ادبیات", "مؤلف لغت‌نامه بزرگ دهخدا"],
    ["رستم", "اساطیر", "بزرگ‌ترین پهلوان شاهنامه فردوسی"],
    ["سعدی", "ادبیات", "استاد سخن، صاحب گلستان و بوستان"],
    ["سهراب", "اساطیر", "پسر رستم و تهمینه در شاهنامه"],
    ["سیمرغ", "اساطیر", "پرنده افسانه‌ای شاهنامه ساکن قاف"],
    ["شاهنامه", "ادبیات", "شاهکار حماسی ابوالقاسم فردوسی"],
    ["شیرین", "ادبیات", "معشوقه خسرو پرویز و فرهاد"],
    ["فردوسی", "ادبیات", "سراینده شاهنامه، دهقان طوس"],
    ["کوروش", "تاریخ", "بنیان‌گذار سلسله هخامنشیان"],
    ["مادرید", "جغرافیا", "پایتخت کشور اسپانیا"],
    ["مریخ", "نجوم", "بهرام، سیاره سرخ‌رنگ منظومه شمسی"],
    ["نیلوفر", "گیاه", "گل لوتوس، نماد پاکی باستان"],
    ["وین", "جغرافیا", "پایتخت اتریش، شهر موسیقی"]
  ];

  let wordsBank = [];
  const searchInput = document.getElementById('searchInput');
  const statusEl = document.getElementById('status');
  const resultsEl = document.getElementById('results');

  // آماده‌سازی و لود دیتا
  function initData() {
    wordsBank = RAW_DATA.map(item => ({
      word: item[0],
      category: item[1],
      meaning: item[2]
    }));
    statusEl.textContent = `بانک آماده است (${wordsBank.length} کلمه فعال)`;
    searchInput.disabled = false;
    searchInput.focus();
    render(wordsBank.slice(0, 15)); // نمایش اولیه چند مدخل
  }

  // موتور جستجو با پشتیبانی از حل جدول و متن
  function search(query) {
    query = query.trim();
    if (!query) {
      render(wordsBank.slice(0, 15));
      statusEl.textContent = `نمایش نمونه (${wordsBank.length} کلمه در بانک)`;
      return;
    }

    // بررسی آیا جستجوی الگوی جدول است (حاوی نقطه یا خط تیره مثل: آ..ش)
    const isPattern = /[.\-_]/.test(query);

    let filtered = [];
    if (isPattern) {
      const regexStr = '^' + query.replace(/[.\-_]/g, '.') + '$';
      try {
        const reg = new RegExp(regexStr);
        filtered = wordsBank.filter(item => reg.test(item.word));
      } catch (e) {
        filtered = [];
      }
    } else {
      // جستجوی معمولی در کلمه و معنی
      filtered = wordsBank.filter(item => 
        item.word.includes(query) || 
        item.meaning.includes(query) || 
        item.category.includes(query)
      );
    }

    statusEl.textContent = `${filtered.length} نتیجه پیدا شد`;
    render(filtered.slice(0, 50)); // جلوگیری از هنگ با محدود کردن نمایش اولیه
  }

  function render(items) {
    resultsEl.innerHTML = '';
    if (items.length === 0) {
      resultsEl.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:20px;">موردی یافت نشد.</div>';
      return;
    }

    const fragment = document.createDocumentFragment();
    items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div>
          <div class="word">${item.word}</div>
          <div class="category">${item.category}</div>
        </div>
        <div class="meaning rtl">${item.meaning}</div>
      `;
      fragment.appendChild(card);
    });
    resultsEl.appendChild(fragment);
  }

  // گوش دادن به ورودی کیبورد
  searchInput.addEventListener('input', (e) => search(e.target.value));

  // راه‌اندازی در شروع
  initData();
</script>

</body>
</html>
