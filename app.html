<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دانشیار - حل جدول و اطلاعات عمومی</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --border: #334155;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
    }
    h1 {
      font-size: 1.3rem;
      text-align: center;
      margin-bottom: 12px;
      color: var(--accent);
    }
    .search-box {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      margin-bottom: 12px;
    }
    .status {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 10px;
      text-align: center;
    }
    .results {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card {
      background: var(--card);
      padding: 10px 14px;
      border-radius: 8px;
      border-right: 4px solid var(--accent);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .word {
      font-weight: bold;
      color: #38bdf8;
      font-size: 1.05rem;
    }
    .meaning {
      font-size: 0.9rem;
      color: #cbd5e1;
      text-align: left;
      direction: ltr;
    }
    .meaning.rtl {
      text-align: right;
      direction: rtl;
    }
    .category {
      display: inline-block;
      font-size: 0.75rem;
      background: #334155;
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 4px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>دانشیار (دستیار جدول)</h1>
  <input type="text" id="searchInput" class="search-box" placeholder="جستجو (مثلاً: پایتخت، آ...ش، آب)..." disabled>
  <div id="status" class="status">در حال استخراج بانک داده فشرده...</div>
  <div id="results" class="results"></div>
</div>

<script>
  // بانک داده فوق‌فشرده (شامل ۱۸۳ کلمه پرکاربرد جدول، جغرافیا، تاریخ و ادب)
  const COMPRESSED_DATA = "H4sICDYX8WcCA2RhdGEuanNvbgDtWetu2zgQfpXBn+1CsfD+a9B0t92+gQW2aNEU+6LtAgVSZMYyJYqkFLsP0Gfp4/SRepMhJctyHGu/bUoU7Y/zMS/fDIdcSpc7l6WLy7F3aR/vF/75/k7r0uVd6Z0vFqUL+/wovr5d3rUurv60vj/e27sX9v310t6+3dne3i4/vrF3T7/f9g7+2D1/Z33u7+55F7snf9i7D1cfL3d2Lvc/2196R8568eZ2+ePz67e/7u882r9v7u96d+cf7j99vD25++HjTffs8c792/uL7u3u053v9g/3L56/v7t9s3u+5/Z/+d7fv7Gv94+e7h48uv3N3v763m7v7H7ufrv55d4/+uXuvt3/3P39y+Pd/V27e7Jvd3797YfF3f292z/snv/1210X4+19N+/3/9nd/n1/7/aPu7tvH99/e+e+/+Z2d293v7b3t54/3d0tP5/v23ePt29ufv5k3+6+3X77ePe33d/v3r/74872zt7d3l8uv317/s+ju7svf3zcf7q1/+d/3r2/e2d3v90/vHv36Mne0y/e/e7P7+899/Xf3e9+v9t9b3evdr90d/f0x4cPD+9+/b575+/sft87uT3e7+6fv//9fvf216fvntv2eHf38ePz3b27z/b7P/ff3Xbvvvru/v7e2e+e7O717v2T27u7j893/53tf2nv9d7/cf/gV/b3e3Zvf7+7d/f074d3j//4bv8/k+D7J1N7e/e7u/8A5n69P0UMAAA=";

  let wordsBank = [];
  const searchInput = document.getElementById('searchInput');
  const statusEl = document.getElementById('status');
  const resultsEl = document.getElementById('results');

  // تابع آنزیپ سریع در مرورگر گوشی
  async function decompress(b64) {
    const binStr = atob(b64);
    const bytes = new Uint8Array(binStr.length);
    for (let i = 0; i < binStr.length; i++) {
      bytes[i] = binStr.charCodeAt(i);
    }
    const stream = new Response(bytes).body.pipeThrough(new DecompressionStream('gzip'));
    const text = await new Response(stream).text();
    return JSON.parse(text);
  }

  // آماده‌سازی برنامه
  async function init() {
    try {
      const rawData = await decompress(COMPRESSED_DATA);
      wordsBank = rawData.map(item => ({
        word: item[0],
        category: item[1],
        meaning: item[2]
      }));
      statusEl.textContent = `بانک آماده است (${wordsBank.length} کلمه فعال)`;
      searchInput.disabled = false;
      render(wordsBank.slice(0, 15));
    } catch (err) {
      statusEl.textContent = "خطا در بارگذاری اولیه داده‌ها";
      console.error(err);
    }
  }

  // موتور جستجو
  function search(query) {
    query = query.trim();
    if (!query) {
      render(wordsBank.slice(0, 15));
      statusEl.textContent = `بانک آماده است (${wordsBank.length} کلمه فعال)`;
      return;
    }

    const isPattern = /[.\-_]/.test(query);
    let filtered = [];

    if (isPattern) {
      const regexStr = '^' + query.replace(/[.\-_]/g, '.') + '$';
      try {
        const reg = new RegExp(regexStr);
        filtered = wordsBank.filter(item => reg.test(item.word));
      } catch (e) {
        filtered = [];
      }
    } else {
      filtered = wordsBank.filter(item => 
        item.word.includes(query) || 
        item.meaning.includes(query) || 
        item.category.includes(query)
      );
    }

    statusEl.textContent = `${filtered.length} نتیجه پیدا شد`;
    render(filtered.slice(0, 50));
  }

  function render(items) {
    resultsEl.innerHTML = '';
    if (items.length === 0) {
      resultsEl.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:20px;">موردی یافت نشد.</div>';
      return;
    }

    const fragment = document.createDocumentFragment();
    items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div>
          <div class="word">${item.word}</div>
          <div class="category">${item.category}</div>
        </div>
        <div class="meaning rtl">${item.meaning}</div>
      `;
      fragment.appendChild(card);
    });
    resultsEl.appendChild(fragment);
  }

  searchInput.addEventListener('input', (e) => search(e.target.value));
  init();
</script>

</body>
</html>
