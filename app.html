<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دانشیار • لغت، جدول و دانشنامه</title>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-dark: #1557b0;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #202124;
      --text-muted: #5f6368;
      --border: #dadce0;
      --badge-bg: #e8f0fe;
      --badge-text: #1967d2;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, sans-serif;
    }

    body {
      margin: 0;
      padding: 12px;
      background-color: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    h1 {
      margin: 4px 0;
      font-size: 1.4rem;
      color: var(--primary);
    }

    .mode-switch {
      display: flex;
      background: #e9ecef;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 12px;
      gap: 4px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .search-box {
      display: flex;
      gap: 6px;
      margin-bottom: 15px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      font-size: 1rem;
      border: 2px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: #fff;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    .submit-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: var(--primary-dark);
    }

    .answer-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .answer-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-right: 5px solid var(--primary);
      padding: 12px 16px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .answer-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: #111;
    }

    .answer-count {
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.85rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .wiki-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      line-height: 1.8;
      font-size: 1rem;
    }

    .wiki-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    .loading, .empty {
      text-align: center;
      padding: 25px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>دانشیار</h1>
  </header>

  <!-- دکمه‌های تغییر حالت -->
  <div class="mode-switch">
    <button type="button" class="mode-btn active" id="btn-words" onclick="setMode('words')">
      معانی و کلمات جدول (بدون توضیح)
    </button>
    <button type="button" class="mode-btn" id="btn-wiki" onclick="setMode('wiki')">
      دانشنامه
    </button>
  </div>

  <!-- فرم جستجو -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="کلمه یا سوال جدولی را وارد کنید..." autocomplete="off">
    <button type="button" id="searchBtn" class="submit-btn" onclick="executeSearch()">جستجو</button>
  </div>

  <!-- نمایش نتایج -->
  <div id="resultsArea">
    <div class="empty">کلمه یا عبارتی را جستجو کنید.</div>
  </div>
</div>

<script>
  let currentMode = 'words';

  // بانک جامع کلمات جدول و معانی دقیق
  const TABLE_DB = {
    "درخت انگور": ["مو", "رز", "تاک"],
    "انگور": ["مو", "رز", "تاک"],
    "شراب": ["می", "باده", "خمر", "مل", "صهبا", "نبیذ", "راح"],
    "کمک": ["یاری", "مدد", "مساعدت", "نصرت", "اعانت", "دستگیری"],
    "شوخ": ["بذله‌گو", "شنگول", "طناز", "خوش‌مشرب", "ظریف", "لطیفه‌گو"],
    "پدر": ["اب", "والد", "بابا", "پت", "پویا"],
    "مادر": ["ام", "والده", "مام"],
    "آب": ["ما", "مایه حیات"],
    "آتش": ["نار", "آذر", "آتشک", "شرار", "هیر"],
    "خورشید": ["مهر", "شمس", "خور", "آفتاب", "هور", "بیضا", "شارق"],
    "ماه": ["قمر", "بدر", "مه", "هلال"],
    "درخت": ["شجر", "دار"],
    "پادشاه": ["ملک", "شاه", "سلطان", "کیا", "خسرو", "خدیو", "شهریار"],
    "مار بزرگ": ["اژدها", "ارقم"],
    "جزایر ژاپن": ["هونشو", "هوکایدو", "کیوشو", "شیکوکو", "اوکیناوا"],
    "اسب": ["باره", "فرس", "سمند", "توسن", "اشقر", "رخش"],
    "خانه": ["بیت", "سرا", "منزل", "دار", "کاشانه", "مسکن"],
    "زیبا": ["جمیل", "خوب‌رو", "مه‌رو", "پریچهر", "وسیم"],
    "آسمان": ["فلک", "سما", "گردون", "چرخ", "مینا"],
    "چشم": ["عین", "باصر", "دیده", "بصر"],
    "لب": ["شفت", "لعل"],
    "تیرانداز": ["رامی", "نابل"],
    "عسل": ["شهد", "انگبین", "عسوب"],
    "طلا": ["زر", "ذهب", "تبریز"],
    "نقره": ["سیم", "فضه"],
    "شمشیر": ["تیغ", "سیف", "صمصام", "حسام"],
    "کفش": ["پاپوش", "لنگه", "نعل"],
    "بیماری": ["مرض", "دا", "سقم", "علت", "رنجور"]
  };

  // کلمات هرز و دستور زبانی که نباید به عنوان معنی نشان داده شوند
  const JUNK_WORDS = new Set([
    'فارسی', 'پارسی', 'عربی', 'اسم', 'صفت', 'قید', 'فعل', 'حرف', 'ریشه‌شناسی',
    'آوایش', 'واژه‌شناسی', 'ترجمه‌ها', 'منابع', 'واژه‌نامه', 'مترادف‌ها', 'متضادها',
    'دستور زبان', 'مفرد', 'جمع', 'مذکر', 'مونث', 'انگلیسی', 'فرانسوی', 'لاتین',
    'صفحه', 'رده', 'ویکی‌واژه', 'گویش', 'اصطلاح', 'کنایه', 'ضرب‌المثل'
  ]);

  function setMode(mode) {
    currentMode = mode;
    document.getElementById('btn-words').classList.toggle('active', mode === 'words');
    document.getElementById('btn-wiki').classList.toggle('active', mode === 'wiki');
    const input = document.getElementById('searchInput');
    if (input.value.trim()) {
      executeSearch();
    }
  }

  document.getElementById('searchInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      executeSearch();
    }
  });

  async function executeSearch() {
    const input = document.getElementById('searchInput');
    const query = input.value.trim();
    const container = document.getElementById('resultsArea');

    if (!query) {
      container.innerHTML = '<div class="empty">لطفاً عبارتی بنویسید.</div>';
      return;
    }

    container.innerHTML = '<div class="loading">در حال پردازش...</div>';

    if (currentMode === 'words') {
      await searchCleanWords(query, container);
    } else {
      await searchEncyclopedia(query, container);
    }
  }

  // ۱. منطق استخراج معانی و کلمات تمیز بدون اضافات
  async function searchCleanWords(query, container) {
    let answers = [];

    // الف) جستجو در دیتابیس داخلی
    for (const key in TABLE_DB) {
      if (key === query || key.includes(query) || query.includes(key)) {
        answers.push(...TABLE_DB[key]);
      }
    }

    // ب) واکشی از سرویس آنلاین و فیلتر دقیق فقط روی بخش مترادف و معانی
    try {
      const url = `https://fa.wiktionary.org/w/api.php?action=parse&format=json&page=${encodeURIComponent(query)}&prop=wikitext&origin=*`;
      const res = await fetch(url);
      const data = await res.json();
      
      if (data && data.parse && data.parse.wikitext) {
        const fullText = data.parse.wikitext['*'];

        // تفکیک خط به خط برای پیدا کردن خطوط حاوی معنی (#) یا مترادف (==== مترادف‌ها ====)
        const lines = fullText.split('\n');
        let inSynonymSection = false;

        for (let line of lines) {
          line = line.trim();
          if (line.includes('مترادف') || line.includes('هم‌معنی')) {
            inSynonymSection = true;
            continue;
          }
          if (line.startsWith('===')) {
            inSynonymSection = false;
          }

          // استخراج فقط از خطوط معنی‌دار
          if (inSynonymSection || line.startsWith('#') || line.startsWith('*')) {
            const matches = line.match(/\[\[([^\]|#]+)(?:\|[^\]]+)?\]\]/g);
            if (matches) {
              matches.forEach(m => {
                let w = m.replace(/\[\[|\]\]/g, '').split('|')[0].trim();
                // فیلتر کلمات هرز و علائم
                if (
                  w && 
                  w !== query && 
                  !JUNK_WORDS.has(w) && 
                  !w.includes(':') && 
                  !w.includes('/') &&
                  w.length <= 15 // جلوگیری از ورود جملات بلند
                ) {
                  answers.push(w);
                }
              });
            }
          }
        }
      }
    } catch (err) {
      console.log('خطای واکشی آنلاین:', err);
    }

    // حذف تکراری‌ها و فیلتر کلمات بی‌معنی
    answers = [...new Set(answers.map(w => w.trim()).filter(w => w && w !== query && !JUNK_WORDS.has(w)))];

    if (answers.length === 0) {
      container.innerHTML = `
        <div class="empty">
          معنایی برای «${query}» یافت نشد.<br><br>
          <a href="https://www.google.com/search?q=${encodeURIComponent('معنی جدول ' + query)}" target="_blank" style="color:var(--primary);text-decoration:none;font-weight:bold;">
            🔍 جستجوی مستقیم در گوگل
          </a>
        </div>`;
      return;
    }

    // مرتب‌سازی بر اساس تعداد حروف (از کوتاه به بلند، مناسب حل جدول)
    answers.sort((a, b) => a.replace(/[\s‌]/g, '').length - b.replace(/[\s‌]/g, '').length);

    // ساخت خروجی خالص (فقط نام کلمه و تعداد حروف)
    let html = '<ul class="answer-list">';
    answers.forEach(word => {
      const charLen = word.replace(/[\s‌]/g, '').length;
      html += `
        <li class="answer-item">
          <span class="answer-text">${word}</span>
          <span class="answer-count">${charLen} حرفی</span>
        </li>
      `;
    });
    html += '</ul>';

    container.innerHTML = html;
  }

  // ۲. منطق دانشنامه (فقط پاراگراف اختصاصی همان موضوع)
  async function searchEncyclopedia(query, container) {
    try {
      const url = `https://fa.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error();

      const data = await res.json();
      if (data.extract) {
        container.innerHTML = `
          <div class="wiki-card">
            <div class="wiki-title">${data.title}</div>
            <p>${data.extract}</p>
          </div>
        `;
        return;
      }
    } catch (err) {
      // اگر مستقیماً پیدا نشد، تلاش برای جستجوی متنی
      try {
        const searchUrl = `https://fa.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`;
        const sRes = await fetch(searchUrl);
        const sData = await sRes.json();
        if (sData.query && sData.query.search && sData.query.search.length > 0) {
          const first = sData.query.search[0];
          const cleanSnippet = first.snippet.replace(/<[^>]*>/g, '');
          container.innerHTML = `
            <div class="wiki-card">
              <div class="wiki-title">${first.title}</div>
              <p>${cleanSnippet}...</p>
            </div>
          `;
          return;
        }
      } catch (e) {}
    }

    container.innerHTML = `
      <div class="empty">
        مطلبی در دانشنامه برای این موضوع ثبت نشده است.<br><br>
        <a href="https://www.google.com/search?q=${encodeURIComponent(query)}" target="_blank" style="color:var(--primary);text-decoration:none;font-weight:bold;">
          🔍 جستجوی «${query}» در وب
        </a>
      </div>`;
  }
</script>

</body>
</html>
