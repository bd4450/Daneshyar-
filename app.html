<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دانشیار - جستجو</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="resultsContainer">
        <!-- نتایج جستجو اینجا قرار می‌گیرند -->
    </div>

    <script>
        function renderResults(results) {
            const container = document.getElementById('resultsContainer');
            container.innerHTML = ''; // پاک کردن نتایج قبلی

            // نمایش نتایج دانشنامه
            if (results.entries && results.entries.length > 0) {
                results.entries.forEach(entry => {
                    const div = document.createElement('div');
                    div.className = 'result-card';
                    div.innerHTML = `
                        <h3>${entry.title_fa || 'بدون عنوان'}</h3>
                        <p>${entry.content_fa || 'بدون توضیحات'}</p>
                        <small>دسته‌بندی: ${entry.category_fa || 'عمومی'}</small>
                    `;
                    container.appendChild(div);
                });
            }

            // نمایش نتایج جدول (در صورت وجود)
            if (results.crosswordMatches && results.crosswordMatches.length > 0) {
                results.crosswordMatches.forEach(match => {
                    const div = document.createElement('div');
                    div.className = 'crossword-card';
                    div.innerHTML = `<strong>کلمه:</strong> ${match.answer} <br> <strong>راهنما:</strong> ${match.clue}`;
                    container.appendChild(div);
                });
            }

            if (results.entries.length === 0 && results.crosswordMatches.length === 0) {
                container.innerHTML = '<p>نتیجه‌ای یافت نشد.</p>';
            }
        }
    </script>
</body>
</html>
