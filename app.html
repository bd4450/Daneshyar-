<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشیار - حل جدول و اطلاعات عمومی</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --accent: #f59e0b;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            text-align: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-size: 1.4rem;
            color: var(--primary);
            margin-bottom: 6px;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .search-box {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .filters {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }

        .btn {
            background-color: var(--primary);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .quick-tag {
            background: #334155;
            color: #cbd5e1;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
        }

        .quick-tag:hover {
            background: var(--primary);
            color: #0f172a;
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .result-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary);
        }

        .card-badge {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent);
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .synonyms-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }

        .word-chip {
            background: #0f172a;
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .char-count {
            font-size: 0.7rem;
            color: var(--text-muted);
            background: #1e293b;
            padding: 1px 4px;
            border-radius: 3px;
        }

        .notes {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
            line-height: 1.4;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>دانشیار • راهنمای حل جدول</h1>
        <p>جستجوی هوشمند کلمات، مترادف‌ها، کشورها، پایتخت‌ها و اطلاعات عمومی</p>
    </header>

    <div class="search-box">
        <div class="input-row">
            <input type="text" id="searchInput" placeholder="مثال: مو، شوخ، کمک، جزیره، آسیا...">
            <button class="btn" onclick="doSearch()">جستجو</button>
        </div>

        <div class="filters">
            <select id="charFilter" onchange="doSearch()">
                <option value="0">همه طول کلمات</option>
                <option value="2">۲ حرفی</option>
                <option value="3">۳ حرفی</option>
                <option value="4">۴ حرفی</option>
                <option value="5">۵ حرفی</option>
                <option value="6">۶ حرفی</option>
                <option value="7">۷ حرف و بیشتر</option>
            </select>

            <select id="categoryFilter" onchange="doSearch()">
                <option value="all">همه دسته‌ها</option>
                <option value="لغت و مترادف">لغت و مترادف</option>
                <option value="جغرافیا">جغرافیا و کشورها</option>
                <option value="تاریخ و ادبیات">تاریخ و ادبیات</option>
            </select>
        </div>

        <div class="tags-container">
            <span class="quick-tag" onclick="setQuery('مو')">مو</span>
            <span class="quick-tag" onclick="setQuery('شوخ')">شوخ</span>
            <span class="quick-tag" onclick="setQuery('کمک')">کمک</span>
            <span class="quick-tag" onclick="setQuery('کشور آسیایی')">کشورهای آسیا</span>
            <span class="quick-tag" onclick="setQuery('جزیره')">جزیره‌ها</span>
            <span class="quick-tag" onclick="setQuery('ایتالیا')">جزایر ایتالیا</span>
        </div>
    </div>

    <div id="results" class="results">
        <div class="empty-state">کلمه‌ای را جستجو کنید یا یکی از گزینه‌های سریع بالا را انتخاب نمایید.</div>
    </div>
</div>

<script>

            { word: "جعد", note: "موی پیچیده" },
            { word: "کاborder", note: "موی بافته" },
            { word: "شعر", note: "مو در عربی" }
        ]
    },
    {

        title: "شوخ و شوخ‌طبع",
        category: "لغت و مترادف",
        desc: "معانی طنز و مزاح، و در ادبیات کهن به معنای چرک و جسور",
        answers: [
            { word: "شنگول", note: "شاد و شوخ" },
            { word: "طناز", note: "بسیار طنزپرداز" },

            { word: "ظریف", note: "نکته‌سنج و اهل طنز" },

    </div>
</div>

<script>
// دیتابیس هوشمند داخلی (آفلاین، سبک، سریع و سازگار با جدول)
const database = [
    {
        queryKeys: ["مو", "موی", "زلف"],
        title: "مو (در معانی مختلف)",
        category: "لغت و مترادف",
        desc: "معانی شامل: موی انسان، درخت انگور، باریک",
        answers: [
            { word: "رز", note: "درخت انگور" },
            { word: "تاک", note: "درخت انگور" },
            { word: "زلف", note: "موی سر" },
            { word: "طره", note: "موی پیشانی" },
            { word: "گیسو", note: "موی بلند" },
            { word: "کمند", note: "موی بافته و زیبا" },
            { word: "جعد", note: "موی پیچیده" },
            { word: "کاborder", note: "موی بافته" },
            { word: "شعر", note: "مو در عربی" }
        ]
    },
    {
        queryKeys: ["شوخ", "شوخی", "بذله"],
        title: "شوخ و شوخ‌طبع",
        category: "لغت و مترادف",
        desc: "معانی طنز و مزاح، و در ادبیات کهن به معنای چرک و جسور",
        answers: [
            { word: "شنگول", note: "شاد و شوخ" },
            { word: "طناز", note: "بسیار طنزپرداز" },
            { word: "بذله گو", note: "شوخ طبع" },
            { word: "ظریف", note: "نکته‌سنج و اهل طنز" },
            { word: "لوده", note: "بسیار شوخ و سبک‌سر" },
            { word: "مزاح", note: "شوخی‌کننده" },
            { word: "هزال", note: "شوخ و طنزنویس" },
            { word: "چرک", note: "معنای کهن شوخ" }
        ]
    },
    {
        queryKeys: ["کمک", "یاری", "مدد"],
        title: "کمک و یاری",
        category: "لغت و مترادف",
        ایتخت: مانیل" },
            { word: "مالزی", note: "پایتخت: کوالالامپور" },
            { word: "اندونزی", note: "پایتخت: جاکارتا" }
        ]
    },
    {
        queryKeys: ["جزیره", "جزایر", "ایتالیا", "جزیره های ایتالیا"],
        title: "جزایر معروف جهان و ایتالیا",
        category: "جغرافیا",
        desc: "جزایر مهم به‌ویژه موارد پرکاربرد در حل جدول",
        answers: [
            { word: "قشم", note: "بزرگترین جزیره خلیج فارس" },
            { word: "کیش", note: "خلیج فارس" },
            { word: "کاپری", note: "جزیره در ایتالیا" },
            { word: "سیسیل", note: "بزرگترین جزیره ایتالیا" },
            { word: "ساردنی", note: "جزیره ایتالیا در مدیترانه" },
            { word: "البا", note: "جزیره تبعید ناپلئون (ایتالیا)" },
            { word: "کرت", note: "جزیره متعلق به یونان" },
            { word: "قبرس", note: "کشور جزیره‌ای مدیترانه" }
        ]
    }
];

function setQuery(text) {
    document.getElementById('searchInput').value = text;
    doSearch();
}

function doSearch() {
    const rawInput = document.getElementById('searchInput').value.trim();
    const charFilter = parseInt(document.getElementById('charFilter').value);
    const categoryFilter = document.getElementById('categoryFilter').value;
    const resultsContainer = document.getElementById('results');

    if (!rawInput && categoryFilter === 'all' && charFilter === 0) {
        resultsContainer.innerHTML = '<div class="empty-state">عبارتی را جستجو کنید.</div>';
        return;
    }

    // پاکسازی حروف اضافه
    const query = rawInput.replace(/[\u200B-\u200D\uFEFF]/g, '').toLowerCase();

    let matched = [];

    database.forEach(item => {
        // بررسی دسته بندی
        if (categoryFilter !== 'all' && item.category !== categoryFilter) {
            return;
        }

        // تطابق کلیدواژه یا محتوا
        const keyMatch = item.queryKeys.some(k => query.includes(k) || k.includes(query));
        const titleMatch = item.title.includes(query);

        // تطابق داخل خود کلمات
        const internalWordMatch = item.answers.some(ans => ans.word.includes(query));

        if (keyMatch || titleMatch || internalWordMatch || !query) {
            // فیلتر کردن طول حروف
            let filteredAnswers = item.answers;
            if (charFilter > 0) {
                if (charFilter === 7) {
                    filteredAnswers = filteredAnswers.filter(a => a.word.replace(/\s+/g, '').length >= 7);
                } else {
                    filteredAnswers = filteredAnswers.filter(a => a.word.replace(/\s+/g, '').length === charFilter);
                }
            }

            if (filteredAnswers.length > 0) {
                matched.push({
                    ...item,
                    filteredAnswers
                });
            }
        }
    });

    renderResults(matched);
}

function renderResults(list) {
    const container = document.getElementById('results');
    container.innerHTML = '';

    if (list.length === 0) {
        container.innerHTML = '<div class="empty-state">نتیجه‌ای با مشخصات انتخاب‌شده یافت نشد. می‌توانید با کلمات دیگر امتحان کنید.</div>';
        return;
    }

    list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'result-card';

        let chipsHtml = item.filteredAnswers.map(ans => {
            const len = ans.word.replace(/\s+/g, '').length;
            return `
                <div class="word-chip" title="${ans.note || ''}">
                    <span>${ans.word}</span>
                    <span class="char-count">${len} حرف</span>
                </div>
            `;
        }).join('');

        card.innerHTML = `
            <div class="card-header">
                <span class="card-title">${item.title}</span>
                <span class="card-badge">${item.category}</span>
            </div>
            <div class="notes">${item.desc}</div>
            <div class="synonyms-list">
                ${chipsHtml}
            </div>
        `;
        container.appendChild(card);
    });
}

// گوش دادن به اینتر در فیلد جستجو
document.getElementById('searchInput').addEventListener('keyup', function(e) {
    if (e.key === 'Enter') {
        doSearch();
    }
});
</script>

</body>
