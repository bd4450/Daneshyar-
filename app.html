<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دانشیار جامع • دستیار هوشمند حل جدول و مترادف</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, 'Segoe UI', sans-serif; }
  body { background: #f0f4f8; padding: 12px; color: #1e293b; }
  .container { max-width: 600px; margin: auto; background: #ffffff; padding: 18px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  
  h1 { color: #1e3a8a; text-align: center; font-size: 1.35rem; margin-bottom: 4px; }
  p.sub { color: #64748b; text-align: center; font-size: 0.8rem; margin-bottom: 14px; }
  
  .search-box { display: flex; gap: 8px; margin-bottom: 12px; }
  input { flex: 1; padding: 12px; border: 1.8px solid #cbd5e1; border-radius: 10px; font-size: 1rem; outline: none; transition: 0.2s; }
  input:focus { border-color: #2563eb; }
  .btn-search { background: #2563eb; color: white; border: none; border-radius: 10px; padding: 0 18px; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
  .btn-search:active { background: #1d4ed8; }

  /* انتخاب نوع نمایش */
  .tab-bar { display: flex; gap: 8px; margin-bottom: 12px; background: #f1f5f9; padding: 4px; border-radius: 10px; }
  .tab-btn { flex: 1; border: none; background: transparent; padding: 8px; border-radius: 8px; font-size: 0.82rem; font-weight: bold; color: #64748b; cursor: pointer; }
  .tab-btn.active { background: #ffffff; color: #1e3a8a; box-shadow: 0 2px 5px rgba(0,0,0,0.06); }

  /* فیلتر تعداد حروف */
  .filter-row { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
  .chip { background: #f8fafc; border: 1px solid #cbd5e1; padding: 5px 11px; border-radius: 14px; font-size: 0.78rem; cursor: pointer; white-space: nowrap; color: #334155; }
  .chip.active { background: #1e3a8a; color: white; border-color: #1e3a8a; font-weight: bold; }

  /* نمایش کلمات خالص بر اساس تعداد حروف */
  .char-group { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .char-head { font-size: 0.82rem; font-weight: bold; color: #1e3a8a; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .tags-list { display: flex; flex-wrap: wrap; gap: 7px; }
  .tag { background: #eff6ff; color: #1e40af; border: 1.5px solid #93c5fd; padding: 6px 14px; border-radius: 8px; font-size: 0.95rem; font-weight: bold; }

  /* جعبه پاسخ‌های کوتاه اطلاعات عمومی */
  .wiki-box { background: #f8fafc; border-right: 4px solid #0284c7; padding: 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #e2e8f0; }
  .wiki-title { font-weight: bold; color: #0284c7; font-size: 0.9rem; margin-bottom: 4px; }
  .wiki-snippet { font-size: 0.85rem; color: #334155; line-height: 1.5; }

  .empty { text-align: center; color: #94a3b8; padding: 25px 0; font-size: 0.85rem; }
  .direct-google { display: block; text-align: center; background: #ea4335; color: white; text-decoration: none; padding: 10px; border-radius: 10px; font-size: 0.82rem; font-weight: bold; margin-top: 14px; }
</style>
</head>
<body>

<div class="container">
  <h1>دانشیار • دستیار حل جدول</h1>
  <p class="sub">استخراج کلمات مترادف و پاسخ‌های کوتاه بر اساس تعداد حروف</p>

  <div class="search-box">
    <input type="text" id="term" placeholder="مثال: درخت انگور، باهوش، پایتخت، کنایه..." autofocus>
    <button class="btn-search" onclick="runSearch()">جستجو</button>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" id="tabSyn" onclick="switchTab('syn')">مترادف‌ها و جواب جدول (کلمه خالص)</button>
    <button class="tab-btn" id="tabInfo" onclick="switchTab('info')">پاسخ‌های دانشنامه‌ای / ویکی</button>
  </div>

  <div class="filter-row" id="filterBar">
    <button class="chip active" onclick="setFilter(0, this)">همه</button>
    <button class="chip" onclick="setFilter(2, this)">۲ حرفی</button>
    <button class="chip" onclick="setFilter(3, this)">۳ حرفی</button>
    <button class="chip" onclick="setFilter(4, this)">۴ حرفی</button>
    <button class="chip" onclick="setFilter(5, this)">۵ حرفی</button>
    <button class="chip" onclick="setFilter(6, this)">۶ حرفی</button>
    <button class="chip" onclick="setFilter(7, this)">۷+ حرفی</button>
  </div>

  <div id="output">
    <div class="empty">کلمه یا پرسش جدول را وارد کنید.</div>
  </div>

  <a id="gBtn" href="#" target="_blank" class="direct-google" style="display: none;">
    🔍 جستجوی کامل این سوال در پایگاه‌های آنلاین جدول
  </a>
</div>

<script>
let currentTab = 'syn';
let charFilter = 0;
let cleanSynonyms = [];
let infoAnswers = [];

// بانک جامع لغات، اصطلاحات و کلیدهای پرکاربرد حل جدول
const TABLE_DICTIONARY = [
  { keys: ["درخت انگور", "انگور"], words: ["مو", "رز", "تاک", "عنب"] },
  { keys: ["شراب", "می"], words: ["مل", "باده", "صهبا", "خمر", "نبیذ", "راح"] },
  { keys: ["باهوش", "زیرک"], words: ["دانا", "فطین", "ذکی", "هشیار", "نبیل"] },
  { keys: ["نادان", "کم عقل", "احمق"], words: ["کودن", "ابله", "جاهل", "سفیه", "پخمه"] },
  { keys: ["خورشید", "افتاب"], words: ["شمس", "خور", "هور", "مهر", "بیضاء"] },
  { keys: ["ماه"], words: ["قمر", "بدر", "مه", "هلال"] },
  { keys: ["اسمان", "فلک"], words: ["سما", "گردون", "سپهر", "چرخ", "مینا"] },
  { keys: ["دوست", "یار"], words: ["رفیق", "ندیم", "حبیب", "شفیق", "همدم", "مونس"] },
  { keys: ["دشمن"], words: ["عدو", "خصم", "مخالف", "بدخواه", "ضد"] },
  { keys: ["اسب"], words: ["فرس", "باره", "سمند", "رخش", "توسن", "اسپ"] },
  { keys: ["پرنده", "مرغ"], words: ["طایر", "طیر", "پرور"] },
  { keys: ["اشکار", "معلوم"], words: ["پدید", "هویدا", "بارز", "عیان", "روشن", "واضح", "پیدا"] },
  { keys: ["پنهان", "مخفی"], words: ["نهان", "خفی", "مستور", "راز", "پوشیده"] },
  { keys: ["واحد پول ژاپن"], words: ["ین"] },
  { keys: ["واحد پول انگلیس"], words: ["پوند"] },
  { keys: ["واحد پول امریکا"], words: ["دلار"] },
  { keys: ["پایتخت فرانسه"], words: ["پاریس"] },
  { keys: ["پایتخت ایتالیا"], words: ["رم"] },
  { keys: ["پایتخت ژاپن"], words: ["توکیو"] },
  { keys: ["پایتخت المان"], words: ["برلین"] },
  { keys: ["پایتخت روسیه"], words: ["مسکو"] },
  { keys: ["پایتخت اسپانیا"], words: ["مادرید"] },
  { keys: ["فلز مایع", "عنصر جیوه"], words: ["جیوه", "سیماب"] },
  { keys: ["پدر"], words: ["اب", "والد", "بابا", "پت"] },
  { keys: ["مادر"], words: ["ام", "والده", "مام"] },
  { keys: ["فرزند", "پسر"], words: ["ابن", "ولد", "پور"] },
  { keys: ["دختر"], words: ["بنت", "دوشیزه"] },
  { keys: ["خداوند", "ایزد"], words: ["رب", "الله", "یزدان", "حق", "دادار"] },
  { keys: ["زیبا", "خوشگل"], words: ["جمیل", "وسیم", "نکو", "خوب", "مهرو", "پریچهره"] },
  { keys: ["زشت"], words: ["قبیح", "بدروی", "دژم", "کژ"] }
];

document.getElementById('term').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') runSearch();
});

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabSyn').classList.toggle('active', tab === 'syn');
  document.getElementById('tabInfo').classList.toggle('active', tab === 'info');
  document.getElementById('filterBar').style.display = (tab === 'syn') ? 'flex' : 'none';
  renderView();
}

function setFilter(chars, el) {
  charFilter = chars;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderView();
}

function normalizePersian(str) {
  return str.trim()
            .replace(/[؟?،,؛;:\-()\[\]]/g, '')
            .replace(/ي/g, 'ی')
            .replace(/ك/g, 'ک')
            .replace(/[\u200B-\u200D\uFEFF]/g, ' ')
            .trim();
}

async function runSearch() {
  const raw = document.getElementById('term').value;
  const q = normalizePersian(raw);
  const out = document.getElementById('output');
  const gBtn = document.getElementById('gBtn');

  if (!q) return;

  gBtn.style.display = 'block';
  gBtn.href = `https://www.google.com/search?q=${encodeURIComponent(q + " در جدول حل جدول کلمات")}`;

  out.innerHTML = '<div class="empty">در حال استخراج کلمات خالص و پاسخ‌های جدول...</div>';
  cleanSynonyms = [];
  infoAnswers = [];

  // ۱. بررسی تطبیق دقیق و مفهومی در دیتابیس اختصاصی جدول
  TABLE_DICTIONARY.forEach(item => {
    const match = item.keys.some(k => q.includes(k) || k.includes(q));
    if (match) {
      cleanSynonyms.push(...item.words);
    }
  });

  // ۲. جستجو در وب‌سرویس ویکی‌واژه و ویکی‌پدیا به منظور استخراج لغات ناب و پاسخ‌های دانشنامه
  try {
    const wiktUrl = `https://fa.wiktionary.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&utf8=&format=json&origin=*`;
    const wikiUrl = `https://fa.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&utf8=&format=json&origin=*`;

    const [wiktRes, wikiRes] = await Promise.allSettled([
      fetch(wiktUrl).then(r => r.json()),
      fetch(wikiUrl).then(r => r.json())
    ]);

    // پردازش واژه‌نامه برای استخراج کلمات خالص بدون توضیحات
    if (wiktRes.status === 'fulfilled' && wiktRes.value.query?.search) {
      wiktRes.value.query.search.forEach(entry => {
        let clean = entry.snippet.replace(/<[^>]*>/g, ' ').replace(/[،,؛;:.\-()«»"'/\\?!؟]/g, ' ');
        let tokens = clean.split(/\s+/).map(w => w.trim()).filter(w => {
          return w.length >= 2 && 
                 w.length <= 8 && 
                 /^[\u0600-\u06FF]+$/.test(w) && 
                 !['برای', 'است', 'شدن', 'کردن', 'یعنی', 'معنی', 'همچنین', 'دارد', 'بودن', 'کلمه', 'یک', 'این', 'آن', 'ویژه'].includes(w);
        });
        cleanSynonyms.push(...tokens);
      });
    }

    // پردازش دانشنامه برای پاسخ‌های کوتاه و مستقیم
    if (wikiRes.status === 'fulfilled' && wikiRes.value.query?.search) {
      wikiRes.value.query.search.slice(0, 4).forEach(entry => {
        infoAnswers.push({
          title: entry.title,
          snippet: entry.snippet.replace(/<[^>]*>/g, '').trim()
        });
      });
    }
  } catch (err) {
    // در صورت قطعی اینترنت نتایج دیتابیس داخلی نمایش داده می‌شود
  }

  // پالایش کلمات: حذف تکراری‌ها و خود کلمه جستجو شده
  cleanSynonyms = [...new Set(cleanSynonyms.filter(w => w !== q))];

  renderView();
}

function renderView() {
  const out = document.getElementById('output');

  if (currentTab === 'syn') {
    // نمایش مترادف‌ها
    let list = cleanSynonyms;
    if (charFilter > 0) {
      if (charFilter >= 7) {
        list = list.filter(w => w.length >= 7);
      } else {
        list = list.filter(w => w.length === charFilter);
      }
    }

    if (list.length === 0) {
      out.innerHTML = '<div class="empty">مترادفی با این مشخصات یافت نشد. می‌توانید از کلید قرمز پایین در جدول‌های گوگل جستجو کنید.</div>';
      return;
    }

    // دسته‌بندی بر اساس تعداد حروف
    const groups = {};
    list.forEach(w => {
      const len = w.length;
      if (!groups[len]) groups[len] = [];
      groups[len].push(w);
    });

    let html = '';
    const sortedLens = Object.keys(groups).sort((a,b) => a - b);
    sortedLens.forEach(len => {
      html += `
        <div class="char-group">
          <div class="char-head">
            <span>کلمات ${len} حرفی:</span>
            <span>${groups[len].length} پاسخ</span>
          </div>
          <div class="tags-list">
            ${groups[len].map(word => `<span class="tag">${word}</span>`).join('')}
          </div>
        </div>
      `;
    });
    out.innerHTML = html;

  } else {
    // نمایش تب اطلاعات عمومی دانشنامه‌ای
    if (infoAnswers.length === 0) {
      out.innerHTML = '<div class="empty">اطلاعات دانشنامه‌ای یافت نشد.</div>';
      return;
    }
    let html = '';
    infoAnswers.forEach(item => {
      html += `
        <div class="wiki-box">
          <div class="wiki-title">${item.title}</div>
          <div class="wiki-snippet">${item.snippet}...</div>
        </div>
      `;
    });
    out.innerHTML = html;
  }
}
</script>
</body>
</html>
