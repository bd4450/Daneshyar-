<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دانشیار • لغت‌نامه، مترادف‌ها و حل جدول</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, 'Vazir', sans-serif; }
  body { background: #f1f5f9; padding: 12px; color: #1e293b; }
  .container { max-width: 650px; margin: auto; background: #ffffff; padding: 18px; border-radius: 14px; box-shadow: 0 4px 18px rgba(0,0,0,0.06); }
  h1 { color: #1e3a8a; text-align: center; font-size: 1.35rem; margin-bottom: 4px; }
  p.sub { color: #64748b; text-align: center; font-size: 0.8rem; margin-bottom: 14px; }
  
  .search-box { display: flex; gap: 8px; margin-bottom: 12px; }
  input { flex: 1; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 1rem; outline: none; }
  input:focus { border-color: #1e3a8a; }
  .btn { background: #1e3a8a; color: white; border: none; border-radius: 10px; padding: 0 18px; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
  
  .quick-links { display: flex; gap: 8px; margin-bottom: 14px; }
  .btn-ext { flex: 1; text-align: center; padding: 9px; border-radius: 8px; text-decoration: none; font-size: 0.8rem; font-weight: bold; color: white; display: inline-block; }
  .btn-google { background: #ea4335; }
  .btn-vajeh { background: #0284c7; }

  .filter-row { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 14px; }
  .filter-label { font-size: 0.78rem; color: #64748b; white-space: nowrap; }
  .chip { background: #e2e8f0; border: none; padding: 5px 10px; border-radius: 14px; font-size: 0.78rem; cursor: pointer; white-space: nowrap; }
  .chip.active { background: #1e3a8a; color: white; }

  .section-title { font-size: 0.95rem; font-weight: bold; color: #0f172a; margin: 16px 0 8px; display: flex; align-items: center; gap: 6px; }
  
  /* کلمات مترادف بدون هیچ توضیح اضافی */
  .words-cloud { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .word-pill { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; padding: 6px 12px; border-radius: 20px; font-size: 0.9rem; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; }
  .word-len { background: #dbeafe; color: #1d4ed8; font-size: 0.72rem; padding: 2px 6px; border-radius: 10px; }

  /* کارت اطلاعات عمومی و ویکی‌ها */
  .res-card { background: #f8fafc; border: 1px solid #e2e8f0; border-right: 4px solid #1e3a8a; padding: 12px; border-radius: 10px; margin-bottom: 10px; }
  .res-card.wiki { border-right-color: #0284c7; }
  .res-title { font-weight: bold; color: #1e3a8a; font-size: 0.95rem; margin-bottom: 4px; }
  .res-body { font-size: 0.85rem; line-height: 1.55; color: #334155; }
  .badge { display: inline-block; background: #e2e8f0; color: #475569; padding: 2px 7px; border-radius: 5px; font-size: 0.72rem; margin-top: 6px; }

  .empty { text-align: center; color: #94a3b8; padding: 24px 0; font-size: 0.88rem; }
  .loading { text-align: center; color: #1e3a8a; padding: 20px 0; font-size: 0.9rem; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
  <h1>دانشیار • مترادف‌ها و حل جدول</h1>
  <p class="sub">استخراج کلمات هم‌معنی بدون توضیح اضافی + اطلاعات عمومی دانشنامه‌ها</p>

  <div class="search-box">
    <input type="text" id="term" placeholder="لغت، کنایه، ضرب‌المثل یا سوال جدول..." autofocus>
    <button class="btn" onclick="executeSearch()">جستجو</button>
  </div>

  <div class="quick-links" id="quickLinks" style="display: none;">
    <a id="btnGoogle" href="#" target="_blank" class="btn-ext btn-google">🔍 جستجوی مستقیم در گوگل</a>
    <a id="btnVajehyab" href="#" target="_blank" class="btn-ext btn-vajeh">📖 جستجو در واژه‌یاب</a>
  </div>

  <div class="filter-row">
    <span class="filter-label">فیلتر تعداد حروف مترادف‌ها:</span>
    <button class="chip active" onclick="setCharLimit(0, this)">همه</button>
    <button class="chip" onclick="setCharLimit(2, this)">۲ حرف</button>
    <button class="chip" onclick="setCharLimit(3, this)">۳ حرف</button>
    <button class="chip" onclick="setCharLimit(4, this)">۴ حرف</button>
    <button class="chip" onclick="setCharLimit(5, this)">۵ حرف</button>
    <button class="chip" onclick="setCharLimit(6, this)">۶ حرف</button>
    <button class="chip" onclick="setCharLimit(7, this)">۷+ حرف</button>
  </div>

  <div id="output">
    <div class="empty">کلمه یا عبارت مورد نظر خود را برای حل جدول وارد کنید.</div>
  </div>
</div>

<script>
let selectedCharLimit = 0;
let extractedSynonyms = [];
let encyclopediaResults = [];

document.getElementById('term').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') executeSearch();
});

function setCharLimit(num, el) {
  selectedCharLimit = num;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderResults();
}

// پاک‌سازی کلمات و استخراج کلمات خالص جدول
function parseRawWords(text, query) {
  if (!text) return [];
  // حذف تگ‌های HTML
  let clean = text.replace(/<[^>]*>/g, ' ');
  // حذف کاراکترهای نشانه‌گذاری و ارقام و نویسه‌های غیرفارسی
  clean = clean.replace(/[\n\r\t]/g, ' ')
               .replace(/[،,؛;:.\-()\[\]{}«»"'/\\?!؟]/g, ' ');
  
  let tokens = clean.split(/\s+/)
    .map(w => w.trim())
    .filter(w => w.length >= 2)
    .filter(w => /^[\u0600-\u06FF]+$/.test(w)) // فقط کلمات فارسی
    .filter(w => w !== query && !['برای', 'است', 'شدن', 'کردن', 'یعنی', 'معنی', 'همچنین', 'دارد', 'بودن', 'مترادف', 'مترادف‌ها', 'کلمه', 'واژه'].includes(w));

  return [...new Set(tokens)];
}

async function executeSearch() {
  const query = document.getElementById('term').value.trim();
  const out = document.getElementById('output');
  const links = document.getElementById('quickLinks');

  if (!query) return;

  links.style.display = 'flex';
  document.getElementById('btnGoogle').href = `https://www.google.com/search?q=${encodeURIComponent(query + ' حل جدول و مترادف')}`;
  document.getElementById('btnVajehyab').href = `https://vajehyab.com/?q=${encodeURIComponent(query)}`;

  out.innerHTML = '<div class="loading">⏳ در حال جستجوی واژه‌نامه‌ها و منابع دانشنامه‌ای...</div>';
  extractedSynonyms = [];
  encyclopediaResults = [];

  try {
    // ۱. استخراج از ویکی‌واژه (Wiktionary فارسی) برای مترادف‌های خالص
    const wiktionaryUrl = `https://fa.wiktionary.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&utf8=&format=json&origin=*`;
    
    // ۲. استخراج از دانشنامه عمومی فارسی (ویکی‌پدیا)
    const wikiUrl = `https://fa.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&utf8=&format=json&origin=*`;

    const [wiktRes, wikiRes] = await Promise.allSettled([
      fetch(wiktionaryUrl).then(r => r.json()),
      fetch(wikiUrl).then(r => r.json())
    ]);

    let gatheredWords = [];

    // استخراج کلمات هم‌معنی از واژه‌نامه
    if (wiktRes.status === 'fulfilled' && wiktRes.value.query?.search) {
      wiktRes.value.query.search.forEach(item => {
        const words = parseRawWords(item.snippet, query);
        gatheredWords.push(...words);
      });
    }

    // استخراج توضیحات دانشنامه‌ای + کلمات کلیدی از ویکی‌پدیا
    if (wikiRes.status === 'fulfilled' && wikiRes.value.query?.search) {
      wikiRes.value.query.search.forEach(item => {
        const cleanSnippet = item.snippet.replace(/<[^>]*>/g, '').trim();
        encyclopediaResults.push({
          title: item.title,
          snippet: cleanSnippet,
          source: 'ویکی‌پدیا / دانشنامه عمومی'
        });
        const words = parseRawWords(item.snippet, query);
        gatheredWords.push(...words);
      });
    }

    // حذف موارد تکراری مترادف‌ها
    extractedSynonyms = [...new Set(gatheredWords)];

    renderResults();

  } catch (error) {
    out.innerHTML = `
      <div class="empty">
        خطا در واکشی آنلاین. اتصال اینترنت را چک کنید یا مستقیماً از دکمه قرمز گوگل در بالا استفاده کنید.
      </div>
    `;
  }
}

function renderResults() {
  const out = document.getElementById('output');
  let html = '';

  // ۱. فیلتر مترادف‌ها براساس تعداد حروف انتخابی
  let filteredWords = extractedSynonyms;
  if (selectedCharLimit > 0) {
    if (selectedCharLimit >= 7) {
      filteredWords = filteredWords.filter(w => w.length >= 7);
    } else {
      filteredWords = filteredWords.filter(w => w.length === selectedCharLimit);
    }
  }

  // نمایش بخش مترادف‌ها بدون هیچ توضیح اضافه
  html += `<div class="section-title">✨ کلمات مترادف و هم‌پوشان (بدون توضیح):</div>`;
  if (filteredWords.length > 0) {
    html += `<div class="words-cloud">`;
    filteredWords.forEach(word => {
      html += `
        <span class="word-pill">
          ${word}
          <span class="word-len">${word.length} حرفی</span>
        </span>
      `;
    });
    html += `</div>`;
  } else {
    html += `<div class="empty" style="padding:10px 0;">کلمه‌ای با این تعداد حروف در متن واژه‌نامه‌ها یافت نشد.</div>`;
  }

  // ۲. نمایش جواب‌ها و توضیحات دانشنامه‌ای (ویکی‌پدیا و منابع دیگر)
  if (encyclopediaResults.length > 0) {
    html += `<div class="section-title">📚 پاسخ‌های دانشنامه‌ای و ویکی:</div>`;
    encyclopediaResults.slice(0, 5).forEach(item => {
      html += `
        <div class="res-card wiki">
          <div class="res-title">${item.title}</div>
          <div class="res-body">${item.snippet}...</div>
          <span class="badge">${item.source}</span>
        </div>
      `;
    });
  }

  out.innerHTML = html;
}
</script>
</body>
</html>
