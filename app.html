<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دانشیار • لغت، جدول و دانشنامه</title>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-dark: #1557b0;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #202124;
      --text-muted: #5f6368;
      --border: #dadce0;
      --badge-bg: #e8f0fe;
      --badge-text: #1967d2;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, sans-serif;
    }

    body {
      margin: 0;
      padding: 12px;
      background-color: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    h1 {
      margin: 4px 0;
      font-size: 1.4rem;
      color: var(--primary);
    }

    .mode-switch {
      display: flex;
      background: #e9ecef;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 12px;
      gap: 4px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .search-box {
      display: flex;
      gap: 6px;
      margin-bottom: 15px;
    }

    input[type="search"] {
      flex: 1;
      padding: 12px 14px;
      font-size: 1rem;
      border: 2px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: #fff;
    }

    input[type="search"]:focus {
      border-color: var(--primary);
    }

    button.submit-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    button.submit-btn:hover {
      background: var(--primary-dark);
    }

    /* بخش پاسخ‌های جدولی (فقط کلمه و تعداد حروف) */
    .answer-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .answer-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-right: 5px solid var(--primary);
      padding: 12px 16px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .answer-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: #111;
    }

    .answer-count {
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.85rem;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* بخش دانشنامه */
    .wiki-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      line-height: 1.8;
      font-size: 1rem;
    }

    .wiki-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    .loading, .empty {
      text-align: center;
      padding: 25px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>دانشیار</h1>
  </header>

  <!-- کلید انتخاب حالت -->
  <div class="mode-switch">
    <button type="button" class="mode-btn active" id="btn-words" onclick="setMode('words')">
      معانی و کلمات جدول (بدون توضیح)
    </button>
    <button type="button" class="mode-btn" id="btn-wiki" onclick="setMode('wiki')">
      دانشنامه و اطلاعات
    </button>
  </div>

  <!-- فرم جستجو -->
  <div class="search-box">
    <input type="search" id="searchInput" placeholder="عبارت یا سوال را بنویسید..." autocomplete="off">
    <button class="submit-btn" onclick="executeSearch()">جستجو</button>
  </div>

  <!-- محل نمایش نتایج -->
  <div id="resultsArea">
    <div class="empty">عبارتی را برای جستجو وارد کنید.</div>
  </div>
</div>

<script>
  let currentMode = 'words'; // 'words' یا 'wiki'

  // دیتابیس کلمات و معانی پرکاربرد جدولی
  const LOCAL_WORDS_DB = {
    "درخت انگور": ["مو", "رز", "تاک"],
    "انگور": ["مو", "رز", "تاک"],
    "شراب": ["می", "باده", "خمر", "مل", "صهبا", "نبیذ"],
    "کمک": ["یاری", "مدد", "مساعدت", "نصرت", "اعانت"],
    "شوخ": ["بذله‌گو", "شنگول", "طناز", "خوش‌مشرب", "ظریف"],
    "پدر": ["اب", "والد", "بابا", "پت"],
    "مادر": ["ام", "والده", "مام"],
    "آب": ["ما", "مایه حیات"],
    "آتش": ["نار", "آذر", "آتشک", "شرار"],
    "خورشید": ["مهر", "شمس", "خور", "آفتاب", "هور"],
    "ماه": ["قمر", "بدر", "مه"],
    "درخت": ["شجر", "دار"],
    "پادشاه": ["ملک", "شاه", "سلطان", "کیا", "خسرو"],
    "مار بزرگ": ["اژدها", "ارقم"],
    "جزایر ژاپن": ["هونشو", "هوکایدو", "کیوشو", "شیکوکو", "اوکیناوا"]
  };

  function setMode(mode) {
    currentMode = mode;
    document.getElementById('btn-words').classList.toggle('active', mode === 'words');
    document.getElementById('btn-wiki').classList.toggle('active', mode === 'wiki');
    const input = document.getElementById('searchInput');
    if (input.value.trim()) {
      executeSearch();
    }
  }

  // اجرای جستجو هنگام Enter
  document.getElementById('searchInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      executeSearch();
    }
  });

  async function executeSearch() {
    const query = document.getElementById('searchInput').value.trim();
    const resultsArea = document.getElementById('resultsArea');

    if (!query) {
      resultsArea.innerHTML = '<div class="empty">لطفاً عبارتی بنویسید.</div>';
      return;
    }

    resultsArea.innerHTML = '<div class="loading">در حال جستجو...</div>';

    if (currentMode === 'words') {
      await searchWordsOnly(query, resultsArea);
    } else {
      await searchEncyclopedia(query, resultsArea);
    }
  }

  // ۱. منطق کلمات خالص جدول (فقط کلمه و تعداد حروف، بدون هیچ جمله و حاشیه)
  async function searchWordsOnly(query, container) {
    let answers = [];

    // بررسی بانک محلی
    for (const key in LOCAL_WORDS_DB) {
      if (key === query || key.includes(query) || query.includes(key)) {
        answers.push(...LOCAL_WORDS_DB[key]);
      }
    }

    // استخراج معادل‌ها و مترادف‌ها از ویکی‌واژه
    try {
      const url = `https://fa.wiktionary.org/w/api.php?action=parse&format=json&page=${encodeURIComponent(query)}&prop=wikitext&origin=*`;
      const res = await fetch(url);
      const data = await res.json();
      if (data && data.parse && data.parse.wikitext) {
        const text = data.parse.wikitext['*'];
        // استخراج کلمات از بخش‌های مترادف و معنی بدون جملات طولانی
        const matches = text.match(/\[\[([^\]|#]+)(?:\|[^\]]+)?\]\]/g);
        if (matches) {
          matches.forEach(m => {
            const cleaned = m.replace(/\[\[|\]\]/g, '').split('|')[0].trim();
            if (cleaned && cleaned !== query && !cleaned.includes('رده:') && !cleaned.includes('پرونده:')) {
              answers.push(cleaned);
            }
          });
        }
      }
    } catch (e) {
      // ادامه با نتایج موجود
    }

    // حذف تکراری‌ها و تمیزسازی
    answers = [...new Set(answers.map(w => w.trim()).filter(w => w.length > 0 && w !== query))];

    if (answers.length === 0) {
      container.innerHTML = `
        <div class="empty">
          پاسخی پیدا نشد.<br><br>
          <a href="https://www.google.com/search?q=${encodeURIComponent('معنی یا حل جدول ' + query)}" target="_blank" style="color:var(--primary);text-decoration:none;font-weight:bold;">
            🔍 جستجوی «${query}» در گوگل
          </a>
        </div>`;
      return;
    }

    // چیدن خروجی بدون هیچ کلمه اضافی
    let html = '<ul class="answer-list">';
    answers.forEach(word => {
      const cleanLen = word.replace(/[\s‌]/g, '').length; // طول بدون فاصله
      html += `
        <li class="answer-item">
          <span class="answer-text">${word}</span>
          <span class="answer-count">${cleanLen} حرفی</span>
        </li>
      `;
    });
    html += '</ul>';

    container.innerHTML = html;
  }

  // ۲. منطق دانشنامه[\[([^\]|#]+)(?:\|[^\]]+)?\]\]/g);

          matches.forEach(m => {
            const cleaned = m.replace(/\[\[|\]\]/g, '').split('|')[0].trim();
            if (cleaned && cleaned !== query && !cleaned.includes('رده:') && !cleaned.includes('پرونده:')) {
              answers.push(cleaned);
            }
          });
        }
      }
    } catch (e) {
      // ادامه با نتایج موجود
    }

    // حذف تکراری‌ها و تمیزسازی
    answers = [...new Set(answers.map(w => w.trim()).filter(w => w.length > 0 && w !== query))];

    if (answers.length === 0) {
      container.innerHTML = `
        <div class="empty">
          پاسخی پیدا نشد.<br><br>
          <a href="https://www.google.com/search?q=${encodeURIComponent('معنی یا حل جدول ' + query)}" target="_blank" style="color:var(--primary);text-decoration:none;font-weight:bold;">
            🔍 جستجوی «${query}» در گوگل
          </a>
        </div>`;
      return;
    }

    // چیدن خروجی بدون هیچ کلمه اضافی
    let html = '<ul class="answer-list">';
    answers.forEach(word => {
      const cleanLen = word.replace(/[\s‌]/g, '').length; // طول بدون فاصله
      html += `
        <li class="answer-item">
          <span class="answer-text">${word}</span>
          <span class="answer-count">${cleanLen} حرفی</span>
        </li>
      `;
    });
    html += '</ul>';

    container.innerHTML = html;
  }

  // ۲. منطق دانشنامه (فقط پاراگراف دقیق و مستقیم همان عبارت)

      const res = await fetch(url);

</html>
