<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دانشیار</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f9; padding: 15px; }
        .container { max-width: 600px; margin: auto; }
        .search-box { display: flex; gap: 5px; margin-bottom: 15px; }
        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; }
        button { padding: 12px 20px; background: #2c3e50; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
        #result { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); line-height: 1.8; }
    </style>
</head>
<body>
<div class="container">
    <div class="search-box">
        <input type="text" id="q" placeholder="جستجو...">
        <button onclick="searchAll()">جستجو</button>
    </div>
    <div id="result"></div>
</div>
<script>
    // بانک کلمات جدول
    const tableDatabase = [
        { word: "پایتخت آلمان", answer: "برلین" },
        { word: "واحد پول ژاپن", answer: "ین" },
        { word: "بزرگترین اقیانوس", answer: "آرام" }
    ];

    async function searchAll() {
        const q = document.getElementById('q').value.trim();
        const r = document.getElementById('result');
        if (!q) return;
        r.innerHTML = "در حال جستجو...";

        // ۱. جستجو در بانک داخلی (واژه‌نامه)
        const found = tableDatabase.find(item => item.word === q);
        if (found) {
            r.innerHTML = `<h3>${found.word}</h3><p>${found.answer}</p>`;
            return;
        }

        // ۲. اگر در بانک نبود، جستجو در ویکی‌پدیا
        const url = `https://fa.wikipedia.org/w/api.php?action=query&format=json&prop=extracts&exintro=true&explaintext=true&titles=${encodeURIComponent(q)}&origin=*`;
        try {
            const res = await fetch(url);
            const d = await res.json();
            const p = d.query.pages;
            const id = Object.keys(p)[0];
            if (id !== "-1" && p[id].extract) {
                r.innerHTML = `<h3>${p[id].title}</h3><p>${p[id].extract}</p>`;
            } else {
                r.innerHTML = "موردی یافت نشد.";
            }
        } catch {
            r.innerHTML = "خطا در اتصال به اینترنت.";
        }
    }
</script>
</body>
</html>
