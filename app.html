<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دانشیار • کلیدواژه‌های جدول و مترادف</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, 'Vazir', sans-serif; }
  body { background: #f8fafc; padding: 12px; color: #0f172a; }
  .container { max-width: 550px; margin: auto; background: #ffffff; padding: 18px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
  
  h1 { color: #1e3a8a; text-align: center; font-size: 1.3rem; margin-bottom: 4px; }
  p.sub { color: #64748b; text-align: center; font-size: 0.8rem; margin-bottom: 14px; }
  
  .search-box { display: flex; gap: 6px; margin-bottom: 12px; }
  input { flex: 1; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 1rem; outline: none; }
  input:focus { border-color: #2563eb; }
  .btn { background: #2563eb; color: white; border: none; border-radius: 10px; padding: 0 16px; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
  
  .filter-row { display: flex; align-items: center; gap: 5px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
  .chip { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 5px 10px; border-radius: 16px; font-size: 0.8rem; cursor: pointer; white-space: nowrap; }
  .chip.active { background: #1e3a8a; color: white; border-color: #1e3a8a; font-weight: bold; }

  .group-box { margin-bottom: 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 12px; }
  .group-title { font-size: 0.85rem; font-weight: bold; color: #1e3a8a; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  
  .words-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .word-tag { background: #ffffff; color: #0f172a; border: 1.5px solid #93c5fd; padding: 5px 12px; border-radius: 8px; font-size: 0.95rem; font-weight: bold; }
  
  .empty { text-align: center; color: #94a3b8; padding: 25px 0; font-size: 0.88rem; }
  .google-fallback { display: block; text-align: center; background: #ea4335; color: white; text-decoration: none; padding: 10px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; margin-top: 15px; }
</style>
</head>
<body>

<div class="container">
  <h1>دانشیار • کلید حل جدول</h1>
  <p class="sub">پاسخ‌های کوتاه و مترادف‌های خالص بر اساس تعداد حروف</p>

  <div class="search-box">
    <input type="text" id="term" placeholder="مثال: درخت انگور، پایتخت ژاپن، باهوش..." autofocus>
    <button class="btn" onclick="searchAnswers()">یافتن</button>
  </div>

  <div class="filter-row">
    <button class="chip active" onclick="setFilter(0, this)">همه حروف</button>
    <button class="chip" onclick="setFilter(2, this)">۲ حرفی</button>
    <button class="chip" onclick="setFilter(3, this)">۳ حرفی</button>
    <button class="chip" onclick="setFilter(4, this)">۴ حرفی</button>
    <button class="chip" onclick="setFilter(5, this)">۵ حرفی</button>
    <button class="chip" onclick="setFilter(6, this)">۶ حرفی</button>
  </div>

  <div id="output">
    <div class="empty">کلمه یا عبارت سوال جدول را بنویسید و دکمه یافتن را بزنید.</div>
  </div>

  <a id="gBtn" href="#" target="_blank" class="google-fallback" style="display:none;">
    🔍 جستجوی بقیه گزینه‌ها در جدول‌های گوگل
  </a>
</div>

<script>
let activeFilter = 0;
let currentAnswers = [];

// بانک سریع کلیدهای جدول و مترادفات پرتکرار
const TABLE_DB = {
  "درخت انگور": ["مو", "رز", "تاک"],
  "انگور": ["مو", "رز", "تاک", "عنب"],
  "پایتخت فرانسه": ["پاریس"],
  "پایتخت ژاپن": ["توکیو"],
  "پایتخت ایتالیا": ["رم"],
  "پایتخت آلمان": ["برلین"],
  "پایتخت اسپانیا": ["مادرید"],
  "خورشید": ["شمس", "خور", "هور", "مهر", "افتاب"],
  "ماه": ["قمر", "بدر", "مه"],
  "اسمان": ["سما", "فلک", "گردون", "سپهر", "چرخ"],
  "شراب": ["می", "مل", "باده", "صهبا", "خمر"],
  "باهوش": ["زیرک", "دانا", "فطین", "هشیار", "ذکی"],
  "نادان": ["کودن", "احمق", "ابله", "جاهل", "سفیه"],
  "اشکار": ["پدید", "هویدا", "بارز", "عیان", "روشن"],
  "پنهان": ["مخفی", "نهان", "گم", "مستور", "خفی"],
  "دوست": ["یار", "رفیق", "ندیم", "حبیب", "شفیق", "همدم"],
  "دشمن": ["عدو", "خصم", "مخالف", "بدخواه"],
  "اسب": ["فرس", "باره", "سمند", "رخش", "توسن"],
  "پرنده": ["طایر", "طیر", "مرغ"],
  "پدر": ["اب", "والد", "بابا", "پت"],
  "مادر": ["ام", "والده", "مام"],
  "خانه": ["بیت", "دار", "سرا", "منزل", "مسکن"]
};

document.getElementById('term').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') searchAnswers();
});

function setFilter(chars, btn) {
  activeFilter = chars;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  renderAnswers();
}

function cleanQuery(text) {
  return text.trim().replace(/[؟\?،,؛]/g, '').replace(/ي/g, 'ی').replace(/ك/g, 'ک');
}

async function searchAnswers() {
  const raw = document.getElementById('term').value;
  const q = cleanQuery(raw);
  const out = document.getElementById('output');
  const gBtn = document.getElementById('gBtn');

  if (!q) return;

  gBtn.style.display = 'block';
  gBtn.href = `https://www.google.com/search?q=${encodeURIComponent(q + " در جدول")}`;

  out.innerHTML = '<div class="empty">در حال استخراج کلمات خالص...</div>';
  currentAnswers = [];

  // ۱. بررسی بانک جدول محلی
  for (let key in TABLE_DB) {
    if (key === q || q.includes(key) || key.includes(q)) {
      currentAnswers.push(...TABLE_DB[key]);
    }
  }

  // ۲. استخراج واژه‌های آنلاین فقط به‌صورت کلمه خالص (بدون توضیحات)
  try {
    const url = `https://fa.wiktionary.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&utf8=&format=json&origin=*`;
    const res = await fetch(url);
    const data = await res.json();

    if (data.query?.search) {
      data.query.search.forEach(item => {
        // فیلتر کردن عناوین و متون برای رسیدن به کلمه خالص
        let clean = item.snippet.replace(/<[^>]*>/g, ' ')
                                .replace(/[،,؛;:.\-()«»"'/\\?!؟]/g, ' ');
        let words = clean.split(/\s+/).map(w => w.trim()).filter(w => {
          return w.length >= 2 && 
                 w.length <= 8 && 
                 /^[\u0600-\u06FF]+$/.test(w) && 
                 !['برای', 'است', 'شدن', 'کردن', 'یعنی', 'معنی', 'همچنین', 'دارد', 'بودن', 'کلمه', 'یک', 'این', 'آن'].includes(w);
        });
        currentAnswers.push(...words);
      });
    }
  } catch (err) {
    // در صورت قطعی اینترنت، همان بانک داخلی کفایت می‌کند
  }

  // حذف موارد تکراری و کلمه جستجو شده
  currentAnswers = [...new Set(currentAnswers.filter(w => w !== q))];
  renderAnswers();
}

function renderAnswers() {
  const out = document.getElementById('output');
  
  let list = currentAnswers;
  if (activeFilter > 0) {
    list = list.filter(w => w.length === activeFilter);
  }

  if (list.length === 0) {
    out.innerHTML = '<div class="empty">موردی یافت نشد. می‌توانید با دکمه قرمز زیر در جدول‌های آنلاین ببینید.</div>';
    return;
  }

  // گروه‌بندی کلمات بر اساس تعداد حروف
  const grouped = {};
  list.forEach(word => {
    const len = word.length;
    if (!grouped[len]) grouped[len] = [];
    grouped[len].push(word);
  });

  let html = '';
  // مرتب‌سازی از کلمات کوتاه به بلند (۲ حرفی، ۳ حرفی و...)
  const sortedLengths = Object.keys(grouped).sort((a,b) => a - b);

  sortedLengths.forEach(len => {
    html += `
      <div class="group-box">
        <div class="group-title">
          <span>کلمات ${len} حرفی</span>
          <span>(${grouped[len].length} کلمه)</span>
        </div>
        <div class="words-list">
          ${grouped[len].map(w => `<span class="word-tag">${w}</span>`).join('')}
        </div>
      </div>
    `;
  });

  out.innerHTML = html;
}
</script>
</body>
</html>
