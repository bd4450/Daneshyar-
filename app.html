<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشیار • جستجوی جامع اطلاعات و حل جدول</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, 'Vazir', sans-serif; }
        body { background: #f8fafc; padding: 16px; color: #1e293b; }
        .container { max-width: 600px; margin: auto; background: #ffffff; padding: 22px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        h1 { color: #1e3a8a; text-align: center; font-size: 1.5rem; margin-bottom: 6px; }
        p.sub { color: #64748b; text-align: center; font-size: 0.85rem; margin-bottom: 18px; }
        .search-box { display: flex; gap: 8px; margin-bottom: 12px; }
        input { flex: 1; padding: 13px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 1rem; outline: none; transition: 0.2s; }
        input:focus { border-color: #1e3a8a; }
        .btn { background: #1e3a8a; color: white; border: none; border-radius: 10px; padding: 0 18px; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
        .btn:active { background: #172554; }
        .actions { display: flex; gap: 8px; margin-bottom: 16px; }
        .btn-google { flex: 1; background: #ea4335; color: white; border: none; border-radius: 8px; padding: 10px; font-size: 0.85rem; cursor: pointer; text-align: center; text-decoration: none; font-weight: bold; display: inline-block; }
        .btn-google:hover { background: #dc2626; }
        .filter-row { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 14px; }
        .filter-label { font-size: 0.78rem; color: #64748b; white-space: nowrap; }
        .chip { background: #e2e8f0; border: none; padding: 5px 10px; border-radius: 15px; font-size: 0.78rem; cursor: pointer; white-space: nowrap; }
        .chip.active { background: #1e3a8a; color: white; }
        .res-card { background: #f8fafc; border: 1px solid #e2e8f0; border-right: 4px solid #1e3a8a; padding: 14px; border-radius: 10px; margin-bottom: 12px; }
        .res-title { font-weight: bold; color: #1e3a8a; font-size: 1.05rem; margin-bottom: 6px; }
        .res-body { font-size: 0.9rem; line-height: 1.6; color: #334155; }
        .badge { display: inline-block; background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; margin-top: 8px; }
        .empty { text-align: center; color: #94a3b8; padding: 30px 0; font-size: 0.9rem; line-height: 1.6; }
        .loading { text-align: center; color: #1e3a8a; padding: 25px 0; font-size: 0.95rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>دانشیار • جستجوی کلمات و جدول</h1>
    <p class="sub">جستجوی هوشمند در لغت‌نامه‌ها، ضرب‌المثل‌ها، کنایات و مفاهیم</p>

    <div class="search-box">
        <input type="text" id="term" placeholder="جستجو: ضرب‌المثل، کنایه، لغت، جزایر ژاپن..." autofocus>
        <button class="btn" onclick="executeSearch()">جستجو</button>
    </div>

    <div class="actions">
        <a id="googleLink" href="#" target="_blank" class="btn-google" style="display:none;">
            🔍 جستجوی جدول در گوگل برای این واژه
        </a>
    </div>

    <div class="filter-row">
        <span class="filter-label">فیلتر طول واژه:</span>
        <button class="chip active" onclick="setCharLimit(0, this)">همه</button>
        <button class="chip" onclick="setCharLimit(2, this)">۲ حرف</button>
        <button class="chip" onclick="setCharLimit(3, this)">۳ حرف</button>
        <button class="chip" onclick="setCharLimit(4, this)">۴ حرف</button>
        <button class="chip" onclick="setCharLimit(5, this)">۵ حرف</button>
        <button class="chip" onclick="setCharLimit(6, this)">۶ حرف</button>
        <button class="chip" onclick="setCharLimit(7, this)">۷+ حرف</button>
    </div>

    <div id="output">
        <div class="empty">کلمه یا عبارت مورد نظر خود را تایپ کرده و «جستجو» را بزنید.</div>
    </div>
</div>

<script>
let selectedChars = 0;
let lastQuery = '';

function setCharLimit(num, el) {
    selectedChars = num;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    if (lastQuery) filterAndRender();
}

async function executeSearch() {
    const raw = document.getElementById('term').value.trim();
    if (!raw) return;
    lastQuery = raw;

    const out = document.getElementById('output');
    const gLink = document.getElementById('googleLink');
    
    // تنظیم لینک جستجوی کمکی در گوگل به صورت اختصاصی برای جدول و لغتنامه
    gLink.href = `https://www.google.com/search?q=${encodeURIComponent(raw + " حل جدول و کنایه و لغتنامه")}`;
    gLink.style.display = 'block';

    out.innerHTML = '<div class="loading">در حال جستجو در بانک جامع اطلاعات...</div>';

    try {
        // ۱. جستجو در دیتابیس دانشنامه‌ای رسمی با قابلیت جستجوی تمام‌متن
        const res = await fetch(`https://fa.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(raw)}&utf8=&format=json&origin=*`);
        const data = await res.json();
        
        // ۲. واکشی همزمان از بخش ضرب‌المثل‌ها و لغات
        const dictRes = await fetch(`https://fa.wiktionary.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(raw)}&utf8=&format=json&origin=*`);
        const dictData = await dictRes.json();

        window.combinedResults = [];

        if (dictData.query && dictData.query.search) {
            dictData.query.search.forEach(item => {
                window.combinedResults.push({
                    title: item.title,
                    snippet: cleanText(item.snippet),
                    source: "لغت‌نامه و ریشه‌شناسی"
                });
            });
        }

        if (data.query && data.query.search) {
            data.query.search.forEach(item => {
                window.combinedResults.push({
                    title: item.title,
                    snippet: cleanText(item.snippet),
                    source: "دانشنامه عمومی"
                });
            });
        }

        filterAndRender();

    } catch (err) {
        out.innerHTML = `
            <div class="empty">
                ارتباط با سرور برقرار نشد (بررسی اینترنت).<br>
                می‌توانید مستقیم از دکمه قرمز رنگ گوگل بالا استفاده کنید.
            </div>
        `;
    }
}

function cleanText(html) {
    const div = document.createElement("div");
    div.innerHTML = html;
    return div.textContent || div.innerText || "";
}

function filterAndRender() {
    const out = document.getElementById('output');
    let results = window.combinedResults || [];

    if (selectedChars > 0) {
        results = results.filter(item => {
            const len = item.title.replace(/\s+/g, '').length;
            return selectedChars === 7 ? len >= 7 : len === selectedChars;
        });
    }

    if (results.length === 0) {
        out.innerHTML = `
            <div class="empty">
                پاسخ مستقیمی برای این فیلتر پیدا نشد.<br>
                برای دیدن پاسخ کامل، روی <b>دکمه قرمز جستجوی گوگل</b> در بالا بزنید.
            </div>
        `;
        return;
    }

    let html = '';
    results.slice(0, 15).forEach(item => {
        const charLen = item.title.replace(/\s+/g, '').length;
        html += `
            <div class="res-card">
                <div class="res-title">${item.title}</div>
                <div class="res-body">${item.snippet}...</div>
                <div class="badge">${charLen} حرفی • ${item.source}</div>
            </div>
        `;
    });

    out.innerHTML = html;
}

document.getElementById('term').addEventListener('keyup', function(e) {
    if (e.key === 'Enter') executeSearch();
});
</script>

</body>
</html>
