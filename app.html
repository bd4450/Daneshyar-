<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشیار - حل جدول و واژه‌نامه</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #2980b9;
            --bg: #f4f6f7;
            --card-bg: #ffffff;
            --text: #333333;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            direction: rtl;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .search-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            font-size: 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        button {
            padding: 12px 20px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #1c5980;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
        }

        .filter-btn {
            padding: 6px 12px;
            background: #e0e6ed;
            border: none;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            color: var(--primary);
        }

        .filter-btn.active {
            background: var(--accent);
            color: white;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid #ddd;
            margin-bottom: 15px;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            color: #777;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            border-right: 5px solid var(--accent);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .word-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary);
        }

        .letter-count {
            background: #f0f0f0;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            color: #666;
        }

        .clue-text {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #555;
        }

        .external-links {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed #eee;
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
        }

        .external-links a {
            color: var(--accent);
            text-decoration: none;
        }

        .external-links a:hover {
            text-decoration: underline;
        }

        .no-results {
            text-align: center;
            padding: 30px;
            color: #777;
            background: var(--card-bg);
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="search-box">
        <h1>دانشیار (راهنمای حل جدول و واژه‌نامه)</h1>
        
        <div class="input-group">
            <input type="text" id="searchInput" placeholder="کلمه یا راهنمای جدول را بنویسید (مثلاً: برادر مشهدی، انگور)..." onkeyup="handleKeyUp(event)">
            <button onclick="doSearch()">جستجو</button>
        </div>

        <div class="filters">
            <span style="font-size:0.85rem; align-self:center; color:#666;">تعداد حروف:</span>
            <button class="filter-btn active" onclick="setLenFilter(0, this)">همه</button>
            <button class="filter-btn" onclick="setLenFilter(2, this)">۲ حرفی</button>
            <button class="filter-btn" onclick="setLenFilter(3, this)">۳ حرفی</button>
            <button class="filter-btn" onclick="setLenFilter(4, this)">۴ حرفی</button>
            <button class="filter-btn" onclick="setLenFilter(5, this)">۵ حرفی</button>
            <button class="filter-btn" onclick="setLenFilter(6, this)">۶ حرفی و بیشتر</button>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('all', this)">همه نتایج</div>
        <div class="tab" onclick="switchTab('crossword', this)">سوالات جدولی</div>
        <div class="tab" onclick="switchTab('dict', this)">مترادف‌ها و لغات</div>
    </div>

    <div id="resultsList" class="results-list">
        <!-- نتایج اینجا نشان داده می‌شوند -->
    </div>
</div>

<script>
// بانک اطلاعاتی اولیه کلمات و سوالات جدول
const db = [
    { word: "برار", clue: "برادر مشهدی، برادر در لهجه خراسانی", type: "crossword" },
    { word: "کاکو", clue: "برادر شیرازی", type: "crossword" },
    { word: "داداش", clue: "برادر، صمیمی", type: "dict" },
    { word: "تاک", clue: "درخت انگور، مو، رز، عنب", type: "crossword" },
    { word: "مو", clue: "درخت انگور، زلف، موی سر", type: "crossword" },
    { word: "رز", clue: "درخت انگور، گل سرخ", type: "crossword" },
    { word: "عنب", clue: "انگور به عربی", type: "dict" },
    { word: "شوخ", clue: "بذله‌گو، خنده‌رو، چرک، شاد", type: "dict" },
    { word: "کمک", clue: "یاری، امداد، معاونت، دستگیری", type: "dict" },
    { word: "یرا", clue: "دلیری، شجاعت، توانایی", type: "dict" },
    { word: "آب", clue: "مایع حیات، زلال", type: "crossword" },
    { word: "تهران", clue: "پایتخت ایران", type: "crossword" },
    { word: "پاریس", clue: "پایتخت فرانسه، عروس شهرهای اروپا", type: "crossword" },
    { word: "توکیو", clue: "پایتخت ژاپن", type: "crossword" },
    { word: "ریال", clue: "واحد پول ایران", type: "crossword" },
    { word: "دلار", clue: "واحد پول آمریکا", type: "crossword" },
    { word: "یورو", clue: "واحد پول اروپا", type: "crossword" }
];

let selectedLength = 0;
let currentTab = 'all';

function normalize(text) {
    if (!text) return "";
    return text.toString()
        .replace(/[يى]/g, "ی")
        .replace(/[ك]/g, "ک")
        .replace(/[\u064B-\u065F]/g, "") // حذف اعراب
        .replace(/\u200C/g, " ") // تبدیل نیم‌فاصله به فاصله
        .trim();
}

function handleKeyUp(e) {
    if (e.key === 'Enter') {
        doSearch();
    }
}

function setLenFilter(len, btn) {
    selectedLength = len;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    doSearch();
}

function switchTab(tab, element) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    element.classList.add('active');
    doSearch();
}

function doSearch() {
    const query = normalize(document.getElementById('searchInput').value);
    const container = document.getElementById('resultsList');
    container.innerHTML = "";

    if (!query) {
        container.innerHTML = `
            <div class="no-results">
                <h3>آماده جستجو</h3>
                <p>لطفاً کلمه یا عبارت مورد نظر خود را در کادر بالا بگذارید و جستجو را بزنید.</p>
                <p style="font-size:0.85rem; color:#888;">نمونه‌های قابل جستجو: برادر مشهدی، درخت انگور، پایتخت فرانسه، شوخ، کمک</p>
            </div>
        `;
        return;
    }

    const filtered = db.filter(item => {
        const normWord = normalize(item.word);
        const normClue = normalize(item.clue);

        // فیلتر تب
        if (currentTab === 'crossword' && item.type !== 'crossword') return false;
        if (currentTab === 'dict' && item.type !== 'dict') return false;

        // فیلتر طول حروف
        if (selectedLength > 0) {
            if (selectedLength === 6 && normWord.length < 6) return false;
            if (selectedLength < 6 && normWord.length !== selectedLength) return false;
        }

        // مطابقت در کلمه یا راهنما
        return normWord.includes(query) || normClue.includes(query);
    });

    if (filtered.length === 0) {
        container.innerHTML = `
            <div class="no-results">
                <h3>نتیجه‌ای یافت نشد!</h3>
                <p>برای عبارت «${query}» موردی پیدا نشد.</p>
                <div class="external-links" style="justify-content:center; margin-top:15px;">
                    <a href="https://www.google.com/search?q=${encodeURIComponent(query + ' در جدول')}" target="_blank">🔍 جستجو در گوگل</a>
                    <a href="https://vajehyab.com/?q=${encodeURIComponent(query)}" target="_blank">📖 جستجو در واژه‌یاب</a>
                </div>
            </div>
        `;
        return;
    }

    filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="card-header">
                <span class="word-title">${item.word}</span>
                <span class="letter-count">${item.word.length} حرفی</span>
            </div>
            <div class="clue-text"><strong>راهنما / معنی:</strong> ${item.clue}</div>
            <div class="external-links">
                <a href="https://www.google.com/search?q=${encodeURIComponent(item.word)}" target="_blank">جستجوی وب</a>
                <a href="https://vajehyab.com/?q=${encodeURIComponent(item.word)}" target="_blank">معنی در واژه‌یاب</a>
            </div>
        `;
        container.appendChild(card);
    });
}

// اجرای اولیه هنگام باز شدن صفحه
window.onload = function() {
    doSearch();
};
</script>

</body>
</html>
