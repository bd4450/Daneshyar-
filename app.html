<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جستجوی دانشیار</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <style>
    body { font-family: 'Vazirmatn', Tahoma, sans-serif; background: #fdfdfd; padding: 20px; color: #333; }
    .container { max-width: 600px; margin: 0 auto; }
    
    /* کادر جستجو */
    #searchInput {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      border: 2px solid #ccc;
      border-radius: 10px;
      outline: none;
      margin-bottom: 20px;
    }
    #searchInput:focus { border-color: #007bff; }

    /* کارت نتایج */
    .card { background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #eee; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .card h3 { margin: 0 0 5px 0; color: #007bff; }
    .card p { font-size: 14px; color: #666; margin: 0; }
  </style>
</head>
<body>

<div class="container">
  <input type="text" id="searchInput" placeholder="جستجو کنید...">
  <div id="resultsList"></div>
</div>

<script>
  // اگر فایل data1.js دارید، آن استفاده می‌شود، در غیر این صورت لیست خالی است
  const data = (typeof window.data1 !== "undefined") ? window.data1 : [];

  const input = document.getElementById('searchInput');
  const list = document.getElementById('resultsList');

  // تابع جستجوی زنده
  input.addEventListener('input', function() {
    const term = this.value.trim();
    list.innerHTML = '';
    
    if (term.length === 0) return;

    const filtered = data.filter(item => 
      item.title.includes(term) || 
      (item.summary && item.summary.includes(term))
    );

    filtered.forEach(item => {
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `<h3>${item.title}</h3><p>${item.summary || ''}</p>`;
      list.appendChild(div);
    });
  });
</script>

</body>
</html>
