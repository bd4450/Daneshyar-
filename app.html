<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشیار</title>
    <style>
        body { font-family: Tahoma, sans-serif; padding: 20px; background-color: #f9f9f9; margin: 0; }
        .search-container { display: flex; flex-direction: column; gap: 10px; }
        input { padding: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        button { padding: 15px; background-color: #2c3e50; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        #resultDisplay { margin-top: 20px; padding: 15px; background: white; border-radius: 8px; border: 1px solid #ddd; min-height: 50px; }
    </style>
</head>
<body>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="جستجوی کلمه یا سوال...">
        <button id="searchBtn">جستجو در دانشیار</button>
    </div>

    <div id="resultDisplay">نتایج اینجا ظاهر می‌شود...</div>

    <script>
        // ۱. دیتابیس محلی (سوالات خود را اینجا اضافه کنید)
        const localKnowledge = {
            "تهران": "پایتخت ایران و مرکز استان تهران است.",
            "دماوند": "بلندترین کوه ایران و آتشفشان خفته خاورمیانه."
        };

        // ۲. منطق جستجو
        async function getAnswer(query) {
            const q = query.trim();
            if (!q) return "لطفاً چیزی تایپ کنید.";
            
            // چک کردن دیتابیس محلی
            if (localKnowledge[q]) return "پاسخ (محلی): " + localKnowledge[q];

            // چک کردن ویکی‌پدیا
            try {
                const response = await fetch(`https://fa.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(q)}`);
                const data = await response.json();
                if (data.extract) return "پاسخ (ویکی‌پدیا): " + data.extract;
            } catch (e) {
                return "خطا در اتصال به اینترنت.";
            }

            return "متأسفانه پاسخی یافت نشد.";
        }

        // ۳. فعال‌سازی دکمه
        document.getElementById("searchBtn").addEventListener("click", async () => {
            const input = document.getElementById("searchInput").value;
            const display = document.getElementById("resultDisplay");
            display.innerText = "در حال جستجو...";
            const answer = await getAnswer(input);
            display.innerText = answer;
        });
    </script>
</body>
</html>
