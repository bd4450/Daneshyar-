<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشیار - لغت‌نامه</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; padding: 20px; background-color: #f8f9fa; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 20px; padding: 15px; border-top: 1px solid #eee; line-height: 1.8; color: #444; min-height: 50px; }
        .loading { color: #666; font-style: italic; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>واژه‌یاب دانشیار</h2>
    <input type="text" id="wordInput" placeholder="کلمه یا عبارت مورد نظر را بنویسید..." autocomplete="off">
    <button id="searchBtn" onclick="searchWord()">جستجو</button>
    <div id="result"></div>
</div>

<script>
    // عملکرد جستجو
    async function searchWord() {
        const query = document.getElementById('wordInput').value.trim();
        const resultDiv = document.getElementById('result');
        
        if (!query) return;

        resultDiv.innerHTML = '<div class="loading">در حال جستجو...</div>';
        
        try {
            // استفاده از API برای دریافت پاسخ خالص (بدون تبلیغات)
            const response = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query + ' معنی')}&format=json&no_redirect=1`);
            const data = await response.json();
            
            if (data.AbstractText && data.AbstractText.trim() !== "") {
                resultDiv.innerText = data.AbstractText;
            } else {
                resultDiv.innerText = "نتیجه‌ای یافت نشد. لطفاً کلمه را چک کنید.";
            }
        } catch (error) {
            resultDiv.innerText = "خطا در اتصال به سرور. لطفا اینترنت خود را بررسی کنید.";
        }
    }

    // قابلیت جستجو با دکمه Enter کیبورد
    document.getElementById("wordInput").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            searchWord();
        }
    });
</script>

</body>
</html>
