<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جستجوی دانشیار</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f0f2f5; padding: 12px; color: #333; direction: rtl; }
    .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 14px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); }
    
    .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
    #searchInput { 
      flex: 1; 
      padding: 12px 14px; 
      border: 2px solid #1e3c72; 
      border-radius: 8px; 
      font-size: 15px; 
      outline: none;
      background: #fafafa;
    }
    #searchInput:focus { background: #fff; border-color: #0d2346; }
    
    #searchBtn { 
      padding: 12px 20px; 
      background: #1e3c72; 
      color: #ffffff; 
      border: none; 
      border-radius: 8px; 
      font-size: 15px; 
      font-weight: bold;
      cursor: pointer; 
    }
    #searchBtn:active { background: #112240; transform: scale(0.98); }

    .tabs-container { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; }
    .tab-btn { 
      padding: 7px 14px; 
      border: 1px solid #d1d5db; 
      background: #f3f4f6; 
      border-radius: 20px; 
      font-size: 13px; 
      cursor: pointer; 
      white-space: nowrap;
      color: #4b5563;
      transition: all 0.2s;
    }
    .tab-btn.active { 
      background: #1e3c72; 
      color: #ffffff; 
      border-color: #1e3c72; 
      font-weight: bold;
    }

    .results { display: flex; flex-direction: column; gap: 10px; }
    .item { background: #f9fafb; border: 1px solid #e5e7eb; border-right: 4px solid #1e3c72; padding: 12px; border-radius: 8px; }
    .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .item-word { font-weight: bold; font-size: 17px; color: #1e3c72; }
    .badge { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: #e0e7ff; color: #3730a3; font-weight: bold; }
    .item-meaning { font-size: 14px; line-height: 1.6; color: #374151; text-align: justify; }
    .empty-msg { text-align: center; color: #6b7280; padding: 25px 10px; font-size: 14px; }
  </style>
</head>
<body>

<div class="container">
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="کلمه یا الگوی جدول (مثلاً پ__ت)...">
    <button type="button" id="searchBtn">جستجو</button>
  </div>

  <div class="tabs-container">
    <button type="button" class="tab-btn active" data-src="all">همه</button>
    <button type="button" class="tab-btn" data-src="دهخدا">دهخدا</button>
    <button type="button" class="tab-btn" data-src="معین">معین</button>
    <button type="button" class="tab-btn" data-src="عمید">عمید</button>
    <button type="button" class="tab-btn" data-src="آبادیس">آبادیس</button>
  </div>

  <div class="results" id="resultsContainer">
    <div class="empty-msg">برای مشاهده نتیجه، کلمه‌ای بنویسید یا دکمه جستجو را لمس کنید.</div>
  </div>
</div>

<script>
// بانک واژگان نمونه فرهنگ‌ها
const database = [
  { w: "پایتخت", m: "مرکز حکومت و مقر اصلی دولت کشور", s: "معین" },
  { w: "پایتخت", m: "دارالسلطنه، تختگاه، کرسی نشین، دارالخلافه", s: "دهخدا" },
  { w: "پایتخت", m: "شهر مرکزی که نهادهای اداری و سیاسی در آن قرار دارد", s: "آبادیس" },
  { w: "پوست", m: "پوشش خارجی تن انسان و حیوان، جِلد", s: "عمید" },
  { w: "پوست", m: "قشر، غشا، آنچه روی مغز یا گوشت را می‌پوشاند", s: "دهخدا" },
  { w: "پست", m: "پایین، فرومایه؛ اداره ارسال مرسولات و نامه‌ها", s: "معین" },
  { w: "پست", m: "خوار، زبون، دنی؛ دستگاه پیک و چاپار", s: "عمید" },
  { w: "پرواز", m: "پریدن در هوا، اوج گرفتن، سیر پرنده و هواپیما", s: "معین" },
  { w: "پرواز", m: "طیران، پریدن جانور پردار در هوا", s: "دهخدا" },
  { w: "آزادی", m: "حریت، رهایی، نبود مانع و اسارت", s: "آبادیس" },
  { w: "آزادی", m: "خلاصی، رستگاری، فراغت از بندگی و قید", s: "دهخدا" },
  { w: "آزادی", m: "قدرت عمل و تصمیم‌گیری مستقل", s: "عمید" },
  { w: "خورشید", m: "آفتاب، مهر، خور، ستاره پرنور منظومه شمسی", s: "دهخدا" },
  { w: "خورشید", m: "چشمه نور و گرمابخش زمین", s: "معین" },
  { w: "دریا", m: "پهنه‌ای پهناور از آب شور؛ بحر، یم", s: "عمید" },
  { w: "دریا", m: "توده آب بزرگ محصور در خشکی‌ها؛ بحر", s: "آبادیس" },
  { w: "ستاره", m: "کوکب، اختر، جرم آسمانی فروزان", s: "معین" },
  { w: "ستاره", m: "اجرام نورانی شبانه؛ طالع و بخت", s: "دهخدا" },
  { w: "کتاب", m: "نامه، نوشته، صحیفه، دفتر شعر یا علم", s: "دهخدا" },
  { w: "کتاب", m: "مجموعه برگ‌های به هم پیوسته شامل متن و دانش", s: "آبادیس" },
  { w: "باران", m: "قطرات آب حاصل از تراکم ابر که بر زمین می‌بارد", s: "عمید" },
  { w: "باران", m: "مطر، غیث، رحمت الهی به صورت آب بارنده", s: "معین" },
  { w: "دانشیار", m: "رتبه علمی در دانشگاه میان استادیار و استاد", s: "معین" },
  { w: "دانشیار", m: "یار و یاور دانش؛ پژوهنده دانایی", s: "دهخدا" }
];

let activeTab = 'all';

function executeSearch() {
  const query = document.getElementById('searchInput').value.trim();
  const container = document.getElementById('resultsContainer');

  if (!query) {
    container.innerHTML = '<div class="empty-msg">لطفاً کلمه‌ای برای جستجو وارد کنید.</div>';
    return;
  }

  const isCrossword = query.includes('_');
  let results = [];

  if (isCrossword) {
    const pattern = new RegExp('^' + query.replace(/_/g, '.') + '$');
    results = database.filter(item => {
      const matchTab = (activeTab === 'all' || item.s === activeTab);
      return matchTab && item.w.length === query.length && pattern.test(item.w);
    });
  } else {
    results = database.filter(item => {
      const matchTab = (activeTab === 'all' || item.s === activeTab);
      return matchTab && item.w.includes(query);
    });
  }

  if (results.length === 0) {
    container.innerHTML = '<div class="empty-msg" style="color:#d9534f;">موردی در این لغت‌نامه پیدا نشد.</div>';
    return;
  }

  container.innerHTML = results.map(item => `
    <div class="item">
      <div class="item-header">
        <span class="item-word">${item.w}</span>
        <span class="badge">${item.s}</span>
      </div>
      <div class="item-meaning">${item.m}</div>
    </div>
  `).join('');
}

// رویدادهای تب‌ها و دکمه جستجو
document.addEventListener('DOMContentLoaded', () => {
  const searchBtn = document.getElementById('searchBtn');
  const searchInput = document.getElementById('searchInput');
  const tabs = document.querySelectorAll('.tab-btn');

  // اتصال دکمه جستجو
  searchBtn.addEventListener('click', executeSearch);

  // اتصال کلید اینتر کیبورد
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      executeSearch();
    }
  });

  // جستجوی خودکار حین نوشتن
  searchInput.addEventListener('input', executeSearch);

  // فعال‌سازی تب‌های ۵ گانه
  tabs.forEach(tab => {
    tab.addEventListener('click', function() {
      tabs.forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      activeTab = this.getAttribute('data-src');
      executeSearch();
    });
  });
});
</script>

</body>
</html>
