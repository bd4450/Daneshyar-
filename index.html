<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دانشیار | دانشنامه جامع و حل جدول</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border-color: #cbd5e1;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.06);
      --badge-bg: #eff6ff;
      --badge-color: #1d4ed8;
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --border-color: #334155;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
      --badge-bg: #1e3a8a;
      --badge-color: #93c5fd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      transition: background-color 0.2s, color 0.2s;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      padding: 16px;
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border-color);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-title {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--primary);
    }

    .theme-toggle {
      background: none;
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 20px;
      color: var(--text-primary);
      cursor: pointer;
      font-size: 0.85rem;
    }

    /* نوار جستجو به همراه دکمه اختصاصی */
    .search-container {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .search-input-wrapper {
      position: relative;
      flex: 1;
    }

    .search-input {
      width: 100%;
      padding: 12px 38px 12px 14px;
      font-size: 1rem;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      background-color: var(--card-bg);
      color: var(--text-primary);
      outline: none;
      box-shadow: var(--shadow);
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .clear-btn {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 1.1rem;
      color: var(--text-secondary);
      cursor: pointer;
      display: none;
    }

    .btn-search {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow);
      white-space: nowrap;
    }

    .btn-search:active {
      opacity: 0.85;
    }

    .stats-bar {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
    }

    .results-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--primary);
    }

    .card-subtitle {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-right: 6px;
    }

    .badge {
      background-color: var(--badge-bg);
      color: var(--badge-color);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .card-content {
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
      line-height: 1.8;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <span class="logo-title">📚 دانشیار</span>
    </div>
    <button class="theme-toggle" id="themeBtn">🌙 حالت شب</button>
  </header>

  <!-- بخش جستجو همراه با دکمه اختصاصی -->
  <div class="search-container">
    <div class="search-input-wrapper">
      <input type="text" id="searchInput" class="search-input" placeholder="عبارت، کلمه جدول یا پاسخ مورد نظر..." autocomplete="off">
      <button id="clearBtn" class="clear-btn" title="پاک کردن">✕</button>
    </div>
    <button id="searchBtn" class="btn-search">
      <span>🔍</span>
      <span>جستجو</span>
    </button>
  </div>

  <div class="stats-bar">
    <span id="resultCount">در حال بارگذاری دانشنامه...</span>
    <span>نسخه ۱.۰</span>
  </div>

  <div class="results-container" id="resultsList"></div>

  <script>
    let encyclopediaData = [];
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const clearBtn = document.getElementById('clearBtn');
    const resultsList = document.getElementById('resultsList');
    const resultCount = document.getElementById('resultCount');
    const themeBtn = document.getElementById('themeBtn');

    // بارگذاری فایل داده‌ها
    async function initData() {
      try {
        const res = await fetch('data/entries.json');
        if (!res.ok) throw new Error('عدم دسترسی به دیتابیس');
        encyclopediaData = await res.json();
        renderResults(encyclopediaData);
      } catch (err) {
        resultCount.textContent = 'خطا در بارگذاری اطلاعات. لطفاً اتصال را بررسی کنید.';
        console.error(err);
      }
    }

    // رندر کارت‌های یافته‌شده
    function renderResults(items) {
      resultsList.innerHTML = '';
      resultCount.textContent = `تعداد یافته‌ها: ${items.length} مورد`;

      if (items.length === 0) {
        resultsList.innerHTML = '<div class="empty-state">موردی یافت نشد.<br>کلمه دیگری را امتحان کنید.</div>';
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        const keywordsHTML = item.keywords 
          ? item.keywords.map(kw => `<span class="tag">#${kw}</span>`).join('') 
          : '';

        card.innerHTML = `
          <div class="card-header">
            <div>
              <span class="card-title">${item.title_fa}</span>
              ${item.title_en ? `<span class="card-subtitle">(${item.title_en})</span>` : ''}
            </div>
            <span class="badge">${item.category_fa || 'عمومی'}</span>
          </div>
          <div class="card-content">${item.content_fa || item.desc || ''}</div>
          <div class="keywords">${keywordsHTML}</div>
        `;
        resultsList.appendChild(card);
      });
    }

    // تابع اصلی اجرای جستجو
    function executeSearch() {
      const q = searchInput.value.trim().toLowerCase();
      
      if (!q) {
        renderResults(encyclopediaData);
        return;
      }

      const filtered = encyclopediaData.filter(item => {
        const titleFa = (item.title_fa || '').toLowerCase();
        const titleEn = (item.title_en || '').toLowerCase();
        const contentFa = (item.content_fa || item.desc || '').toLowerCase();
        const keywords = (item.keywords || []).map(k => k.toLowerCase());

        return titleFa.includes(q) || 
               titleEn.includes(q) || 
               contentFa.includes(q) || 
               keywords.some(k => k.includes(q));
      });

      renderResults(filtered);
    }

    // کلیک روی دکمه اختصاصی جستجو
    searchBtn.addEventListener('click', executeSearch);

    // زدن کلید Enter روی کیبورد گوشی
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        executeSearch();
      }
    });

    // نمایش یا عدم نمایش دکمه ضربدر پاک‌کردن
    searchInput.addEventListener('input', (e) => {
      if (e.target.value.length > 0) {
        clearBtn.style.display = 'block';
      } else {
        clearBtn.style.display = 'none';
        renderResults(encyclopediaData);
      }
    });

    // عملکرد دکمه ضربدر
    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearBtn.style.display = 'none';
      searchInput.focus();
      renderResults(encyclopediaData);
    });

    // حالت شب و روز
    themeBtn.addEventListener('click', () => {
      const isDark = document.body.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.body.removeAttribute('data-theme');
        themeBtn.textContent = '🌙 حالت شب';
      } else {
        document.body.setAttribute('data-theme', 'dark');
        themeBtn.textContent = '☀️ حالت روز';
      }
    });

    document.addEventListener('DOMContentLoaded', initData);
  </script>
</body>
</html>
