<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشیار</title>
    <style>
        body { font-family: Tahoma, sans-serif; padding: 20px; line-height: 1.6; }
        input { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        .result-item { padding: 10px; border-bottom: 1px solid #eee; }
        .term { font-weight: bold; color: #2c3e50; }
    </style>
</head>
<body>

    <h1>دانشیار</h1>
    <input type="text" id="searchInput" placeholder="جستجو کنید (مثال: آزادی)..." oninput="performSearch()">
    <div id="results"></div>

    <script>
        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const resultsContainer = document.getElementById('results');
            
            if (query === "") {
                resultsContainer.innerHTML = "";
                return;
            }

            try {
                const response = await fetch('data.json');
                const data = await response.json();
                
                const matches = data.filter(item => item.term.toLowerCase().includes(query));
                
                resultsContainer.innerHTML = matches.length > 0 
                    ? matches.map(m => `<div class="result-item"><span class="term">${m.term}:</span> ${m.definition}</div>`).join('')
                    : "موردی یافت نشد.";
            } catch (error) {
                resultsContainer.innerHTML = "خطا در بارگذاری اطلاعات.";
            }
        }
    </script>
</body>
</html>
