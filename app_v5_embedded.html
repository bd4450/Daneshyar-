<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دانشیار</title>
<style>
    :root { --accent: #059669; --bg: #f8fafc; }
    body { font-family: Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 15px; padding-bottom: 80px; }
    .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
    input { flex: 1; padding: 15px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1rem; outline: none; }
    input:focus { border-color: var(--accent); }
    
    .results { margin-bottom: 20px; }
    .card { background: #fff; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 10px; }
    
    /* دکمه‌های پایین صفحه که همیشه هستند */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; padding: 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; border-top: 1px solid #e2e8f0; }
    .nav-btn { background: #f1f5f9; border: none; padding: 10px 5px; border-radius: 8px; font-size: 0.7rem; color: #475569; text-align: center; cursor: pointer; text-decoration: none; }
    .nav-btn:active { background: var(--accent); color: white; }
</style>
</head>
<body>

<div class="search-box">
  <input type="text" id="q" placeholder="جستجوی واژه...">
  <button id="searchBtn" style="background:var(--accent); color:white; border:none; padding:0 20px; border-radius:12px;">جستجو</button>
</div>

<div class="results" id="results"></div>

<div class="bottom-nav">
  <a id="btn-deh" class="nav-btn" target="_blank">دهخدا</a>
  <a id="btn-moe" class="nav-btn" target="_blank">معین</a>
  <a id="btn-ami" class="nav-btn" target="_blank">عمید</a>
  <a id="btn-aba" class="nav-btn" target="_blank">آبادیس</a>
</div>

<script>
// بانک اطلاعاتی شما (اینجا را می‌توانید گسترش دهید)
const DATA = [
  ["من", "ضمیر", "ضمیر اول شخص مفرد"],
  ["آب", "اسم", "مایع حیات"],
  ["امید", "اسم", "رجا و آرزو"]
];

const qInput = document.getElementById("q");
const resultsDiv = document.getElementById("results");

function doSearch() {
  const val = qInput.value.trim();
  if(!val) return;

  // آپدیت لینک‌های پایین
  const enc = encodeURIComponent(val);
  document.getElementById("btn-deh").href = "https://www.vajehyab.com/?q=" + enc + "&d=dehkhoda";
  document.getElementById("btn-moe").href = "https://www.vajehyab.com/?q=" + enc + "&d=moein";
  document.getElementById("btn-ami").href = "https://www.vajehyab.com/?q=" + enc + "&d=amid";
  document.getElementById("btn-aba").href = "https://abadis.ir/fatofa/?q=" + enc;

  // جستجو در بانک خودمان
  const res = DATA.filter(r => r[0].includes(val));
  resultsDiv.innerHTML = "";
  
  if(res.length > 0) {
    res.forEach(item => {
      resultsDiv.innerHTML += `<div class="card"><strong>${item[0]}</strong> (${item[1]})<br><small>${item[2]}</small></div>`;
    });
  } else {
    resultsDiv.innerHTML = `<div class="card">موردی یافت نشد. از دکمه‌های پایین برای جستجو در سایت‌ها استفاده کنید.</div>`;
  }
}

document.getElementById("searchBtn").onclick = doSearch;
qInput.addEventListener("keydown", (e) => { if(e.key === "Enter") doSearch(); });
</script>
</body>
</html>
