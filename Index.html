<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشیار - حل جدول</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { background: #f1f5f9; margin: 0; padding: 12px; }
        .box { max-width: 500px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1e40af; margin-top: 0; }
        .version-badge { background: #dcfce7; color: #166534; padding: 4px 8px; border-radius: 6px; font-size: 12px; text-align: center; margin-bottom: 12px; font-weight: bold; }
        .input-row { display: flex; gap: 8px; margin-bottom: 10px; }
        input { flex: 1; padding: 12px; border: 2px solid #3b82f6; border-radius: 8px; font-size: 16px; outline: none; }
        button { background: #2563eb; color: #fff; border: none; padding: 0 16px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .quick-tags { display: flex; gap: 6px; margin-bottom: 15px; flex-wrap: wrap; }
        .tag { background: #e0e7ff; color: #3730a3; padding: 5px 10px; border-radius: 15px; font-size: 12px; cursor: pointer; }
        .item { background: #f8fafc; border: 1px solid #cbd5e1; border-right: 5px solid #2563eb; padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .item-q { font-size: 13px; color: #64748b; margin-top: 3px; }
        .item-a { font-size: 17px; font-weight: bold; color: #0f172a; }
        .badge { background: #eff6ff; color: #1d4ed8; padding: 3px 8px; border-radius: 5px; font-size: 12px; font-weight: bold; }
        .msg { text-align: center; color: #64748b; padding: 15px; }
    </style>
</head>
<body>

<div class="box">
    <h2>دانشیار کلمات متقاطع</h2>
    <div class="version-badge" id="vBadge">نسخه ۳.۰ (بارگذاری شد ✅)</div>

    <div class="input-row">
        <input type="text" id="qInput" placeholder="کلمه یا سوال جدول..." />
        <button onclick="runSearch()">جستجو</button>
    </div>

    <div class="quick-tags">
        <span style="font-size: 12px; color: #64748b; align-self: center;">تست‌های سریع:</span>
        <span class="tag" onclick="quickTest('پایتخت')">پایتخت</span>
        <span class="tag" onclick="quickTest('شاعر')">شاعر</span>
        <span class="tag" onclick="quickTest('ایران')">ایران</span>
        <span class="tag" onclick="quickTest('رود')">رود</span>
    </div>

    <div id="results">
        <div class="msg">برای تست، روی یکی از برچسب‌های بالا (مثل «پایتخت») ضربه بزنید یا کلمه‌ای بنویسید.</div>
    </div>
</div>

<script>
    var data = [
        { a: "اسلو", q: "پایتخت کشور نروژ" },
        { a: "اتاوا", q: "پایتخت کشور کانادا" },
        { a: "رم", q: "پایتخت کشور ایتالیا" },
        { a: "پاریس", q: "پایتخت فرانسه" },
        { a: "برلین", q: "پایتخت آلمان" },
        { a: "باکو", q: "پایتخت جمهوری آذربایجان" },
        { a: "کابل", q: "پایتخت افغانستان" },
        { a: "مسکو", q: "پایتخت روسیه" },
        { a: "دماوند", q: "بلندترین قله ایران" },
        { a: "کارون", q: "پرآب‌ترین و طویل‌ترین رود ایران" },
        { a: "ارس", q: "رود مرزی شمال غرب ایران" },
        { a: "فردوسی", q: "شاعر بزرگ و سراینده شاهنامه" },
        { a: "حافظ", q: "لسان الغیب، غزلسرای نامدار ایران" },
        { a: "سعدی", q: "استاد سخن و نویسنده گلستان و بوستان" },
        { a: "مولوی", q: "عارف بزرگ و خالق مثنوی معنوی" },
        { a: "خیام", q: "ریاضیدان، فیلسوف و سراینده رباعیات" },
        { a: "پارس", q: "نام تاریخی و باستانی ایران" },
        { a: "کوروش", q: "بنیانگذار سلسله هخامنشی در ایران باستان" },
        { a: "تخت جمشید", q: "پرسپولیس، پایتخت آیینی هخامنشیان" },
        { a: "ارگ بم", q: "بزرگترین سازه خشتی جهان در استان کرمان" },
        { a: "ابوعلی سینا", q: "پزشک و فیلسوف بزرگ، صاحب کتاب قانون" },
        { a: "زکریای رازی", q: "پزشک، دانشمند و کاشف الکل" },
        { a: "جیوه", q: "تنها فلز مایع در دمای اتاق" },
        { a: "هلیوم", q: "گاز سبک و نجیب" },
        { a: "اکسیژن", q: "عنصر حیاتی برای تنفس" },
        { a: "شترمرغ", q: "بزرگترین پرنده زنده جهان" }
    ];

    function clean(s) {
        if (!s) return "";
        return s.toString()
            .replace(/ي/g, "ی")
            .replace(/ك/g, "ک")
            .replace(/\s+/g, " ")
            .trim()
            .toLowerCase();
    }

    function runSearch() {
        var val = document.getElementById("qInput").value;
        var q = clean(val);
        var container = document.getElementById("results");
        container.innerHTML = "";

        if (!q) {
            container.innerHTML = '<div class="msg">لطفاً کلمه‌ای بنویسید.</div>';
            return;
        }

        var found = [];
        for (var i = 0; i < data.length; i++) {
            var item = data[i];
            if (clean(item.a).indexOf(q) !== -1 || clean(item.q).indexOf(q) !== -1) {
                found.push(item);
            }
        }

        if (found.length === 0) {
            container.innerHTML = '<div class="msg">موردی برای «' + val + '» پیدا نشد. کلمه دیگری امتحان کنید.</div>';
            return;
        }

        for (var j = 0; j < found.length; j++) {
            var res = found[j];
            var lettersCount = res.a.replace(/\s+/g, "").length;
            var el = document.createElement("div");
            el.className = "item";
            el.innerHTML = 
                '<div>' +
                    '<div class="item-a">' + res.a + '</div>' +
                    '<div class="item-q">' + res.q + '</div>' +
                '</div>' +
                '<div class="badge">' + lettersCount + ' حرفی</div>';
            container.appendChild(el);
        }
    }

    function quickTest(word) {
        document.getElementById("qInput").value = word;
        runSearch();
    }

    document.getElementById("qInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") runSearch();
    });
</script>

</body>
</html>
